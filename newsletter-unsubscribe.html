<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — Our Hotel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
:root {
  --ink: #14181f; --ivory: #f6f1e7; --brass: #b98d45; --brass-light: #d9b876;
  --teal: #2f5d5a; --danger: #a3392a; --text-muted: #6b6355; --text-on-ink: #ede6d6; --radius: 3px;
  --font-display: 'Fraunces', serif; --font-body: 'Inter', -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: var(--ivory); color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
h1 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; }
a { color: inherit; }
.site-nav { background: var(--ink); }
.site-nav .wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px; height: 76px; display: flex; align-items: center; }
.brand { font-family: var(--font-display); font-size: 1.3rem; color: var(--ivory); }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 24px; }
.card { max-width: 460px; text-align: center; background: #fff; border: 1px solid rgba(107,99,85,0.12); border-radius: 4px; padding: 48px 40px; }
.icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; font-size: 1.5rem; }
.icon.success { background: rgba(47,93,90,0.12); color: var(--teal); }
.icon.error { background: rgba(163,57,42,0.1); color: var(--danger); }
h1 { font-size: 1.5rem; margin-bottom: 12px; }
p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 26px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 26px; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500; background: var(--brass); color: var(--ink); }
.btn:hover { background: var(--brass-light); }
footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.8rem; }
</style>
</head>
<body>

<nav class="site-nav"><div class="wrap"><a href="index.html" class="brand">Our Hotel</a></div></nav>

<main>
  <div class="card" id="resultCard">
    <div class="icon" id="resultIcon">&hellip;</div>
    <h1 id="resultTitle">One moment&hellip;</h1>
    <p id="resultMessage">Processing your request.</p>
    <a href="index.html" class="btn">Back to home</a>
  </div>
</main>

<footer>&copy; <span id="year"></span> Our Hotel</footer>

<script>
(function () {
  "use strict";
  const API_BASE = "https://uyeh-hotel-backend.onrender.com/api";

  async function unsubscribe() {
    const token = new URLSearchParams(window.location.search).get("token");
    const icon = document.getElementById("resultIcon");
    const title = document.getElementById("resultTitle");
    const message = document.getElementById("resultMessage");

    if (!token) {
      icon.className = "icon error"; icon.textContent = "!";
      title.textContent = "Missing token";
      message.textContent = "This link looks incomplete — try copying it again from your email.";
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/newsletter/unsubscribe?token=${encodeURIComponent(token)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Couldn't process this request.");

      icon.className = "icon success"; icon.textContent = "\u2713";
      title.textContent = "You're unsubscribed";
      message.textContent = data.message || "You won't hear from us again — sorry to see you go.";
    } catch (err) {
      icon.className = "icon error"; icon.textContent = "!";
      title.textContent = "Couldn't unsubscribe";
      message.textContent = err.message;
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    unsubscribe();
    document.getElementById("year").textContent = new Date().getFullYear();
  });
})();
</script>
</body>
</html>
