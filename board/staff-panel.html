<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Panel — Uyeh Hotel</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   Uyeh HOTEL — STAFF PANEL
   Most restricted tier. Same design tokens as Director/Manager
   dashboards. No staff management, no settings — a Staff account
   only ever gets the operational sections a Manager granted them
   via checkbox permissions at account creation. Single-file SPA.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #14181f; --ink-light: #1c2230; --ivory: #f6f1e7; --panel: #ffffff;
  --border: #e6e0d2; --border-soft: rgba(20,24,31,0.08);
  --brass: #b98d45; --brass-dark: #96712f; --teal: #2f5d5a; --danger: #a3392a; --info: #3b6ea5;
  --text-muted: #6b6355; --text-on-dark: #ede6d6; --text-on-dark-muted: rgba(237,230,214,0.6);
  --font-display: 'Fraunces', serif; --font-body: 'Inter', -apple-system, sans-serif; --radius: 8px;
}

body { font-family: var(--font-body); background: var(--ivory); color: var(--ink); overflow-x: hidden; font-size: 14px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
a { color: inherit; }

/* LOGIN */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ink); }
.login-card { background: var(--panel); padding: 48px 40px; border-radius: var(--radius); width: 100%; max-width: 380px; }
.login-card .brand { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 6px; }
.login-card .brand span { color: var(--brass); }
.login-card p.sub { color: var(--text-muted); margin-bottom: 28px; font-size: 0.88rem; }

/* SIDEBAR */
.sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 270px; background: var(--ink);
  border-right: 1px solid rgba(237,230,214,0.08); padding: 26px 0; z-index: 1000; overflow-y: auto; transition: transform 0.3s ease; }
.sidebar-header { padding: 0 26px 22px; border-bottom: 1px solid rgba(237,230,214,0.08); display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--brass-dark), var(--brass));
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 1.1rem; }
.logo-text { font-family: var(--font-display); font-size: 1.2rem; color: var(--text-on-dark); }
.logo-text span { color: var(--brass); }

.admin-info { padding: 18px 26px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(237,230,214,0.08); }
.admin-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), #3d7873);
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 0.95rem; flex-shrink: 0; }
.admin-details .admin-name { color: var(--text-on-dark); font-size: 0.88rem; font-weight: 600; }
.admin-details .admin-role { color: var(--brass); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }
.admin-details .admin-branch { color: var(--text-on-dark-muted); font-size: 0.74rem; margin-top: 1px; }

.nav-menu { padding: 14px 0; }
.nav-item-standalone { padding: 11px 26px; display: flex; align-items: center; gap: 12px; color: var(--text-on-dark-muted);
  cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; font-size: 0.88rem; font-weight: 500; }
.nav-item-standalone:hover { background: rgba(185,141,69,0.06); color: var(--text-on-dark); }
.nav-item-standalone.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item-standalone i { width: 18px; text-align: center; }
.nav-divider { height: 1px; background: rgba(237,230,214,0.08); margin: 10px 26px 10px; }

.nav-group { margin-bottom: 2px; }
.nav-group-header { padding: 10px 26px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; transition: all 0.15s; }
.nav-group-header:hover { background: rgba(255,255,255,0.02); }
.nav-group-header .group-icon { width: 18px; text-align: center; font-size: 0.85rem; color: rgba(185,141,69,0.6); }
.nav-group-header .group-label { flex: 1; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted); }
.nav-group-header .group-chevron { font-size: 0.65rem; color: rgba(237,230,214,0.25); transition: transform 0.2s; }
.nav-group.open > .nav-group-header .group-chevron { transform: rotate(180deg); color: var(--brass); }
.nav-group.open > .nav-group-header .group-icon, .nav-group.open > .nav-group-header .group-label { color: var(--brass); }
.nav-group-header .group-badge { font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: rgba(163,57,42,0.25); color: #e08a7a; display: none; }
.nav-group-header .group-badge.visible { display: inline-block; }
.nav-group-body { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
.nav-group.open > .nav-group-body { max-height: 600px; }

.nav-item { padding: 10px 26px 10px 50px; display: flex; align-items: center; gap: 11px; color: var(--text-on-dark-muted);
  cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; font-size: 0.84rem; font-weight: 500; position: relative; }
.nav-item:hover { background: rgba(185,141,69,0.05); color: var(--text-on-dark); }
.nav-item.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item i { width: 16px; text-align: center; font-size: 0.82rem; }
.nav-item .nav-badge { margin-left: auto; background: rgba(163,57,42,0.25); color: #e08a7a; padding: 1px 7px; border-radius: 9px; font-size: 0.64rem; font-weight: 700; display: none; }
.nav-item .nav-badge.visible { display: inline-block; }

.sidebar-footer { padding: 16px 26px 0; margin-top: 12px; }
.logout-link { color: var(--text-on-dark-muted); font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.logout-link:hover { color: var(--text-on-dark); }

/* MAIN */
.main-content { margin-left: 270px; min-height: 100vh; }
.topbar { background: rgba(246,241,231,0.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 16px 36px;
  display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 16px; }
.hamburger-btn { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
.hamburger-btn span { width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }
.search-bar { flex: 1; max-width: 420px; position: relative; }
.search-bar input { width: 100%; padding: 10px 16px 10px 40px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.88rem; font-family: var(--font-body); }
.search-bar input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
.search-bar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }
.topbar-actions { display: flex; align-items: center; gap: 14px; }
.topbar-btn { width: 40px; height: 40px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--ink); }

.page-content { padding: 30px 36px 60px; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-title { font-size: 1.5rem; }
.page-subtitle { color: var(--text-muted); font-size: 0.88rem; margin-top: 4px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.stat-card b { font-family: var(--font-display); font-size: 1.6rem; display: block; }
.stat-card span { color: var(--text-muted); font-size: 0.8rem; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }
.panel h3 { font-size: 1.05rem; margin-bottom: 14px; }

table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
tr:last-child td { border-bottom: none; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; text-transform: capitalize; }
.badge-active, .badge-paid, .badge-confirmed, .badge-checked_in, .badge-resolved, .badge-available { background: rgba(47,93,90,0.12); color: var(--teal); }
.badge-inactive, .badge-cancelled, .badge-refunded { background: rgba(163,57,42,0.1); color: var(--danger); }
.badge-pending, .badge-open, .badge-maintenance { background: rgba(179,140,43,0.14); color: var(--brass-dark); }
.badge-in_progress, .badge-cleaning, .badge-occupied { background: rgba(59,110,165,0.12); color: var(--info); }

.btn { font-family: var(--font-body); font-size: 0.84rem; font-weight: 600; padding: 10px 18px; border-radius: var(--radius); border: none; cursor: pointer; transition: opacity 0.15s; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--brass); color: var(--ink); }
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink); }
.btn-outline:hover:not(:disabled) { background: var(--ivory); }
.btn-danger { background: rgba(163,57,42,0.1); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: rgba(163,57,42,0.18); }
.btn-sm { padding: 6px 12px; font-size: 0.78rem; margin-right: 6px; }

.loading-state, .empty-state { text-align: center; color: var(--text-muted); padding: 30px; font-size: 0.86rem; }
.coming-soon { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.coming-soon i { font-size: 2rem; color: var(--brass); margin-bottom: 12px; display: block; }

.notice { padding: 12px 16px; border-radius: var(--radius); font-size: 0.84rem; margin-bottom: 14px; }
.notice.error { background: rgba(163,57,42,0.08); color: var(--danger); border: 1px solid rgba(163,57,42,0.2); }
.notice.success { background: rgba(47,93,90,0.08); color: var(--teal); border: 1px solid rgba(47,93,90,0.2); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
.form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font-body); font-size: 0.86rem; background: #fff; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,24,31,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.modal { background: var(--panel); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.locked-note { display: flex; align-items: flex-start; gap: 10px; background: rgba(59,110,165,0.06); border: 1px solid rgba(59,110,165,0.18);
  border-radius: var(--radius); padding: 12px 16px; font-size: 0.82rem; color: var(--info); margin-bottom: 18px; }
.locked-note i { margin-top: 2px; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .hamburger-btn { display: flex; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand">Uyeh <span>Hotel</span></div>
    <p class="sub">Staff panel — sign in with your staff account.</p>
    <div id="loginNotice"></div>
    <form id="loginForm">
      <div class="form-field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="form-field"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:6px;">Log in</button>
    </form>

    <form id="twoFactorForm" style="display:none;">
      <p class="sub" style="margin-top:0;">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div class="form-field"><label>Code</label><input type="text" id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required autofocus></div>
      <button type="submit" class="btn btn-primary" id="twoFactorBtn" style="width:100%; margin-top:6px;">Verify</button>
      <button type="button" id="twoFactorBackBtn" style="width:100%; margin-top:10px; background:none; border:none; color:var(--text-muted); font-size:0.85rem; cursor:pointer;">&larr; Back to login</button>
    </form>
  </div>
</div>

<div id="appShell" style="display:none;">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">O</div>
      <div class="logo-text">Uyeh <span>Hotel</span></div>
    </div>
    <div class="admin-info" id="adminInfoBlock" onclick="openSecurityModal()" style="cursor:pointer;" title="Account & security">
      <div class="admin-avatar" id="adminAvatar">S</div>
      <div class="admin-details">
        <div class="admin-name" id="adminName"></div>
        <div class="admin-role" id="adminRole"></div>
        <div class="admin-branch" id="adminBranch"></div>
      </div>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="sidebar-footer">
      <div class="logout-link" id="logoutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Log out</div>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <button class="hamburger-btn" id="hamburgerBtn"><span></span><span></span><span></span></button>
      <div class="search-bar"><i class="fas fa-magnifying-glass"></i><input type="text" placeholder="Search…" disabled></div>
      <div class="topbar-actions">
        <div class="topbar-btn" id="ticketsBellBtn"><i class="fas fa-bell"></i><span class="nav-badge" id="ticketsBellBadge" style="position:absolute; top:2px; right:2px;">0</span></div>
      </div>
    </div>
    <div class="page-content" id="pageContent"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG / SESSION
   ============================================================ */
const API_BASE = "https://uyeh-hotel-backend.onrender.com/api";
function getToken() { return localStorage.getItem("stf_token"); }
function getStaff() { try { return JSON.parse(localStorage.getItem("stf_staff")); } catch { return null; } }
function setSession(token, staff) { localStorage.setItem("stf_token", token); localStorage.setItem("stf_staff", JSON.stringify(staff)); }
function clearSession() { localStorage.removeItem("stf_token"); localStorage.removeItem("stf_staff"); }
function hasPermission(perm) { const s = getStaff(); return s && (s.permissions || []).includes(perm); }

/* ============================================================
   API — every call is scoped server-side to this staff member's
   own branch AND filtered to their granted permissions. This
   panel never sends branchId, never touches /admin/staff,
   /admin/branches, /admin/site-settings, /admin/audit-logs, or
   /admin/analytics — those routes shouldn't even respond to a
   STAFF-role token, regardless of what this file does or doesn't
   render.
   ============================================================ */
async function adminRequest(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${getToken()}`, ...(options.headers || {}) },
  });
  if (res.status === 401) { clearSession(); showLogin(); throw new Error("Session expired"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `Request failed (${res.status})`);
    err.code = data.code;
    err.data = data;
    throw err;
  }
  return data;
}

const staffApi = {
  setupTwoFactor: () => adminRequest("/auth/2fa/setup", { method: "POST" }),
  enableTwoFactor: (code) => adminRequest("/auth/2fa/enable", { method: "POST", body: JSON.stringify({ code }) }),
  disableTwoFactor: (password) => adminRequest("/auth/2fa/disable", { method: "POST", body: JSON.stringify({ password }) }),
  login: (email, password) =>
    fetch(`${API_BASE}/auth/staff/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) })
      .then(async (res) => { const data = await res.json(); if (!res.ok) throw new Error(data.error || "Login failed"); return data; }),

  verifyTwoFactor: async (tempToken, code) => {
    const res = await fetch(`${API_BASE}/auth/login/2fa`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tempToken, code }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Verification failed");
    if (!data.staff) throw new Error("Unexpected response — no account data returned");
    return { token: data.token, refreshToken: data.refreshToken, staff: data.staff };
  },

  listRooms: () => adminRequest("/manager/rooms"),
  updateRoomStatus: (id, status) => adminRequest(`/manager/rooms/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) }),

  listHousekeeping: (status) => adminRequest(`/manager/housekeeping${status ? `?status=${status}` : ""}`),
  updateHousekeepingStatus: (roomId, housekeepingStatus) => adminRequest(`/manager/housekeeping/${roomId}`, { method: "PATCH", body: JSON.stringify({ housekeepingStatus }) }),

  listMenuItems: (category) => adminRequest(`/manager/menu${category ? `?category=${category}` : ""}`),

  // Laundry & spa catalogs — the routes already existed on the backend;
  // this panel just never had a way to call them before Place Order.
  listLaundryItems: () => adminRequest("/manager/laundry-items"),
  listSpaTreatments: () => adminRequest("/manager/spa-treatments"),

  listStockItems: () => adminRequest("/manager/stock"),
  listStockMovements: (id) => adminRequest(`/manager/stock/${id}/movements`),
  recordStockMovement: (id, payload) => adminRequest(`/manager/stock/${id}/movements`, { method: "POST", body: JSON.stringify(payload) }),

  listBookings: (status) => adminRequest(`/manager/bookings${status ? `?status=${status}` : ""}`),
  updateBookingStatus: (id, status) => adminRequest(`/manager/bookings/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) }),
  getFolio: (id) => adminRequest(`/manager/bookings/${id}/folio`),
  settleFolio: (id, method) => adminRequest(`/manager/bookings/${id}/folio/settle`, { method: "POST", body: JSON.stringify({ method }) }),

  listTickets: (status) => adminRequest(`/manager/tickets${status ? `?status=${status}` : ""}`),
  assignTicket: (id) => adminRequest(`/manager/tickets/${id}/assign`, { method: "PATCH" }),
  resolveTicket: (id) => adminRequest(`/manager/tickets/${id}/resolve`, { method: "PATCH" }),

  // Was referenced by the Dashboard's "recorded this month" card but
  // never actually defined — any manage_payments account crashed the
  // whole Dashboard on load. The route existed on the backend all along.
  listTransactions: () => adminRequest("/manager/transactions"),
  recordTransaction: (payload) => adminRequest("/manager/transactions", { method: "POST", body: JSON.stringify(payload) }),

  // Walk-in orders — placed by staff on a guest's behalf. Permission is
  // checked per order type on the backend (see server.js), not here.
  searchGuests: (q) => adminRequest(`/manager/guests/search?q=${encodeURIComponent(q)}`),
  createWalkInOrder: (payload) => adminRequest("/manager/orders", { method: "POST", body: JSON.stringify(payload) }),
  listOrders: (status) => adminRequest(`/manager/orders${status ? `?status=${status}` : ""}`),
  updateOrderStatus: (id, status) => adminRequest(`/manager/orders/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) }),

  getReports: () => adminRequest("/manager/reports"),

  // My Shift — the dedicated staff router. Needs no permission at all,
  // just a valid login.
  getMyTasks: () => adminRequest("/staff/my-tasks"),
  getMyShifts: (from) => adminRequest(`/staff/my-shifts${from ? `?from=${from}` : ""}`),
  clockIn: (shiftId, method) => adminRequest(`/staff/shifts/${shiftId}/clock-in`, { method: "POST", body: JSON.stringify({ method }) }),
  clockOut: (shiftId, breakMinutes) => adminRequest(`/staff/shifts/${shiftId}/clock-out`, { method: "POST", body: JSON.stringify({ breakMinutes }) }),

  // Check-in / check-out — the real routes, not the generic status flip.
  checkInBooking: (id, payload) => adminRequest(`/manager/bookings/${id}/check-in`, { method: "POST", body: JSON.stringify(payload) }),
  checkOutBooking: (id, payload) => adminRequest(`/manager/bookings/${id}/check-out`, { method: "POST", body: JSON.stringify(payload) }),
  assignRoom: (id, payload) => adminRequest(`/manager/bookings/${id}/assign-room`, { method: "POST", body: JSON.stringify(payload) }),

  // Order line management (manage_orders) — add/void items, close/reopen.
  getOrder: (id) => adminRequest(`/manager/orders/${id}`),
  addOrderLine: (orderId, payload) => adminRequest(`/manager/orders/${orderId}/lines`, { method: "POST", body: JSON.stringify(payload) }),
  voidOrderLine: (orderId, lineId, payload) => adminRequest(`/manager/orders/${orderId}/lines/${lineId}/void`, { method: "POST", body: JSON.stringify(payload) }),
  closeOrder: (id) => adminRequest(`/manager/orders/${id}/close`, { method: "POST" }),
  reopenOrder: (id) => adminRequest(`/manager/orders/${id}/reopen`, { method: "POST" }),

  // Events (manage_events) — full CRUD, door scan, attendee counts.
  listEvents: () => adminRequest("/manager/events"),
  createEvent: (payload) => adminRequest("/manager/events", { method: "POST", body: JSON.stringify(payload) }),
  updateEvent: (id, payload) => adminRequest(`/manager/events/${id}`, { method: "PATCH", body: JSON.stringify(payload) }),

function renderSidebar() {
  const staff = getStaff();
  if (!staff) return;

  document.getElementById("adminAvatar").textContent = staff.name.charAt(0).toUpperCase();
  document.getElementById("adminName").textContent = staff.name;
  document.getElementById("adminRole").textContent = staff.title || "Staff";
  document.getElementById("adminBranch").textContent = staff.branchName || "";

  const groupsHtml = NAV_GROUPS.map((group) => {
    const visibleItems = group.items.filter((item) => item.permissions
      ? item.permissions.some((p) => (staff.permissions || []).includes(p))
      : (staff.permissions || []).includes(item.permission));
    if (!visibleItems.length) return "";
    return `
      <div class="nav-group open" data-group="${group.id}">
        <div class="nav-group-header" onclick="toggleNavGroup(this)">
          <i class="fas ${group.icon} group-icon"></i>
          <span class="group-label">${group.label}</span>
          <i class="fas fa-chevron-down group-chevron"></i>

            <div class="nav-item" data-page="${item.page}" onclick="switchPage('${item.page}')">
              <i class="fas ${item.icon}"></i><span>${item.label}</span>
              ${item.badgeId ? `<span class="nav-badge" id="${item.badgeId}">0</span>` : ""}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("navMenu").innerHTML = `
    <div class="nav-item-standalone active" data-page="dashboard" onclick="switchPage('dashboard')">
      <i class="fas fa-house"></i><span>Dashboard</span>
    </div>
    <div class="nav-item-standalone" data-page="my-shift" onclick="switchPage('my-shift')">
      <i class="fas fa-clock"></i><span>My Shift</span>
    </div>
    <div class="nav-divider"></div>
    ${groupsHtml}
  `;
}
function toggleNavGroup(headerEl) { headerEl.parentElement.classList.toggle("open"); }
function setActiveNav(page) { document.querySelectorAll(".nav-item, .nav-item-standalone").forEach((el) => el.classList.toggle("active", el.getAttribute("data-page") === page)); }

/* ============================================================
   ROUTER
   ============================================================ */
const PAGE_LOADERS = {
  dashboard: loadDashboardPage,
  "my-shift": loadMyShiftPage,
  rooms: loadRoomsPage,
  housekeeping: loadHousekeepingPage,
  menu: loadMenuPage,
  "place-order": loadPlaceOrderPage,
  orders: loadOrdersQueuePage,
  bookings: loadBookingsPage,
  stock: loadStockPage,
  events: loadEventsPage,
  tickets: loadTicketsPage,
  reports: loadReportsPage,
};

function switchPage(page) {
  const staff = getStaff();
  setActiveNav(page);
  const container = document.getElementById("pageContent");

  // Belt-and-suspenders: even though the nav only ever renders links this
  // account has permission for, a direct switchPage() call (or a stale
  // link) still gets blocked here rather than trusting the click alone.
  const pagePermission = { rooms: "manage_rooms", menu: "manage_menu", bookings: "manage_bookings",
    stock: "manage_stock", events: "manage_events", tickets: "handle_tickets", reports: "view_reports",
    orders: "manage_bookings" }[page];
  const pageAnyPermissions = { "place-order": ["manage_menu", "manage_laundry", "manage_spa"] }[page];
  if (pagePermission && !hasPermission(pagePermission)) {
    container.innerHTML = `<div class="empty-state">You don't have access to this section. Ask your Manager to grant it.</div>`;
    return;
  }
  if (pageAnyPermissions && !pageAnyPermissions.some((p) => hasPermission(p))) {
    container.innerHTML = `<div class="empty-state">You don't have access to this section. Ask your Manager to grant it.</div>`;
    return;
  }

  const loader = PAGE_LOADERS[page];
  if (!loader) { container.innerHTML = `<div class="empty-state">Unknown page.</div>`; return; }
  container.innerHTML = `<div class="loading-state">Loading…</div>`;
  loader();
  if (window.innerWidth <= 900) document.getElementById("sidebar").classList.remove("open");
}
function loadComingSoon(title, description) {
  document.getElementById("pageContent").innerHTML = `
    <div class="page-header"><div><h1 class="page-title">${title}</h1></div></div>
    <div class="panel"><div class="coming-soon"><i class="fas fa-hammer"></i><p><b>${title} isn't built yet.</b></p><p style="margin-top:6px;">${description}</p></div></div>
  `;
}
function pageHeader(title, subtitle, actionHtml = "") {
  return `<div class="page-header"><div><h1 class="page-title">${title}</h1>${subtitle ? `<p class="page-subtitle">${subtitle}</p>` : ""}</div>${actionHtml}</div>`;
}

/* ============================================================
   DASHBOARD — this branch, no staff-count card (staff can't see
   the staff list here at all, unlike the Manager panel)
   ============================================================ */
async function loadDashboardPage() {
  const staff = getStaff();
  const container = document.getElementById("pageContent");
  const cards = [];
  let bookingsPanel = "", ticketsPanel = "";

  try {
    if (hasPermission("manage_bookings")) {
      const { bookings } = await staffApi.listBookings();
      const upcoming = bookings.filter((b) => ["PENDING", "CONFIRMED"].includes(b.status));
      cards.push({ label: "Upcoming bookings", value: upcoming.length });
      if (bookings.length) {
        bookingsPanel = `
          <div class="panel"><h3>Recent bookings</h3>
            <table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th></tr></thead>
              <tbody>${bookings.slice(0, 6).map((b) => `
                <tr><td>${b.guest.name}</td><td>${b.room ? `${b.room.name} — ${b.room.roomNumber}` : `<span style="color:var(--text-muted);">Not assigned</span>`}</td>
                <td>${b.checkIn.slice(0,10)} → ${b.checkOut.slice(0,10)}</td>
                <td><span class="badge badge-${b.status.toLowerCase()}">${b.status}</span></td></tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_rooms")) {
      const { rooms } = await staffApi.listRooms();
      cards.push({ label: "Total rooms", value: rooms.length });
    }
    if (hasPermission("handle_tickets")) {
      const { tickets } = await staffApi.listTickets("OPEN");
      cards.push({ label: "Open tickets", value: tickets.length });
      if (tickets.length) {
        ticketsPanel = `
          <div class="panel"><h3>Open guest tickets</h3>
            <table><thead><tr><th>Subject</th><th>Guest</th><th>Priority</th><th>Status</th></tr></thead>
              <tbody>${tickets.slice(0, 6).map((t) => `
                <tr><td>${t.subject}</td><td>${t.guest.name}</td><td>${t.priority}</td>
                <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td></tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_payments")) {
      const { totals } = await staffApi.listTransactions();
      cards.push({ label: "Recorded this month", value: `\u20a6${Number(totals?.paid || 0).toLocaleString()}` });
    }

    container.innerHTML = `
      ${pageHeader("Overview", staff.branchName ? `What's happening at ${staff.branchName} right now.` : "A quick look at what's happening right now.")}
      <div class="stats-grid">
        ${cards.length ? cards.map((c) => `<div class="stat-card"><b>${c.value}</b><span>${c.label}</span></div>`).join("")
          : `<div class="empty-state">Your account doesn't have access to any dashboard sections yet — ask your Manager to grant permissions.</div>`}
      </div>
      ${bookingsPanel}${ticketsPanel}
    `;
  } catch (err) {
    container.innerHTML = `${pageHeader("Overview")}<div class="empty-state">Couldn't load your overview (${err.message}).</div>`;
  }
}

async function refreshHousekeepingBoard() {
  try {
    const { summary, rooms } = await staffApi.getHousekeepingBoard();
    document.getElementById("hkBoardStats").innerHTML = `
      <div class="stat-card"><b>${summary.openTasks}</b><span>Open tasks</span></div>
      <div class="stat-card"><b>${summary.openWorkOrders}</b><span>Open issues</span></div>
      <div class="stat-card"><b>${summary.dirty}</b><span>Dirty rooms</span></div>
      <div class="stat-card"><b>${summary.outOfOrder}</b><span>Out of order</span></div>
    `;
    const canManage = hasPermission("manage_rooms");
    const TASK_NEXT = { PENDING: "IN_PROGRESS", ASSIGNED: "IN_PROGRESS", IN_PROGRESS: "COMPLETED" };
    const tasks = rooms.flatMap((r) => r.tasks.map((t) => ({ ...t, roomNumber: r.roomNumber })));
    document.getElementById("hkTasksBody").innerHTML = tasks.length ? tasks.map((t) => `
      <tr>
        <td>${t.roomNumber}</td><td>${t.type.replace(/_/g, " ")}</td>
        <td><span class="badge badge-${t.priority.toLowerCase()}">${t.priority}</span></td>
        <td><span class="badge badge-${t.status.toLowerCase()}">${t.status.replace(/_/g, " ")}</span></td>
        <td>${canManage && TASK_NEXT[t.status] ? `<button class="btn btn-sm btn-outline" onclick="advanceTask('${t.id}','${TASK_NEXT[t.status]}')">${TASK_NEXT[t.status] === "COMPLETED" ? "Complete" : "Start"}</button>` : ""}</td>
      </tr>
    `).join("") : `<tr><td colspan="5" class="empty-state">No open tasks.</td></tr>`;

    const issues = rooms.flatMap((r) => r.workOrders.map((w) => ({ ...w, roomNumber: r.roomNumber })));
    document.getElementById("hkMaintBody").innerHTML = issues.length ? issues.map((w) => `
      <tr>
        <td>${w.roomNumber || "—"}</td><td>${w.title}</td>
        <td><span class="badge badge-${w.priority.toLowerCase()}">${w.priority}</span></td>
        <td><span class="badge badge-${w.status.toLowerCase()}">${w.status.replace(/_/g, " ")}</span></td>
        <td>${canManage ? `<button class="btn btn-sm btn-outline" onclick="resolveMaintenance('${w.id}')">Resolve</button>` : ""}</td>
      </tr>
    `).join("") : `<tr><td colspan="5" class="empty-state">No open issues.</td></tr>`;

    const roomOptions = rooms.map((r) => `<option value="${r.id}">${r.roomNumber}</option>`).join("");
    document.getElementById("tkRoomId").innerHTML = roomOptions;
    document.getElementById("mtRoomId").innerHTML += roomOptions;
  } catch (err) {
    showNotice("housekeepingNotice", err.message);
  }
}

const ORDER_TYPE_PERMISSION = { ROOM_SERVICE: "manage_menu", RESTAURANT: "manage_menu", BAR: "manage_menu", LAUNDRY: "manage_laundry", SPA: "manage_spa" };
const ORDER_TYPE_LABELS = { ROOM_SERVICE: "Room Service", RESTAURANT: "Restaurant", BAR: "Bar", LAUNDRY: "Laundry", SPA: "Spa" };

let _poCart = [];
let _poSelectedGuestId = null;
let _poCatalogItems = [];

async function onOrderTypeChange() {
  const type = document.getElementById("poType").value;
  _poCart = [];
  const catalogEl = document.getElementById("poCatalog");
  catalogEl.innerHTML = `<div class="loading-state">Loading catalog…</div>`;

  try {
    if (type === "SPA") {
      const { spaTreatments } = await staffApi.listSpaTreatments();
      _poCatalogItems = spaTreatments;
      catalogEl.innerHTML = `
        <div class="form-row">
          <div class="form-field"><label>Treatment</label>
            <select id="poSpaTreatment" onchange="updatePoTotal()">
              ${spaTreatments.map((t) => `<option value="${t.id}" data-price="${t.price}">${t.name} — &#8358;${Number(t.price).toLocaleString()}</option>`).join("")}
            </select>
          </div>
          <div class="form-field"><label>Date &amp; time</label><input type="datetime-local" id="poSpaTime"></div>
        </div>
      `;
    } else if (type === "LAUNDRY") {
      const { laundryItems } = await staffApi.listLaundryItems();
      _poCatalogItems = laundryItems;
      catalogEl.innerHTML = `
        <table><thead><tr><th>Item</th><th>Price</th><th></th></tr></thead>
          <tbody>${laundryItems.length ? laundryItems.map((i) => `
            <tr><td>${i.name}</td><td>&#8358;${Number(i.price).toLocaleString()}</td>
            <td><button type="button" class="btn btn-sm btn-outline" onclick="addToPoCart('${i.id}')">Add</button></td></tr>

        <div id="poCartWrap" style="margin-top:14px;"></div>
      `;
      renderPoCart();
    } else {
      const { menuItems } = await staffApi.listMenuItems(type === "BAR" ? "DRINK" : "FOOD");
      const items = type === "ROOM_SERVICE" ? menuItems.filter((i) => i.availableForRoomService) : menuItems;
      _poCatalogItems = items;
      catalogEl.innerHTML = `
        <table><thead><tr><th>Item</th><th>Price</th><th></th></tr></thead>
          <tbody>${items.length ? items.map((i) => `
            <tr><td>${i.name}</td><td>&#8358;${Number(i.price).toLocaleString()}</td>
            <td><button type="button" class="btn btn-sm btn-outline" onclick="addToPoCart('${i.id}')">Add</button></td></tr>
          `).join("") : `<tr><td colspan="3" class="empty-state">Nothing available${type === "ROOM_SERVICE" ? " for room service" : ""}.</td></tr>`}</tbody>
        </table>
        <div id="poCartWrap" style="margin-top:14px;"></div>
      `;
      renderPoCart();
    }
  } catch (err) {
    catalogEl.innerHTML = `<div class="empty-state">${err.message}</div>`;
  }
  updatePoTotal();
}

function addToPoCart(itemId) {
  const item = _poCatalogItems.find((i) => i.id === itemId);
  if (!item) return;
  const existing = _poCart.find((l) => l.id === itemId);
  if (existing) existing.quantity += 1;
  else _poCart.push({ id: item.id, name: item.name, price: Number(item.price), quantity: 1 });
  renderPoCart();
  updatePoTotal();
}
function removeFromPoCart(itemId) {
  _poCart = _poCart.filter((l) => l.id !== itemId);
  renderPoCart();
  updatePoTotal();
}
function renderPoCart() {
  const wrap = document.getElementById("poCartWrap");
  if (!wrap) return;
  wrap.innerHTML = _poCart.length ? `
    <table><thead><tr><th>Item</th><th>Qty</th><th>Line total</th><th></th></tr></thead>
      <tbody>${_poCart.map((l) => `
        <tr><td>${l.name}</td><td>${l.quantity}</td><td>&#8358;${(l.price * l.quantity).toLocaleString()}</td>
        <td><button type="button" class="btn btn-sm btn-danger" onclick="removeFromPoCart('${l.id}')">Remove</button></td></tr>
      `).join("")}</tbody>
    </table>
  ` : `<p style="color:var(--text-muted); font-size:0.84rem;">No items added yet.</p>`;
}

function updatePoTotal() {
  const type = document.getElementById("poType").value;
  let total = 0;
  if (type === "SPA") {
    const sel = document.getElementById("poSpaTreatment");
    total = sel ? Number(sel.selectedOptions[0]?.dataset.price || 0) : 0;
  } else {
    total = _poCart.reduce((sum, l) => sum + l.price * l.quantity, 0);
  }
  document.getElementById("poTotalDisplay").textContent = `₦${total.toLocaleString()}`;
  return total;
}

async function submitWalkInOrder() {
  const btn = document.getElementById("poSubmitBtn");
  const type = document.getElementById("poType").value;
  const total = updatePoTotal();
  const paymentChoice = document.getElementById("poPayment").value;
  const roomId = document.getElementById("poRoom").value || undefined;

  if (!_poSelectedGuestId && (!document.getElementById("poGuestName").value || !document.getElementById("poGuestEmail").value)) {
    showNotice("placeOrderNotice", "Select an existing guest or enter a name and email for a new one.");
    return;
  }
  if (paymentChoice === "ROOM" && !roomId) {
    showNotice("placeOrderNotice", "Select a room to charge this to, or choose a different payment option.");
    return;
  }

  const payload = {
    type,
    existingGuestId: _poSelectedGuestId || undefined,
    guest: _poSelectedGuestId ? undefined : {
      name: document.getElementById("poGuestName").value,
      email: document.getElementById("poGuestEmail").value,
      phone: document.getElementById("poGuestPhone").value || undefined,
    },
    roomId,
    chargeToRoom: paymentChoice === "ROOM",
  };

  if (type === "SPA") {
    payload.treatmentId = document.getElementById("poSpaTreatment").value;
    payload.scheduledAt = document.getElementById("poSpaTime").value;
    if (!payload.scheduledAt) { showNotice("placeOrderNotice", "Pick a date and time for the appointment."); return; }
  } else {
    if (!_poCart.length) { showNotice("placeOrderNotice", "Add at least one item."); return; }
    payload.lines = _poCart.map((l) => ({ [type === "LAUNDRY" ? "laundryItemId" : "menuItemId"]: l.id, quantity: l.quantity }));
  }

  btn.disabled = true;
  try {
    const { order } = await staffApi.createWalkInOrder(payload);

    if (paymentChoice === "NOW" && order.totalAmount) {
      try {
        await staffApi.recordTransaction({
          orderId: order.id,
          guestName: _poSelectedGuestId ? document.getElementById("poSelectedGuestName").textContent : document.getElementById("poGuestName").value,
          source: ORDER_TYPE_TRANSACTION_SOURCE[type],
          amount: order.totalAmount,
          method: document.getElementById("poMethod").value,
        });
      } catch (err) {
        showNotice("placeOrderNotice", `Order placed, but recording the payment failed: ${err.message}. Record it from Transactions instead.`, "error");
        return;
      }
    }

    showNotice("placeOrderNotice", "Order placed.", "success");
    await loadPlaceOrderPage();
  } catch (err) {
    showNotice("placeOrderNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function refreshOrderDetail() {
  const body = document.getElementById("orderDetailBody");
  try {
    const { order } = await staffApi.getOrder(_odOrderId);
    const canEditLines = hasPermission("manage_orders");
    const canReopen = hasPermission("manage_payments");
    body.innerHTML = `
      <p style="font-size:0.84rem; color:var(--text-muted); margin-bottom:10px;">${order.guest.name} · <span class="badge badge-${order.status.toLowerCase()}">${order.status}</span> ${order.isOpen ? "" : "· Closed"}</p>

            <td><span class="badge badge-${l.status.toLowerCase()}">${l.status}</span></td>
            ${canEditLines ? `<td>${l.status === "ACTIVE" ? `<button class="btn btn-sm btn-danger" onclick="voidOrderLineRow('${l.id}')">Void</button>` : ""}</td>` : ""}
          </tr>
        `).join("") : `<tr><td colspan="${canEditLines ? 5 : 4}" class="empty-state">No items on this order.</td></tr>`}</tbody>
      </table>
      <div class="summary-line total" style="margin-top:10px;"><span>Total</span><span>&#8358;${Number(order.totalAmount || 0).toLocaleString()}</span></div>
      ${canEditLines && order.isOpen ? `
        <form id="addLineForm" style="border-top:1px solid var(--border); margin-top:16px; padding-top:16px;">
          <div class="form-row">
            <div class="form-field"><label>Add item</label><select id="odMenuItemId"><option value="">Loading…</option></select></div>
            <div class="form-field"><label>Qty</label><input type="number" id="odQty" value="1" min="1"></div>
          </div>
          <button type="submit" class="btn btn-sm btn-outline">Add to order</button>
        </form>
      ` : ""}
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeOrderDetailModal()">Close</button>
        ${canEditLines && order.isOpen ? `<button type="button" class="btn btn-danger" onclick="closeOrderRow()">Close order</button>` : ""}
        ${canReopen && !order.isOpen ? `<button type="button" class="btn btn-outline" onclick="reopenOrderRow()">Reopen order</button>` : ""}

    `;

        menuSelect.innerHTML = menuItems.map((m) => `<option value="${m.id}">${m.name} — &#8358;${Number(m.price).toLocaleString()}</option>`).join("");
      } catch { menuSelect.innerHTML = `<option value="">Couldn't load menu</option>`; }

    }
  } catch (err) {
    body.innerHTML = `<div class="notice error">${err.message}</div>`;
  }
}

async function submitAddOrderLine(e) {
  e.preventDefault();
  const menuItemId = document.getElementById("odMenuItemId").value;
  const quantity = Number(document.getElementById("odQty").value) || 1;
  if (!menuItemId) return;
  try {
    await staffApi.addOrderLine(_odOrderId, { menuItemId, quantity });
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }

async function voidOrderLineRow(lineId) {
  const reason = prompt("Reason for voiding this item (required):");
  if (!reason || reason.trim().length < 3) { if (reason !== null) showNotice("orderDetailNotice", "A reason of at least 3 characters is required."); return; }
  try {
    await staffApi.voidOrderLine(_odOrderId, lineId, { reason: reason.trim() });
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }
}
async function closeOrderRow() {
  if (!confirm("Close this order? No more items can be added unless it's reopened.")) return;
  try {
    await staffApi.closeOrder(_odOrderId);
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }
}
async function reopenOrderRow() {
  try {
    await staffApi.reopenOrder(_odOrderId);
    await refreshOrderDetail();
    refreshOrdersQueue();
  } catch (err) {
    showNotice("orderDetailNotice", err.message);
  }
}

    await staffApi.checkOutBooking(bookingId, extraFlags);
  } catch (err) {
    if (err.code === "KEYS_OUTSTANDING" && !extraFlags.acceptMissingKeys) {
      if (confirm(`${err.message} Check out anyway?`)) return performCheckOut(bookingId, { ...extraFlags, acceptMissingKeys: true });
      throw new Error("Checkout cancelled.");
    }
    throw err;
  }
}

async function settleFolioAndCheckOut(bookingId) {
  const btn = document.getElementById("folioSettleBtn");
  const method = document.getElementById("folioMethod").value;
  if (btn) { btn.disabled = true; btn.textContent = "Settling…"; }
  try {
    await staffApi.settleFolio(bookingId, method);
    await performCheckOut(bookingId);
    document.getElementById("folioModal").remove();
    showNotice("bookingsNotice", "Folio settled and guest checked out.", "success");
    refreshBookingsTable();
  } catch (err) {
    document.getElementById("folioModalNotice").innerHTML = `<div class="notice error">${err.message}</div>`;
    if (btn) { btn.disabled = false; btn.textContent = "Settle & check out"; }
  }
}

async function checkOutFromFolio(bookingId) {
  try {
    await performCheckOut(bookingId);
    document.getElementById("folioModal").remove();
    showNotice("bookingsNotice", "Guest checked out.", "success");
    refreshBookingsTable();
  } catch (err) {
    document.getElementById("folioModalNotice").innerHTML = `<div class="notice error">${err.message}</div>`;
  }
}

/* ============================================================
   EVENTS — create/manage events, scan tickets at the door.
   ============================================================ */

            <div class="form-field"><label>Ends <span style="color:var(--text-muted); font-weight:400;">(optional)</span></label><input type="datetime-local" id="evEndsAt"></div>

async function refreshEventsTable() {
  try {
    const { events } = await staffApi.listEvents();
    document.getElementById("eventsBody").innerHTML = events.length ? events.map((ev) => `
      <tr>
        <td>${ev.name}</td>
        <td>${new Date(ev.startsAt).toLocaleString()}</td>
        <td>${ev.capacity ?? "—"}</td>
        <td>${ev.price ? "&#8358;" + Number(ev.price).toLocaleString() : "Free"}</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="openAttendeesModal('${ev.id}')">Attendees</button>
          <button class="btn btn-sm btn-outline" onclick='openEventModal(${JSON.stringify(ev).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteEventRow('${ev.id}')">Delete</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="5" class="empty-state">No events yet.</td></tr>`;
  } catch (err) {
    showNotice("eventsNotice", err.message);
  }
}

function openEventModal(ev) {
  document.getElementById("eventForm").reset();
  document.getElementById("evId").value = ev ? ev.id : "";
  document.getElementById("eventModalTitle").textContent = ev ? "Edit event" : "New event";
  if (ev) {
    document.getElementById("evName").value = ev.name;
    document.getElementById("evDescription").value = ev.description || "";
    document.getElementById("evStartsAt").value = ev.startsAt ? ev.startsAt.slice(0, 16) : "";
    document.getElementById("evEndsAt").value = ev.endsAt ? ev.endsAt.slice(0, 16) : "";
    document.getElementById("evCapacity").value = ev.capacity ?? "";
    document.getElementById("evPrice").value = ev.price ?? 0;
  }
  document.getElementById("eventModal").style.display = "flex";
}
function closeEventModal() { document.getElementById("eventModal").style.display = "none"; }

async function submitEventForm(e) {
  e.preventDefault();
  const btn = document.getElementById("evSubmitBtn");
  btn.disabled = true;
  const id = document.getElementById("evId").value;
  const payload = {
    name: document.getElementById("evName").value,
    description: document.getElementById("evDescription").value || undefined,
    startsAt: document.getElementById("evStartsAt").value,
    endsAt: document.getElementById("evEndsAt").value || undefined,
    capacity: document.getElementById("evCapacity").value ? Number(document.getElementById("evCapacity").value) : undefined,
    price: document.getElementById("evPrice").value ? Number(document.getElementById("evPrice").value) : 0,
  };
  try {
    if (id) await staffApi.updateEvent(id, payload);
    else await staffApi.createEvent(payload);
    closeEventModal();
    showNotice("eventsNotice", id ? "Event updated." : "Event created.", "success");
    refreshEventsTable();
  } catch (err) {
    showNotice("eventModalNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function deleteEventRow(id) {
  if (!confirm("Delete this event? This can't be undone.")) return;
  try {
    await staffApi.deleteEvent(id);
    showNotice("eventsNotice", "Event deleted.", "success");
    refreshEventsTable();
  } catch (err) {
    showNotice("eventsNotice", err.message);
  }
}

async function openAttendeesModal(id) {
  document.getElementById("attendeesModal").style.display = "flex";
  document.getElementById("attendeesBody").innerHTML = `<div class="loading-state">Loading…</div>`;
  try {
    const { total, redeemed, tickets } = await staffApi.getEventAttendees(id);
    document.getElementById("attendeesBody").innerHTML = `
      <p style="font-size:0.86rem; color:var(--text-muted); margin-bottom:12px;">${redeemed} of ${total} scanned in.</p>
      <table><thead><tr><th>Name</th><th>Type</th><th>Status</th></tr></thead>
        <tbody>${tickets.length ? tickets.map((t) => `<tr><td>${t.holderName || "—"}</td><td>${t.ticketType || "—"}</td><td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td></tr>`).join("") : `<tr><td colspan="3" class="empty-state">No tickets sold yet.</td></tr>`}</tbody>
      </table>
    `;
  } catch (err) {
    document.getElementById("attendeesBody").innerHTML = `<div class="empty-state">${err.message}</div>`;
  }
}

async function submitTicketScan(e) {
  e.preventDefault();
  const codeInput = document.getElementById("scanCode");
  const code = codeInput.value.trim();
  if (!code) return;
  const resultEl = document.getElementById("scanResult");
  resultEl.innerHTML = `<div class="loading-state">Checking…</div>`;
  try {
    const result = await staffApi.redeemTicket(code);
    resultEl.innerHTML = `<div class="notice success">${result.message}${result.ticket?.holderName ? ` — ${result.ticket.holderName}` : ""}</div>`;
  } catch (err) {
    resultEl.innerHTML = `<div class="notice error">${err.data?.message || err.message}</div>`;
  }
  codeInput.value = "";
  codeInput.focus();
}

/* ============================================================
   TICKETS — claim/resolve, plus full thread view + reply.
   ============================================================ */
async function loadTicketsPage() {
  const container = document.getElementById("pageContent");
  container.innerHTML = `
    ${pageHeader("Guest Tickets", "Support requests from guests at your branch.")}
    <div id="ticketsNotice"></div>
    <div class="panel">
      <table><thead><tr><th>Subject</th><th>Guest</th><th>Priority</th><th>Assigned</th><th>Status</th><th></th></tr></thead>
        <tbody id="ticketsBody"><tr><td colspan="6" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="modal-overlay" id="ticketDetailModal" style="display:none;">
      <div class="modal" style="max-width:560px;">
        <h3 id="tdSubject">Ticket</h3>
        <div id="ticketDetailNotice"></div>
        <div id="tdMeta" style="font-size:0.82rem; color:var(--text-muted); margin-bottom:14px;"></div>
        <div id="tdThread" style="max-height:320px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:14px;"></div>
        <form id="tdReplyForm">
          <div class="form-field"><label>Reply</label><textarea id="tdReplyMessage" rows="3" required></textarea></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="closeTicketDetailModal()">Close</button>
            <button type="submit" class="btn btn-primary" id="tdReplySubmitBtn">Send reply</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById("tdReplyForm").addEventListener("submit", submitTicketReply);
  await refreshTicketsTable();
}
async function refreshTicketsTable() {
  try {
    const { tickets } = await staffApi.listTickets();
    document.getElementById("ticketsBody").innerHTML = tickets.length ? tickets.map((t) => `
      <tr><td>${t.subject}</td><td>${t.guest.name}</td><td>${t.priority}</td>
      <td>${(t.assignedManager || t.assignedStaffMember) ? (t.assignedManager || t.assignedStaffMember).name : "—"}</td><td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td>
      <td><button class="btn btn-sm btn-outline" onclick="openTicketDetailModal('${t.id}')">View</button>
      ${!(t.assignedManager || t.assignedStaffMember) ? `<button class="btn btn-sm btn-outline" onclick="claimTicket('${t.id}')">Assign to me</button>` : ""}
      ${t.status !== "RESOLVED" ? `<button class="btn btn-sm btn-outline" onclick="resolveTicketRow('${t.id}')">Resolve</button>` : ""}</td></tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No tickets yet.</td></tr>`;

    const openCount = tickets.filter((t) => ["OPEN", "IN_PROGRESS"].includes(t.status)).length;
    const bellBadge = document.getElementById("ticketsBellBadge");
    const navBadge = document.getElementById("ticketsNavBadge");
    [bellBadge, navBadge].forEach((el) => { if (!el) return; el.textContent = openCount; el.style.display = openCount ? "flex" : "none"; el.classList.toggle("visible", openCount > 0); });
  } catch (err) { document.getElementById("ticketsBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`; }
}
async function claimTicket(id) { try { await staffApi.assignTicket(id); refreshTicketsTable(); } catch (err) { showNotice("ticketsNotice", err.message); } }
async function resolveTicketRow(id) { try { await staffApi.resolveTicket(id); refreshTicketsTable(); } catch (err) { showNotice("ticketsNotice", err.message); } }

async function openTicketDetailModal(id) {
  document.getElementById("ticketDetailNotice").innerHTML = "";
  document.getElementById("tdThread").innerHTML = `<div class="loading-state">Loading…</div>`;
  document.getElementById("tdReplyForm").dataset.ticketId = id;
  document.getElementById("ticketDetailModal").style.display = "flex";
  await refreshTicketDetail(id);
}
function closeTicketDetailModal() { document.getElementById("ticketDetailModal").style.display = "none"; }

async function refreshTicketDetail(id) {
  try {
    const { ticket } = await staffApi.getTicketDetail(id);
    document.getElementById("tdSubject").textContent = ticket.subject;
    document.getElementById("tdMeta").textContent = `${ticket.guest.name} · ${ticket.priority} · ${ticket.status}`;
    document.getElementById("tdThread").innerHTML = ticket.messages.length ? ticket.messages.map((m) => `
      <div style="margin-bottom:10px; ${m.senderType === "GUEST" ? "" : "text-align:right;"}">
        <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:2px;">${m.senderType === "GUEST" ? ticket.guest.name : "You"} · ${new Date(m.createdAt).toLocaleString()}</div>
        <div style="display:inline-block; padding:8px 12px; border-radius:8px; background:${m.senderType === "GUEST" ? "var(--ivory)" : "rgba(185,141,69,0.12)"}; font-size:0.86rem;">${m.message || ""}</div>
      </div>
    `).join("") : `<div class="empty-state">No messages yet.</div>`;
    document.getElementById("tdThread").scrollTop = document.getElementById("tdThread").scrollHeight;
  } catch (err) {
    showNotice("ticketDetailNotice", err.message);
  }
}

async function submitTicketReply(e) {
  e.preventDefault();
  const id = e.target.dataset.ticketId;
  const btn = document.getElementById("tdReplySubmitBtn");
  btn.disabled = true;
  try {
    await staffApi.replyToTicket(id, document.getElementById("tdReplyMessage").value);
    document.getElementById("tdReplyMessage").value = "";
    await refreshTicketDetail(id);
    refreshTicketsTable();
  } catch (err) {
    showNotice("ticketDetailNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

/* ============================================================
   SECURITY — 2FA enrollment, opened by clicking your own name
   ============================================================ */
function renderSecurityModalShell() {
  if (document.getElementById("securityModal")) return;
  document.body.insertAdjacentHTML("beforeend", `
    <div class="modal-overlay" id="securityModal" style="display:none;">
      <div class="modal">
        <h3>Account & Security</h3>
        <div id="securityNotice"></div>
        <div id="securityBody"></div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeSecurityModal()">Close</button></div>
      </div>
    </div>
    <div class="modal-overlay" id="enable2FAModal" style="display:none;">
      <div class="modal">
        <h3>Turn on two-factor authentication</h3>
        <div id="enable2FAStep1">
          <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">Scan this with your authenticator app, then enter the code it shows.</p>
          <div id="qrCodeContainer" style="text-align:center; margin-bottom:16px;"></div>
          <div class="form-field"><label>6-digit code</label><input type="text" id="enable2FACode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="closeTwoFactorModal('enable2FAModal')">Cancel</button>
            <button type="button" class="btn btn-primary" id="enable2FASubmitBtn" onclick="submitEnableTwoFactor()">Verify & enable</button>
          </div>
        </div>
        <div id="enable2FAStep2" style="display:none;">
          <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:10px;">2FA is on. Save these backup codes somewhere safe — each works once. <strong>They won't be shown again.</strong></p>
          <div id="backupCodesList" style="background:var(--ivory); padding:14px 18px; border-radius:6px; font-family:monospace; font-size:0.9rem; line-height:1.9;"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-primary" onclick="closeTwoFactorModal('enable2FAModal'); renderSecurityBody();">Done</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="disable2FAModal" style="display:none;">
      <div class="modal">
        <h3>Turn off two-factor authentication</h3>
        <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">Confirm your password to turn off 2FA.</p>
        <div class="form-field"><label>Password</label><input type="password" id="disable2FAPassword"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeTwoFactorModal('disable2FAModal')">Cancel</button>
          <button type="button" class="btn btn-danger" id="disable2FASubmitBtn" onclick="submitDisableTwoFactor()">Turn off 2FA</button>
        </div>
      </div>
    </div>
  `);
}

function openSecurityModal() {
  renderSecurityModalShell();
  renderSecurityBody();
  document.getElementById("securityModal").style.display = "flex";
}
function closeSecurityModal() { document.getElementById("securityModal").style.display = "none"; }
function closeTwoFactorModal(id) { document.getElementById(id).style.display = "none"; }

function renderSecurityBody() {
  const staff = getStaff();
  const enabled = !!staff.twoFactorEnabled;
  document.getElementById("securityBody").innerHTML = enabled ? `
    <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">
      <span class="badge badge-active">Enabled</span> Your account requires a code from your authenticator app at every login.
    </p>
    <button class="btn btn-outline" onclick="openDisable2FAModal()">Turn off 2FA</button>
  ` : `
    <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">
      <span class="badge badge-inactive">Disabled</span> Add a second step at login using an authenticator app.
    </p>
    <button class="btn btn-primary" onclick="startTwoFactorSetup()">Turn on 2FA</button>
  `;
}

async function startTwoFactorSetup() {
  try {
    const { qrCodeDataUrl } = await staffApi.setupTwoFactor();
    document.getElementById("qrCodeContainer").innerHTML = `<img src="${qrCodeDataUrl}" alt="2FA QR code" style="width:200px; height:200px;">`;
    document.getElementById("enable2FAStep1").style.display = "";
    document.getElementById("enable2FAStep2").style.display = "none";
    document.getElementById("enable2FAModal").style.display = "flex";
  } catch (err) { showNotice("securityNotice", err.message); }
}
async function submitEnableTwoFactor() {
  const btn = document.getElementById("enable2FASubmitBtn"); btn.disabled = true;
  try {
    const { backupCodes } = await staffApi.enableTwoFactor(document.getElementById("enable2FACode").value.trim());
    document.getElementById("backupCodesList").innerHTML = backupCodes.map((c) => `<div>${c}</div>`).join("");
    document.getElementById("enable2FAStep1").style.display = "none";
    document.getElementById("enable2FAStep2").style.display = "";
    const staff = getStaff(); staff.twoFactorEnabled = true; setSession(getToken(), staff);
  } catch (err) { showNotice("securityNotice", err.message); } finally { btn.disabled = false; }
}
function openDisable2FAModal() { document.getElementById("disable2FAPassword").value = ""; document.getElementById("disable2FAModal").style.display = "flex"; }
async function submitDisableTwoFactor() {
  const btn = document.getElementById("disable2FASubmitBtn"); btn.disabled = true;
  try {
    await staffApi.disableTwoFactor(document.getElementById("disable2FAPassword").value);
    closeTwoFactorModal("disable2FAModal");
    const staff = getStaff(); staff.twoFactorEnabled = false; setSession(getToken(), staff);
    renderSecurityBody();
    showNotice("securityNotice", "2FA turned off.", "success");
  } catch (err) { showNotice("securityNotice", err.message); } finally { btn.disabled = false; }
}

/* ============================================================
   SHARED / LOGIN / BOOT
   ============================================================ */
function showNotice(containerId, message, type = "error") {
  const el = document.getElementById(containerId); if (!el) return;
  el.innerHTML = `<div class="notice ${type}">${message}</div>`;
  setTimeout(() => { if (el) el.innerHTML = ""; }, 4000);
}
function showLogin() { document.getElementById("loginScreen").style.display = "flex"; document.getElementById("appShell").style.display = "none"; }
function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  renderSidebar(); switchPage("dashboard"); refreshTicketsBadgeSilently();
}
async function refreshTicketsBadgeSilently() {
  if (!hasPermission("handle_tickets")) return;
  try {
    const { tickets } = await staffApi.listTickets("OPEN");
    const badge = document.getElementById("ticketsBellBadge");
    if (badge) { badge.textContent = tickets.length; badge.style.display = tickets.length ? "flex" : "none"; }
  } catch { /* silent — background badge refresh */ }
}

let _pendingTempToken = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const notice = document.getElementById("loginNotice");
  notice.innerHTML = ""; btn.disabled = true; btn.textContent = "Logging in…";
  try {
    const result = await staffApi.login(document.getElementById("loginEmail").value, document.getElementById("loginPassword").value);
    if (result.requires2FA) {
      _pendingTempToken = result.tempToken;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("twoFactorForm").style.display = "block";
      document.getElementById("twoFactorCode").focus();
      return;
    }
    setSession(result.token, result.staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Log in"; }
});

document.getElementById("twoFactorForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("twoFactorBtn");
  const notice = document.getElementById("loginNotice");
  notice.innerHTML = ""; btn.disabled = true; btn.textContent = "Verifying…";
  try {
    const result = await staffApi.verifyTwoFactor(_pendingTempToken, document.getElementById("twoFactorCode").value.trim());
    _pendingTempToken = null;
    setSession(result.token, result.staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Verify"; }
});

document.getElementById("twoFactorBackBtn").addEventListener("click", () => {
  _pendingTempToken = null;
  document.getElementById("twoFactorForm").style.display = "none";
  document.getElementById("twoFactorForm").reset();
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("loginNotice").innerHTML = "";
});
document.getElementById("logoutBtn").addEventListener("click", () => { clearSession(); showLogin(); });
document.getElementById("hamburgerBtn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("ticketsBellBtn").addEventListener("click", () => switchPage("tickets"));

// Boot
if (getToken() && getStaff()) { showApp(); } else { showLogin(); }
</script>
</body>
