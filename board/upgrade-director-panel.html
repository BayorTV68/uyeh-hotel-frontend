  if (ev) {
    document.getElementById("evName").value = ev.name;
    document.getElementById("evDescription").value = ev.description || "";
    document.getElementById("evStartsAt").value = toDatetimeLocalValue(ev.startsAt);
    document.getElementById("evEndsAt").value = ev.endsAt ? toDatetimeLocalValue(ev.endsAt) : "";
    document.getElementById("evCapacity").value = ev.capacity ?? "";

function toDatetimeLocalValue(isoString) {
  const d = new Date(isoString);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  } catch (err) {
    showNotice("eventsNotice", err.message);
  }
}

/* ============================================================
   UPCOMING EVENTS — hotel-hosted, ticketed events, distinct from Events
   above (which is a guest renting the hall for their OWN function).
   Manager drafts and submits these from their panel; this page is the
   Director's approval queue — approve publishes it (guests can then buy
   tickets), reject sends it back with a reason.
   ============================================================ */
const UPCOMING_EVENT_STATUS_LABELS = {
  DRAFT: "Draft", PENDING_APPROVAL: "Pending approval", PUBLISHED: "Published",
  REJECTED: "Rejected", CANCELLED: "Cancelled", COMPLETED: "Completed",
};

async function loadUpcomingEventsPage() {
  const container = document.getElementById("pageContent");
  container.innerHTML = `
    ${pageHeader("Upcoming Events", "Hotel-hosted, ticketed events. Managers draft and submit; you approve or reject here.")}
    <div id="upcomingEventsNotice"></div>
    <div class="panel">
      <div class="form-field" style="max-width:280px;">
        <label>Filter by status</label>
        <select id="ueStatusFilter" onchange="refreshUpcomingEvents()">
          <option value="PENDING_APPROVAL">Pending approval</option>
          <option value="PUBLISHED">Published</option>
          <option value="DRAFT">Draft</option>
          <option value="REJECTED">Rejected</option>
          <option value="CANCELLED">Cancelled</option>
          <option value="COMPLETED">Completed</option>
          <option value="">All</option>
        </select>
      </div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Title</th><th>Branch</th><th>When</th><th>Capacity</th><th>Ticket price</th><th>Status</th><th></th></tr></thead>
        <tbody id="upcomingEventsBody"><tr><td colspan="7" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>
  `;
  await refreshUpcomingEvents();
}

async function refreshUpcomingEvents() {
  const status = document.getElementById("ueStatusFilter").value;
  try {
    const { upcomingEvents } = await adminApi.listUpcomingEvents(undefined, status || undefined);
    document.getElementById("upcomingEventsBody").innerHTML = upcomingEvents.length ? upcomingEvents.map((ue) => `
      <tr>
        <td>${ue.title}${ue.rejectionReason ? `<div style="color:var(--text-muted); font-size:0.78rem;">Rejected: ${ue.rejectionReason}</div>` : ""}</td>
        <td>${ue.branch?.name || "—"}</td>
        <td>${new Date(ue.startsAt).toLocaleString()}</td>
        <td>${ue.capacity ?? "Unlimited"}</td>
        <td>${ue.ticketPrice ? `&#8358;${Number(ue.ticketPrice).toLocaleString()}` : "Free"}</td>
        <td><span class="badge badge-${ue.status.toLowerCase()}">${UPCOMING_EVENT_STATUS_LABELS[ue.status] || ue.status}</span></td>
        <td>
          ${ue.status === "PENDING_APPROVAL" ? `
            <button class="btn btn-sm btn-primary" onclick="approveUpcomingEventConfirm('${ue.id}')">Approve</button>
            <button class="btn btn-sm btn-outline" onclick="rejectUpcomingEventPrompt('${ue.id}')">Reject</button>
          ` : ""}
        </td>
      </tr>
    `).join("") : `<tr><td colspan="7" class="empty-state">Nothing here right now.</td></tr>`;
  } catch (err) {
    showNotice("upcomingEventsNotice", err.message);
  }
}

async function approveUpcomingEventConfirm(id) {
  if (!confirm("Publish this event? Guests will be able to see it and buy tickets immediately.")) return;
  try {
    await adminApi.approveUpcomingEvent(id);
    showNotice("upcomingEventsNotice", "Published.", "success");
    refreshUpcomingEvents();
  } catch (err) {
    showNotice("upcomingEventsNotice", err.message);
  }
}

async function rejectUpcomingEventPrompt(id) {
  const reason = prompt("Reason for rejecting this event (shown to the Manager):");
  if (reason === null) return;
  try {
    await adminApi.rejectUpcomingEvent(id, reason || undefined);
    showNotice("upcomingEventsNotice", "Sent back to the Manager.", "success");
    refreshUpcomingEvents();
  } catch (err) {
    showNotice("upcomingEventsNotice", err.message);
  }
}

/* ============================================================
   OFFERINGS — food, drinks, services (priced per branch)
   ============================================================ */
const OFFERING_CATEGORY_LABELS = { food: "Food", drink: "Drink", service: "Service" };

// category -> tag "service" key (matches VALID_TAG_SERVICES on the backend)
const OFFERING_TAG_SERVICE = { food: "restaurant", drink: "bar", laundry: "laundry", spa: "spa" };

// category -> { fetch, create, update, label } — one entry per real backend
// table. "food"/"drink" both live in MenuItem (category FOOD/DRINK);
// laundry and spa are their own tables with their own required fields.
// Every fn now takes branchId explicitly — this whole page used to never
// send one at all, so every create/update 400'd with "branchId is required".
const OFFERING_TYPES = {
  food:    { label: "Food",    list: (b) => adminApi.listMenuItems(b, "FOOD"),  create: adminApi.createMenuItem,    update: adminApi.updateMenuItem,    key: "menuItems" },
  drink:   { label: "Drink",   list: (b) => adminApi.listMenuItems(b, "DRINK"), create: adminApi.createMenuItem,    update: adminApi.updateMenuItem,    key: "menuItems" },
  laundry: { label: "Laundry", list: adminApi.listLaundryItems,                 create: adminApi.createLaundryItem, update: adminApi.updateLaundryItem, key: "laundryItems" },
  spa:     { label: "Spa",     list: adminApi.listSpaTreatments,                create: adminApi.createSpaTreatment,update: adminApi.updateSpaTreatment,key: "spaTreatments" },
};

let _offeringsSelectedBranchId = "";

async function loadOfferingsPage() {
  const container = document.getElementById("pageContent");
  let branchOptionsHtml = `<option value="">Select a branch…</option>`;
  let branches = [];
  try {
    ({ branches } = await adminApi.listBranches());
    if (!_offeringsSelectedBranchId && branches.length) _offeringsSelectedBranchId = branches[0].id;
    branchOptionsHtml = branches.map((b) => `<option value="${b.id}" ${b.id === _offeringsSelectedBranchId ? "selected" : ""}>${b.name}</option>`).join("");
  } catch { /* non-fatal */ }

  container.innerHTML = `
    ${pageHeader("Food, Drinks & Services", "Priced per branch — set once per item, per location.",
      `<button class="btn btn-primary" onclick="openOfferingModal()" ${_offeringsSelectedBranchId ? "" : "disabled"}>Add item</button>`)}
    <div id="offeringsNotice"></div>
    <div class="panel">
      <div class="form-field" style="max-width:320px;">
        <label>Branch</label>
        <select id="offeringsBranchSelect" onchange="_offeringsSelectedBranchId=this.value; refreshOfferingsTable();">${branchOptionsHtml}</select>
      </div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th>Photo</th><th>Item</th><th>Category</th><th>Tags</th><th>Price</th><th>Status</th><th></th></tr></thead>
        <tbody id="offeringsBody"><tr><td colspan="7" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="modal-overlay" id="offeringModal" style="display:none;">
      <div class="modal">
        <h3 id="offeringModalTitle">Add item</h3>
        <form id="offeringForm">
          <input type="hidden" id="ofId">
          <input type="hidden" id="ofStockItemId">
          <div class="form-row">
            <div class="form-field">
              <label>Category</label>
              <select id="ofCategory" required onchange="toggleOfferingFields()">
                <option value="food">Food</option>
                <option value="drink">Drink</option>
                <option value="laundry">Laundry</option>
                <option value="spa">Spa</option>
              </select>
            </div>
            <div class="form-field"><label>Price (&#8358;) — this branch</label><input type="number" id="ofPrice" min="0" step="1" required></div>
          </div>
          <div class="form-field"><label>Name</label><input type="text" id="ofName" required></div>
          <div class="form-field" id="ofDescriptionField"><label>Description</label><textarea id="ofDescription" rows="2"></textarea></div>
          <div class="form-field" id="ofTurnaroundField" style="display:none;"><label>Turnaround (hours)</label><input type="number" id="ofTurnaround" min="1" value="24"></div>
          <div class="form-field" id="ofDurationField" style="display:none;"><label>Duration (minutes)</label><input type="number" id="ofDuration" min="1" value="60"></div>
          <div class="form-field" id="ofRoomServiceField" style="display:none;">
            <label class="checkbox-item"><input type="checkbox" id="ofRoomService"> Available for room service</label>
          </div>
          <div class="form-field" id="ofDietaryField" style="display:none;">
            <label>Dietary tags <span style="color:var(--text-muted); font-weight:400;">(comma-separated — vegan, halal, gluten-free…)</span></label>
            <input type="text" id="ofDietaryTags" placeholder="vegan, halal">
          </div>
          <div class="form-field" id="ofTagsField">
            <label>Tags <span style="color:var(--text-muted); font-weight:400;">(helps guests browse — manage the list from the Tags page)</span></label>
            <div id="ofTagsOptions" class="checkbox-grid"><span style="color:var(--text-muted); font-size:0.82rem;">Loading…</span></div>
          </div>
          <div class="form-field" id="ofStockField" style="display:none;">
            <div id="ofStockLinkedNote" style="display:none; color:var(--text-muted); font-size:0.85rem; margin-bottom:8px;">
              This item's stock is tracked. Manage its quantity from the <a href="#" onclick="switchPage('stock'); return false;" style="color:var(--brass-dark); font-weight:600;">Stock page</a> — quantity can't be edited here.
            </div>
            <div id="ofStockNewFields">
              <label class="checkbox-item"><input type="checkbox" id="ofTrackStock" onchange="toggleOfferingStockFields()"> Track stock for this item</label>
              <div class="form-row" id="ofStockQtyRow" style="display:none; margin-top:8px;">
                <div class="form-field"><label>Starting quantity</label><input type="number" id="ofStockQuantity" min="0" step="1" value="0"></div>
                <div class="form-field"><label>Unit</label><input type="text" id="ofStockUnit" placeholder="bottles, plates, kg…"></div>
                <div class="form-field"><label>Low-stock alert below</label><input type="number" id="ofStockLowThreshold" min="0" step="1" value="5"></div>
              </div>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="closeOfferingModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="ofSubmitBtn">Save item</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById("offeringForm").addEventListener("submit", submitOfferingForm);
  toggleOfferingFields();
  if (_offeringsSelectedBranchId) refreshOfferingsTable();
  else document.getElementById("offeringsBody").innerHTML = `<tr><td colspan="7" class="empty-state">Pick a branch above to see its items.</td></tr>`;
}

function toggleOfferingFields() {
  const cat = document.getElementById("ofCategory").value;
  document.getElementById("ofDescriptionField").style.display = cat === "spa" || cat === "food" || cat === "drink" ? "" : "none";
  document.getElementById("ofTurnaroundField").style.display = cat === "laundry" ? "" : "none";
  document.getElementById("ofDurationField").style.display = cat === "spa" ? "" : "none";
  const isFoodOrDrink = cat === "food" || cat === "drink";
  document.getElementById("ofRoomServiceField").style.display = isFoodOrDrink ? "" : "none";
  document.getElementById("ofDietaryField").style.display = isFoodOrDrink ? "" : "none";
  // Stock only makes sense for a physical, consumable item — not laundry
  // (unlimited by design) or spa (a time slot, not a countable good).
  document.getElementById("ofStockField").style.display = isFoodOrDrink ? "" : "none";
  refreshOfferingTagOptions();
}

/** Populates the tag checkboxes from this branch's managed list for
 * whichever service the current category maps to. Re-fetches on branch
 * or category change since the list is scoped to both. */
async function refreshOfferingTagOptions(selectedTags) {
  const cat = document.getElementById("ofCategory").value;
  const service = OFFERING_TAG_SERVICE[cat];
  const container = document.getElementById("ofTagsOptions");
  if (!_offeringsSelectedBranchId || !service) { container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Pick a branch first.</span>`; return; }
  const currentlySelected = selectedTags || Array.from(container.querySelectorAll("input:checked")).map((el) => el.value);
  try {
    const { tags } = await adminApi.listTags(_offeringsSelectedBranchId, service);
    container.innerHTML = tags.length ? tags.map((t) => `
      <label class="checkbox-item"><input type="checkbox" value="${t.name}" ${currentlySelected.includes(t.name) ? "checked" : ""}> ${t.name}</label>
    `).join("") : `<span style="color:var(--text-muted); font-size:0.82rem;">No tags yet for this service — add some from the <a href="#" onclick="switchPage('tags'); return false;" style="color:var(--brass-dark); font-weight:600;">Tags page</a>.</span>`;
  } catch {
    container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Couldn't load tags.</span>`;
  }
}

function toggleOfferingStockFields() {
  document.getElementById("ofStockQtyRow").style.display = document.getElementById("ofTrackStock").checked ? "" : "none";
}

async function refreshOfferingsTable() {
  if (!_offeringsSelectedBranchId) return;
  try {
    const results = await Promise.all(
      Object.entries(OFFERING_TYPES).map(async ([cat, cfg]) => {
        const data = await cfg.list(_offeringsSelectedBranchId);
        const items = data[cfg.key] || data.menuItems || data.laundryItems || data.spaTreatments || [];
        return items.map((item) => ({ ...item, _category: cat }));
      })
    );
    const offerings = results.flat();
    document.getElementById("offeringsBody").innerHTML = offerings.length ? offerings.map((o) => `
      <tr>
        <td>
          <div class="offering-photo" onclick="document.getElementById('photoInput-${o.id}').click()" title="Click to change photo">
            ${o.image ? `<img src="${o.image}" alt="${o.name}">` : `<span class="offering-photo-placeholder"><i class="fa-solid fa-camera"></i></span>`}
          </div>
          <input type="file" id="photoInput-${o.id}" accept="image/*" style="display:none;" onchange="uploadOfferingPhoto('${o._category}', '${o.id}', this)">
        </td>
        <td>${o.name}</td>
        <td>${OFFERING_TYPES[o._category].label}</td>
        <td>${(o.tags || []).map((t) => `<span class="badge">${t}</span>`).join(" ") || "—"}</td>
        <td>&#8358;${Number(o.price).toLocaleString()}</td>
        <td><span class="badge badge-${o.isAvailable ? "active" : "inactive"}">${o.isAvailable ? "Active" : "Inactive"}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick='openOfferingModal(${JSON.stringify(o).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-outline" onclick="toggleOfferingActive('${o._category}', '${o.id}', ${o.isAvailable})">${o.isAvailable ? "Deactivate" : "Activate"}</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="7" class="empty-state">No items yet — add food, drinks, laundry, or spa items above.</td></tr>`;
  } catch (err) {
    document.getElementById("offeringsBody").innerHTML = `<tr><td colspan="7" class="empty-state">${err.message}</td></tr>`;
  }
}

async function uploadOfferingPhoto(category, id, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const uploaders = {
    food: adminApi.uploadMenuItemImage, drink: adminApi.uploadMenuItemImage,
    laundry: adminApi.uploadLaundryItemImage, spa: adminApi.uploadSpaTreatmentImage,
  };
  try {
    await uploaders[category](id, file);
    refreshOfferingsTable();
  } catch (err) {
    showNotice("offeringsNotice", "Couldn't upload photo: " + err.message);
  }
}

function openOfferingModal(o) {
  document.getElementById("offeringModalTitle").textContent = o ? "Edit item" : "Add item";
  document.getElementById("offeringForm").reset();
  document.getElementById("ofId").value = o ? o.id : "";
  document.getElementById("ofStockItemId").value = (o && o.stockItemId) || "";
  document.getElementById("ofCategory").disabled = !!o; // category can't change after creation — different table
  if (o) {
    document.getElementById("ofCategory").value = o._category;
    document.getElementById("ofName").value = o.name;
    document.getElementById("ofPrice").value = o.price;
    document.getElementById("ofDescription").value = o.description || "";
    if (o._category === "laundry") document.getElementById("ofTurnaround").value = o.turnaroundHours || 24;
    if (o._category === "spa") document.getElementById("ofDuration").value = o.durationMinutes || 60;
    if (o._category === "food" || o._category === "drink") {
      document.getElementById("ofRoomService").checked = !!o.availableForRoomService;
      document.getElementById("ofDietaryTags").value = (o.dietaryTags || []).join(", ");
    }
  }
  // Stock: creating new stock tracking only happens at item creation
  // (see createMenuItem on the backend) — an item that already has a
  // linked StockItem shows a note pointing at the Stock page instead.
  const alreadyTracked = !!(o && o.stockItemId);
  document.getElementById("ofStockLinkedNote").style.display = alreadyTracked ? "" : "none";
  document.getElementById("ofStockNewFields").style.display = alreadyTracked ? "none" : "";
  document.getElementById("ofTrackStock").checked = false;
  toggleOfferingStockFields();
  toggleOfferingFields();
  refreshOfferingTagOptions(o ? (o.tags || []) : []);
  document.getElementById("offeringModal").style.display = "flex";
}
function closeOfferingModal() { document.getElementById("offeringModal").style.display = "none"; }

async function submitOfferingForm(e) {
  e.preventDefault();
  const btn = document.getElementById("ofSubmitBtn");
  btn.disabled = true;
  try {
    const id = document.getElementById("ofId").value;
    const category = document.getElementById("ofCategory").value;
    const cfg = OFFERING_TYPES[category];
    const tags = Array.from(document.getElementById("ofTagsOptions").querySelectorAll("input:checked")).map((el) => el.value);

    const base = {
      name: document.getElementById("ofName").value,
      price: Number(document.getElementById("ofPrice").value),
      tags,
    };
    if (category === "food" || category === "drink") {
      base.category = category.toUpperCase();
      base.description = document.getElementById("ofDescription").value || undefined;
      base.availableForRoomService = document.getElementById("ofRoomService").checked;
      const dietaryTags = document.getElementById("ofDietaryTags").value.split(",").map((t) => t.trim()).filter(Boolean);
      if (dietaryTags.length) base.dietaryTags = dietaryTags;
      // Inline stock creation — only offered (and only meaningful) when
      // adding a brand-new item; see openOfferingModal's linked-note branch.
      if (!id && document.getElementById("ofTrackStock").checked) {
        base.trackStock = true;
        base.stockQuantity = Number(document.getElementById("ofStockQuantity").value) || 0;
        base.stockUnit = document.getElementById("ofStockUnit").value || "unit";
        base.stockLowStockThreshold = Number(document.getElementById("ofStockLowThreshold").value) || 5;
      }
    } else if (category === "laundry") {
      base.turnaroundHours = Number(document.getElementById("ofTurnaround").value) || 24;
    } else if (category === "spa") {
      base.description = document.getElementById("ofDescription").value || undefined;
      base.durationMinutes = Number(document.getElementById("ofDuration").value) || 60;
    }

    if (id) { await cfg.update(id, _offeringsSelectedBranchId, base); showNotice("offeringsNotice", "Item updated.", "success"); }
    else { await cfg.create(_offeringsSelectedBranchId, base); showNotice("offeringsNotice", "Item added.", "success"); }
    closeOfferingModal();
    refreshOfferingsTable();
  } catch (err) {
    showNotice("offeringsNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}
async function toggleOfferingActive(category, id, currentlyActive) {
  try { await OFFERING_TYPES[category].update(id, _offeringsSelectedBranchId, { isAvailable: !currentlyActive }); refreshOfferingsTable(); }
  catch (err) { showNotice("offeringsNotice", err.message); }
}

async function advanceBooking(id, status) {

  catch (err) { showNotice("bookingsNotice", err.message); }
}

/* ============================================================
   FOLIO — the guest's running room-charge tab. Only relevant for a
   CHECKED_IN booking. Checkout is blocked server-side while a balance
   is outstanding, so this modal is the only path to checking someone
   out once they've charged anything to their room.
   ============================================================ */
async function openFolioModal(bookingId) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay"; overlay.id = "folioModal";
  overlay.innerHTML = `
    <div class="modal" style="max-width:600px;">
      <h3>Room folio</h3>
      <div id="folioModalNotice"></div>
      <div id="folioModalContent"><div class="loading-state">Loading…</div></div>
    </div>`;
  document.body.appendChild(overlay);
  await refreshFolioModal(bookingId);
}

async function refreshFolioModal(bookingId) {
  try {
    const { booking, charges, balance } = await adminApi.getFolio(bookingId);
    document.getElementById("folioModalContent").innerHTML = `
      <p style="color:var(--text-muted); font-size:0.86rem; margin-bottom:12px;">${booking.guestName} — Room ${booking.roomNumber}</p>

        </table>
        <div class="summary-line total" style="margin-top:10px;"><span>Balance due</span><span>&#8358;${Number(balance).toLocaleString()}</span></div>
        <form id="folioSettleForm" style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
          <div class="form-field">
            <label>Settle by</label>
            <select id="folioMethod">
              <option value="CASH">Cash</option>
              <option value="CARD">Card</option>
              <option value="TRANSFER">Transfer</option>
              <option value="PAYSTACK">Paystack</option>
              <option value="STRIPE">Stripe</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="document.getElementById('folioModal').remove()">Close</button>
            <button type="submit" class="btn btn-primary" id="folioSettleBtn">Settle &amp; check out</button>
          </div>
        </form>
      ` : `

async function refreshTransactionsTable() {

    const { transactions, totals } = await adminApi.listTransactions(filters);

    document.getElementById("txnStatCards").innerHTML = `
      <div class="stat-card"><b>&#8358;${Number(totals?.paid || 0).toLocaleString()}</b><span>Total paid</span></div>

    `;

      <tr>

        <td>${t.guestName}</td>

async function refreshBlogTable() {
  try {
    const { posts } = await adminApi.listBlogPosts(_blogBranchFilter || undefined);
    document.getElementById("blogBody").innerHTML = posts.length ? posts.map((p) => `
      <tr>
        <td>${p.title}</td>
        <td>${p.branch ? p.branch.name : "Company-wide"}</td>
        <td><span class="badge ${p.status === "PUBLISHED" ? "badge-success" : "badge-muted"}">${p.status === "PUBLISHED" ? "Published" : "Draft"}</span></td>
        <td>${p.publishedAt ? new Date(p.publishedAt).toLocaleDateString() : "—"}</td>
        <td>${p.campaign ? (p.campaign.status === "SENT" ? `Sent to ${p.campaign.sentCount}` : p.campaign.status) : (p.autoNewsletter ? "Pending" : "Off")}</td>
        <td style="text-align:right;">
          <button class="btn-icon" onclick='openBlogModal(${JSON.stringify(p).replace(/'/g, "&#39;")})' title="Edit"><i class="fas fa-pen"></i></button>
          <button class="btn-icon" onclick="deleteBlogPost('${p.id}')" title="Delete"><i class="fas fa-trash"></i></button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No posts yet.</td></tr>`;
  } catch (err) {
    document.getElementById("blogBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
  }
}

function openBlogModal(post) {
  document.getElementById("blogModalTitle").textContent = post ? "Edit post" : "Write a post";
  document.getElementById("blogForm").reset();
  document.getElementById("bpId").value = post ? post.id : "";
  document.getElementById("bpSlugPreview").textContent = post ? post.slug : "";
  if (post) {
    document.getElementById("bpTitle").value = post.title;
    document.getElementById("bpExcerpt").value = post.excerpt || "";
    document.getElementById("bpContent").value = post.content;
    document.getElementById("bpCoverImageUrl").value = post.coverImageUrl || "";
    document.getElementById("bpTags").value = (post.tags || []).join(", ");
    document.getElementById("bpAutoNewsletter").checked = post.autoNewsletter;
    const branchSelect = document.getElementById("bpBranch");
    if (branchSelect) branchSelect.value = post.branch ? post.branch.id : "";
    const publishBtn = document.getElementById("bpPublishBtn");
    if (post.status === "PUBLISHED") { publishBtn.textContent = "Save changes"; document.getElementById("bpDraftBtn").style.display = "none"; }
    else { publishBtn.textContent = "Publish"; document.getElementById("bpDraftBtn").style.display = ""; }
  } else {
    document.getElementById("bpPublishBtn").textContent = "Publish";
    document.getElementById("bpDraftBtn").style.display = "";
  }
  document.getElementById("blogModal").style.display = "flex";
}

function closeBlogModal() { document.getElementById("blogModal").style.display = "none"; }

async function submitBlogForm(publish) {
  const id = document.getElementById("bpId").value;
  const branchSelect = document.getElementById("bpBranch");
  const branchId = branchSelect ? (branchSelect.value || undefined) : undefined;
  const tags = document.getElementById("bpTags").value.split(",").map((t) => t.trim()).filter(Boolean);
  const payload = {
    title: document.getElementById("bpTitle").value,
    excerpt: document.getElementById("bpExcerpt").value || undefined,
    content: document.getElementById("bpContent").value,
    coverImageUrl: document.getElementById("bpCoverImageUrl").value || undefined,
    tags,
    autoNewsletter: document.getElementById("bpAutoNewsletter").checked,
  };
  // Editing an already-published post and hitting the (now "Save changes")
  // button shouldn't silently revert it to draft.
  const isEditingPublished = id && document.getElementById("bpPublishBtn").textContent === "Save changes";
  if (publish || isEditingPublished) payload.status = "PUBLISHED";

  const btn = publish ? document.getElementById("bpPublishBtn") : document.getElementById("bpDraftBtn");
  btn.disabled = true;
  try {
    if (id) await adminApi.updateBlogPost(id, payload, branchId);
    else await adminApi.createBlogPost(payload, branchId);
    closeBlogModal();
    showNotice("blogNotice", publish ? "Post published — newsletter dispatch may take a minute." : "Draft saved.", "success");
    refreshBlogTable();
  } catch (err) {
    showNotice("blogNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function deleteBlogPost(id) {
  if (!confirm("Delete this post? This can't be undone.")) return;
  try {
    await adminApi.deleteBlogPost(id, _blogBranchFilter || undefined);
    refreshBlogTable();
  } catch (err) {
    showNotice("blogNotice", err.message);
  }
}

function openStaffModal() { document.getElementById("staffModal").style.display = "flex"; }
function closeStaffModal() { document.getElementById("staffModal").style.display = "none"; }

async function submitStaffForm(e) {
  e.preventDefault();
  const btn = document.getElementById("sSubmitBtn");
  btn.disabled = true;
  try {
    const permissions = Array.from(document.querySelectorAll('#staffForm .checkbox-grid input:checked')).map((el) => el.value);
    const role = document.getElementById("sRole").value;
    const branchSelect = document.getElementById("sBranch");

    const department = document.getElementById("sDepartment").value || undefined;
    if (role === "MANAGER") {
      // Directors only — a real Manager account, not a mislabeled Staff row.
      const payload = {
        name: document.getElementById("sName").value,
        email: document.getElementById("sEmail").value,
        password: document.getElementById("sPassword").value,
        roleTitle: document.getElementById("sTitle").value || undefined,
        department,
        branchId: branchSelect ? branchSelect.value : undefined,
      };
      await adminApi.createManager(payload);
      showNotice("staffNotice", "Manager account created.", "success");
    } else {
      const payload = {
        name: document.getElementById("sName").value,
        email: document.getElementById("sEmail").value,
        password: document.getElementById("sPassword").value,
        roleTitle: document.getElementById("sTitle").value || undefined,
        department,
        permissions,

      if (branchSelect) payload.branchId = branchSelect.value;
      await adminApi.createStaff(payload);
      showNotice("staffNotice", "Staff account created.", "success");

    showNotice("staffNotice", err.message);

async function refreshTicketsTable() {
  try {
    const { tickets } = await adminApi.listTickets();

    document.getElementById("ticketsBody").innerHTML = tickets.length ? tickets.map((t) => {
      const assignee = t.assignedManager || t.assignedStaffMember;
      return `
      <tr>
        <td>${t.subject}</td>
        <td>${t.guest.name}</td>
        <td>${t.priority}</td>

        </td>
      </tr>
    `; }).join("") : `<tr><td colspan="6" class="empty-state">No tickets yet.</td></tr>`;

    const openCount = tickets.filter((t) => ["OPEN", "IN_PROGRESS"].includes(t.status)).length;

      el.classList.toggle("visible", openCount > 0);

  } catch (err) {
    document.getElementById("ticketsBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;

/** A ticket belongs to one specific branch (visible across every branch
 * in this Director view), so who's assignable has to be fetched fresh
 * per-ticket rather than from one global staff list. */
let _assignTicketId = null;
async function openAssignTicketModal(ticketId) {
  const ticket = _cachedTickets.find((t) => t.id === ticketId);
  if (!ticket) return;
  _assignTicketId = ticketId;
  document.getElementById("assignTicketModal").style.display = "flex";
  const select = document.getElementById("assignTicketTarget");
  select.innerHTML = `<option value="">Loading…</option>`;
  try {
    const [{ managers }, { staff }] = await Promise.all([
      adminApi.listManagers(ticket.branchId),
      adminApi.listStaff(ticket.branchId),
    ]);
    const options = [
      ...managers.map((m) => ({ id: m.id, label: `${m.name} (Manager)` })),
      ...staff.map((s) => ({ id: s.id, label: `${s.name} (Staff)` })),
    ];
    select.innerHTML = options.length
      ? options.map((o) => `<option value="${o.id}">${o.label}</option>`).join("")
      : `<option value="">No one at this branch yet</option>`;
  } catch (err) {
    select.innerHTML = `<option value="">Couldn't load — ${err.message}</option>`;
  }
}
function closeAssignTicketModal() { document.getElementById("assignTicketModal").style.display = "none"; }
async function submitAssignTicket() {
  const staffId = document.getElementById("assignTicketTarget").value;
  if (!staffId) return showNotice("assignTicketNotice", "Pick someone to assign this to.");
  const btn = document.getElementById("assignTicketSubmitBtn");
  btn.disabled = true;
  try {
    await adminApi.assignTicket(_assignTicketId, staffId);
    closeAssignTicketModal();
    refreshTicketsTable();
  } catch (err) {
    showNotice("assignTicketNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}
async function resolveTicketRow(id) {
  try { await adminApi.resolveTicket(id); refreshTicketsTable(); }
  catch (err) { showNotice("ticketsNotice", err.message); }
}

let _bugSignalsShowResolved = false;

async function loadBugSignalsPage() {
  const container = document.getElementById("pageContent");
  container.innerHTML = `
    ${pageHeader("Bug Signals", "Guests who got stuck clicking the same thing repeatedly — usually means something broke.")}
    <div class="panel" style="margin-bottom:16px; display:flex; gap:10px; align-items:center;">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="bsShowResolved" onchange="_bugSignalsShowResolved=this.checked; refreshBugSignals();">

    <div class="panel">
      <table><thead><tr><th>When</th><th>Guest</th><th>Page</th><th>Stuck on</th><th>Clicks</th><th>Actions</th></tr></thead>
        <tbody id="bugSignalsBody"><tr><td colspan="6" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>
  `;
  await refreshBugSignals();

  _bugSignalsPollInterval = setInterval(refreshBugSignalsBadgeOnly, 30000);

async function refreshBugSignals() {
  try {
    const { signals } = await adminApi.listBugSignals(_bugSignalsShowResolved);
    document.getElementById("bugSignalsBody").innerHTML = signals.length ? signals.map((s) => `
      <tr>
        <td>${new Date(s.createdAt).toLocaleString()}</td>
        <td>${s.guest ? escapeHtmlLocal(s.guest.name) : "Anonymous"}</td>
        <td><code>${escapeHtmlLocal(s.path)}</code></td>
        <td>${escapeHtmlLocal(s.targetLabel)}</td>
        <td>${s.clickCount}× in ${s.windowSeconds}s</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="openTimelineModal('${s.id}')">View timeline</button>
          ${!s.resolvedAt ? `<button class="btn btn-sm btn-outline" onclick="markBugSignalResolved('${s.id}')">Mark resolved</button>` : `<span class="badge badge-resolved">Resolved</span>`}
        </td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">${_bugSignalsShowResolved ? "No resolved signals." : "Nothing stuck right now."}</td></tr>`;

    const unresolvedCount = _bugSignalsShowResolved ? 0 : signals.length;
    updateBugSignalsBadge(unresolvedCount);
  } catch (err) {
    document.getElementById("bugSignalsBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
  }
}

// Lightweight version for the background poll — only touches the badge,
// never re-renders the table out from under someone reading it.
async function refreshBugSignalsBadgeOnly() {
  try {
    const { signals } = await adminApi.listBugSignals(false);
    updateBugSignalsBadge(signals.length);
  } catch { /* silent — this is a background poll, not a user action */ }
}

function updateBugSignalsBadge(count) {
  const el = document.getElementById("bugSignalsNavBadge");
  if (!el) return;
  el.textContent = count;
  el.style.display = count ? "flex" : "none";
  el.classList.toggle("visible", count > 0);
}

async function markBugSignalResolved(id) {
  try {
    await adminApi.resolveBugSignal(id);
    showNotice("bugSignalsNotice", "Marked resolved.", "success");
    refreshBugSignals();
  } catch (err) {
    showNotice("bugSignalsNotice", err.message);
  }
}

const ACTIVITY_EVENT_ICONS = { PAGE_VIEW: "fa-file", CLICK: "fa-hand-pointer", API_CALL: "fa-arrows-turn-to-dots", ERROR: "fa-triangle-exclamation", STUCK: "fa-bug" };

async function openTimelineModal(signalId) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay"; overlay.id = "timelineModal";
  overlay.innerHTML = `
    <div class="modal" style="max-width:640px; max-height:80vh; overflow-y:auto;">
      <h3>Session timeline</h3>
      <div id="timelineModalContent"><div class="loading-state">Loading…</div></div>
      <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="document.getElementById('timelineModal').remove()">Close</button></div>
    </div>`;
  document.body.appendChild(overlay);

  try {
    const { signal, events } = await adminApi.getBugSignalTimeline(signalId);
    document.getElementById("timelineModalContent").innerHTML = `
      <p style="color:var(--text-muted); font-size:0.86rem; margin-bottom:14px;">
        ${signal.guest ? escapeHtmlLocal(signal.guest.name) : "Anonymous guest"} — stuck on <strong>${escapeHtmlLocal(signal.targetLabel)}</strong>
      </p>
      <div style="border-left:2px solid var(--border); padding-left:16px;">
        ${events.map((e) => `
          <div style="margin-bottom:14px; position:relative;">
            <i class="fa-solid ${ACTIVITY_EVENT_ICONS[e.type] || "fa-circle"}" style="position:absolute; left:-22px; top:2px; color:var(--text-muted); font-size:0.8rem;"></i>
            <div style="font-size:0.78rem; color:var(--text-muted);">${new Date(e.createdAt).toLocaleTimeString()}</div>
            <div>${describeActivityEvent(e)}</div>
          </div>
        `).join("")}
      </div>
    `;
  } catch (err) {
    document.getElementById("timelineModalContent").innerHTML = `<div class="notice error">${err.message}</div>`;
  }
}

function describeActivityEvent(e) {
  switch (e.type) {
    case "PAGE_VIEW": return `Viewed <code>${escapeHtmlLocal(e.path)}</code>`;
    case "CLICK": return `Clicked <strong>${escapeHtmlLocal(e.targetLabel || "something")}</strong>`;
    case "API_CALL": return `${e.method || ""} request — <span style="color:${e.statusCode >= 400 ? "#b3261e" : "inherit"};">${e.statusCode || "?"}</span> (${e.durationMs ?? "?"}ms)`;
    case "ERROR": return `<span style="color:#b3261e;">Error:</span> ${escapeHtmlLocal(e.message || "")}`;
    case "STUCK": return `<span style="color:#b3261e; font-weight:600;">Stuck:</span> ${escapeHtmlLocal(e.message || "")}`;
    default: return e.type;
  }
}

// Small local escaper — if this file already defines a shared escapeHtml
// helper elsewhere, delete this and use that one instead; this exists
// only so the patch doesn't assume one that might not be there.
function escapeHtmlLocal(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

          <select id="tagsBranchSelect" onchange="_tagsSelectedBranchId=this.value; refreshTagsPage();">${branchOptionsHtml}</select>
        </div>
        <div class="form-field" style="max-width:280px;">
          <label>New tag name</label>
          <input type="text" id="newTagName" placeholder="e.g. Breakfast, Traditional wear">
        </div>
        <div class="form-field" style="max-width:220px;">
          <label>Service</label>
          <select id="newTagService">
            ${Object.entries(TAG_SERVICE_LABELS).map(([val, label]) => `<option value="${val}">${label}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-primary" onclick="createTagConfirm()" ${_tagsSelectedBranchId ? "" : "disabled"} style="height:42px;">Add tag</button>
      </div>
    </div>
    <div id="tagsGroups">${_tagsSelectedBranchId ? `<div class="loading-state">Loading…</div>` : `<div class="empty-state">Pick a branch above.</div>`}</div>
  `;
  if (_tagsSelectedBranchId) await refreshTagsPage();
}

async function refreshTagsPage() {
  if (!_tagsSelectedBranchId) return;
  const container = document.getElementById("tagsGroups");
  container.innerHTML = `<div class="loading-state">Loading…</div>`;
  try {
    const { tags } = await adminApi.listTags(_tagsSelectedBranchId);
    if (!tags.length) { container.innerHTML = `<div class="empty-state">No tags yet for this branch — add one above.</div>`; return; }

    const byService = {};
    tags.forEach((t) => { (byService[t.service] = byService[t.service] || []).push(t); });

    container.innerHTML = Object.entries(TAG_SERVICE_LABELS)
      .filter(([service]) => byService[service])
      .map(([service, label]) => `
        <div class="panel">
          <h3>${label}</h3>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${byService[service].map((t) => `
              <span class="badge" style="display:inline-flex; align-items:center; gap:6px;">
                ${t.name}
                <button onclick="deleteTagConfirm('${t.id}')" style="background:none;border:none;cursor:pointer;color:inherit;opacity:0.6;padding:0;" title="Delete tag">&times;</button>
              </span>
            `).join("")}
          </div>
        </div>
      `).join("");
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

async function createTagConfirm() {
  const name = document.getElementById("newTagName").value.trim();
  const service = document.getElementById("newTagService").value;
  if (!name) return showNotice("tagsNotice", "Enter a tag name first.");
  try {
    await adminApi.createTag(_tagsSelectedBranchId, name, service);
    document.getElementById("newTagName").value = "";
    showNotice("tagsNotice", "Tag added.", "success");
    refreshTagsPage();
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

async function deleteTagConfirm(id) {
  if (!confirm("Delete this tag? Items that already used it keep the label — this only removes it from the picker for new ones.")) return;
  try {
    await adminApi.deleteTag(id, _tagsSelectedBranchId);
    refreshTagsPage();
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

/* ============================================================
   SETTINGS — per-branch operational info (address/city/state/phone/
   email/services). This used to show Name/Tagline/Description fields
   that don't exist on the backend's accepted field list at all, AND
   never sent a branchId, so it always failed with "Director must
   specify ?branchId=" before you could even see the mismatch. Both
   fixed here. (Branding/theme/policies live on the separate Site
   Settings page, untouched.)
   ============================================================ */
let _settingsSelectedBranchId = "";

async function loadSettingsPage() {
  const container = document.getElementById("pageContent");
  let branchOptionsHtml = `<option value="">Select a branch…</option>`;
  let branches = [];
  try {
    ({ branches } = await adminApi.listBranches());
    if (!_settingsSelectedBranchId && branches.length) _settingsSelectedBranchId = branches[0].id;
    branchOptionsHtml = branches.map((b) => `<option value="${b.id}" ${b.id === _settingsSelectedBranchId ? "selected" : ""}>${b.name}</option>`).join("");
  } catch { /* non-fatal */ }

  container.innerHTML = `
    ${pageHeader("Settings", "Per-branch operational info — address, contact details, and which services are live.")}
    <div id="settingsNotice"></div>
    <div class="panel">
      <div class="form-field" style="max-width:320px;">
        <label>Branch</label>
        <select id="settingsBranchSelect" onchange="_settingsSelectedBranchId=this.value; loadSettingsPage();">${branchOptionsHtml}</select>
      </div>
    </div>
    <div class="panel" id="settingsFormPanel"><div class="loading-state">${_settingsSelectedBranchId ? "Loading…" : "Pick a branch above."}</div></div>
  `;
  if (!_settingsSelectedBranchId) return;

  try {
    const { branch } = await adminApi.getSettings(_settingsSelectedBranchId);
    document.getElementById("settingsFormPanel").innerHTML = `
      <form id="settingsForm">
        <div class="form-row">
          <div class="form-field"><label>Email</label><input type="email" id="stEmail" value="${branch.email || ""}"></div>
          <div class="form-field"><label>Phone</label><input type="text" id="stPhone" value="${branch.phone || ""}"></div>
        </div>
        <div class="form-field"><label>Address</label><input type="text" id="stAddress" value="${branch.address || ""}"></div>
        <div class="form-row">
          <div class="form-field"><label>City</label><input type="text" id="stCity" value="${branch.city || ""}"></div>
          <div class="form-field"><label>State</label><input type="text" id="stState" value="${branch.state || ""}"></div>
        </div>
        <div class="form-field">
          <label>Services live at this branch</label>
          <div class="checkbox-grid" id="stServices">
            ${Object.entries(SERVICE_LABELS).map(([val, label]) => `
              <label class="checkbox-item"><input type="checkbox" value="${val}" ${(branch.services || []).includes(val) ? "checked" : ""}> ${label}</label>
            `).join("")}
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="stSubmitBtn">Save settings</button>
      </form>
    `;
    document.getElementById("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("stSubmitBtn");
      btn.disabled = true;
      try {
        await adminApi.updateSettings(_settingsSelectedBranchId, {
          email: document.getElementById("stEmail").value,
          phone: document.getElementById("stPhone").value,
          address: document.getElementById("stAddress").value,
          city: document.getElementById("stCity").value,
          state: document.getElementById("stState").value,
          services: Array.from(document.getElementById("stServices").querySelectorAll("input:checked")).map((el) => el.value),
        });
        showNotice("settingsNotice", "Settings saved.", "success");
      } catch (err) {
        showNotice("settingsNotice", err.message);
      } finally {
        btn.disabled = false;
      }
    });
  } catch (err) {
    document.getElementById("settingsFormPanel").innerHTML = `<div class="empty-state">${err.message}</div>`;
  }
}

/* ============================================================

async function loadSiteSettingsPage() {

function switchSiteSettingsTab(tab) {
  if (_siteSettingsDirty && !confirm("You have unsaved changes on this tab. Switch anyway and lose them?")) return;
  _siteSettingsTab = tab;
  document.querySelectorAll("#siteSettingsTabs .tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  _siteSettingsDirty = false;
  document.getElementById("siteSettingsSaveBar").classList.remove("show");
  renderSiteSettingsTab(tab);
}

async function uploadHeroVideo(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const status = document.getElementById("heroVideoUploadStatus");
  status.textContent = "Uploading — this can take a moment for larger files…";
  try {
    const { settings } = await adminUploadVideo("/director/settings/hero-video", file);
    window._siteSettings = settings;
    // The video is already saved server-side the moment this resolves —
    // nothing left for the main Save button to do for this field, so
    // don't leave an "unsaved changes" bar showing because of it.
    _siteSettingsDirty = false;
    document.getElementById("siteSettingsSaveBar").classList.remove("show");
    renderSiteSettingsTab("identity");
    showNotice("siteSettingsNotice", "Hero video uploaded.", "success");
  } catch (err) {
    status.textContent = "";
    showNotice("siteSettingsNotice", err.message);
  }
}

async function removeHeroVideo() {
  if (!confirm("Remove the hero video? The public homepage hero will show nothing until a new one is uploaded.")) return;
  try {
    const { settings } = await adminRequest("/director/settings/hero-video", { method: "DELETE" });
    window._siteSettings = settings;
    renderSiteSettingsTab("identity");
    showNotice("siteSettingsNotice", "Hero video removed.", "success");
  } catch (err) {
    showNotice("siteSettingsNotice", err.message);
  }
}

function discardSiteSettingsChanges() {
  _siteSettingsDirty = false;
  document.getElementById("siteSettingsSaveBar").classList.remove("show");
  renderSiteSettingsTab(_siteSettingsTab);
}

function _watchSiteSettingsDirty() {
  const panel = document.getElementById("siteSettingsPanel");
  panel.querySelectorAll("input, select, textarea").forEach((el) => {
    el.addEventListener("input", _markSiteSettingsDirty);
    el.addEventListener("change", _markSiteSettingsDirty);
  });
}
function _markSiteSettingsDirty() {
  if (_siteSettingsDirty) return;
  _siteSettingsDirty = true;
  document.getElementById("siteSettingsSaveBar").classList.add("show");
}

function updateBannerPreview() {
  const enabled = document.getElementById("ssBannerEnabled")?.checked;
  const text = document.getElementById("ssBannerText")?.value || "";
  const type = document.getElementById("ssBannerType")?.value || "info";
  const preview = document.getElementById("ssBannerPreview");
  if (!preview) return;
  preview.className = `ss-banner-preview ${type} ${enabled && text ? "show" : ""}`;
  document.getElementById("ssBannerPreviewText").textContent = text;
}

async function saveSiteSettingsCurrentTab() {
  const panel = document.getElementById("siteSettingsPanel");
  const payload = {};

  panel.querySelectorAll("input[name], select[name], textarea[name]").forEach((el) => {
    if (el.type === "checkbox") {
      payload[el.name] = el.checked;
    } else if (el.type === "number") {
      payload[el.name] = el.value === "" ? undefined : Number(el.value);
    } else if (el.value !== "" || el.tagName === "TEXTAREA") {
      payload[el.name] = el.value;
    }
  });

  // maintenanceBypassToken is write-only and blank means "don't change it" —
  // never send an empty string, that would wipe out an existing token.
  if (payload.maintenanceBypassToken === "") delete payload.maintenanceBypassToken;

  // Social links live outside the normal name-attribute sweep since they're
  // nested under one JSON field on the model.
  if (_siteSettingsTab === "identity") {
    payload.socialLinks = {
      ...(window._siteSettings?.socialLinks || {}),
      instagram: document.getElementById("ssSocialInstagram")?.value || undefined,
      facebook: document.getElementById("ssSocialFacebook")?.value || undefined,
    };
  }

  try {
    const { settings } = await adminApi.updateSiteSettings(payload);
    window._siteSettings = settings;
    _siteSettingsDirty = false;
    document.getElementById("siteSettingsSaveBar").classList.remove("show");
    updateMaintenanceQuickCard(settings);
    showNotice("siteSettingsNotice", "Saved.", "success");
  } catch (err) {
    showNotice("siteSettingsNotice", err.message);
  }
}

function updateMaintenanceQuickCard(s) {
  const card = document.getElementById("ssMaintCard");
  const title = document.getElementById("ssMaintCardTitle");
  const status = document.getElementById("ssMaintCardStatus");
  const btn = document.getElementById("ssMaintToggleBtn");
  if (!card) return;
  card.classList.toggle("is-off", !s.maintenanceMode);
  title.textContent = s.maintenanceMode ? "Maintenance Mode — LIVE" : "Maintenance Mode";
  status.textContent = s.maintenanceMode ? "The public site is currently showing the maintenance page to guests." : "The public site is live and reachable by guests.";
  btn.textContent = s.maintenanceMode ? "Turn off" : "Turn on";
  btn.className = s.maintenanceMode ? "btn btn-primary" : "btn btn-danger";
}

async function toggleMaintenanceQuick() {
  const s = window._siteSettings || {};
  const btn = document.getElementById("ssMaintToggleBtn");
  btn.disabled = true;
  try {
    const { settings } = await adminApi.updateSiteSettings({ maintenanceMode: !s.maintenanceMode });
    window._siteSettings = settings;
    updateMaintenanceQuickCard(settings);
    if (_siteSettingsTab === "maintenance") renderSiteSettingsTab("maintenance");
    showNotice("siteSettingsNotice", settings.maintenanceMode ? "Maintenance mode turned ON." : "Maintenance mode turned OFF.", "success");
  } catch (err) {
    showNotice("siteSettingsNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

function exportSiteSettings() {
  const s = window._siteSettings || {};
  const blob = new Blob([JSON.stringify(s, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `hotel-settings-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importSiteSettings(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  if (!confirm("This will overwrite your current site settings with the contents of this file. Continue?")) {
    inputEl.value = "";
    return;
  }
  try {
    const text = await file.text();
    const imported = JSON.parse(text);
    // Strip read-only/system fields that shouldn't be re-sent.
    delete imported.id; delete imported.updatedAt; delete imported.updatedById; delete imported.hasMaintenanceBypassToken;
    const { settings } = await adminApi.updateSiteSettings(imported);
    window._siteSettings = settings;
    updateMaintenanceQuickCard(settings);
    renderSiteSettingsTab(_siteSettingsTab);
    showNotice("siteSettingsNotice", "Settings imported and saved.", "success");
  } catch (err) {
    showNotice("siteSettingsNotice", "Import failed: " + err.message);
  } finally {
    inputEl.value = "";
  }
}

async function submitProfileForm(e) {

async function submitPasswordForm(e) {
  e.preventDefault();
  const btn = document.getElementById("acPasswordSubmitBtn");
  btn.disabled = true;
  try {
    await adminApi.changePassword({

function renderTwoFactorStatus(enabled) {
  const el = document.getElementById("twoFactorStatus");
  if (enabled) {
    el.innerHTML = `
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:14px;">
        <span class="badge badge-success">Enabled</span> Your account requires a code from your authenticator app at every login.
      </p>
      <button class="btn btn-outline" onclick="openDisable2FAModal()">Turn off 2FA</button>
    `;
  } else {
    el.innerHTML = `
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:14px;">
        <span class="badge badge-muted">Disabled</span> Add a second step at login using an authenticator app (Google Authenticator, Authy, 1Password, etc.).
      </p>
      <button class="btn btn-primary" onclick="startTwoFactorSetup()">Turn on 2FA</button>

}

        <div id="enable2FAStep2" style="display:none;">
          <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:10px;">2FA is on. Save these backup codes somewhere safe — each works once, if you ever lose access to your authenticator app. <strong>They won't be shown again.</strong></p>
          <div id="backupCodesList" style="background:var(--ivory); padding:14px 18px; border-radius:6px; font-family:monospace; font-size:0.9rem; line-height:1.9;"></div>

    <div class="modal-overlay" id="disable2FAModal" style="display:none;">
      <div class="modal">
        <h3>Turn off two-factor authentication</h3>
        <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">Confirm your password to turn off 2FA for your account.</p>
        <div class="form-field"><label>Password</label><input type="password" id="disable2FAPassword"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeTwoFactorModal('disable2FAModal')">Cancel</button>

}

function closeTwoFactorModal(id) { document.getElementById(id).style.display = "none"; }

async function startTwoFactorSetup() {
  try {

    document.getElementById("qrCodeContainer").innerHTML = `<img src="${qrCodeDataUrl}" alt="2FA QR code" style="width:200px; height:200px;">`;

}

async function submitEnableTwoFactor() {
  const btn = document.getElementById("enable2FASubmitBtn"); btn.disabled = true;
  try {
    const { backupCodes } = await adminApi.enableTwoFactor(document.getElementById("enable2FACode").value.trim());

function openDisable2FAModal() { document.getElementById("disable2FAPassword").value = ""; document.getElementById("disable2FAModal").style.display = "flex"; }

async function submitDisableTwoFactor() {
  const btn = document.getElementById("disable2FASubmitBtn"); btn.disabled = true;
  try {
    await adminApi.disableTwoFactor(document.getElementById("disable2FAPassword").value);
    closeTwoFactorModal("disable2FAModal");
    const staff = getStaff(); staff.twoFactorEnabled = false; setSession(getToken(), staff);
    showNotice("myAccountNotice", "2FA turned off.", "success");
    loadMyAccountPage();
  } catch (err) { showNotice("myAccountNotice", err.message); } finally { btn.disabled = false; }
}

async function populateManagerBranchSelect() {
  try {
    const { branches } = await adminApi.listBranches();

  }

async function refreshManagersTable() {
  const body = document.getElementById("managersBody");
  try {
    const { managers } = await adminApi.listManagers();
    window._cachedManagers = managers;
    body.innerHTML = managers.length ? managers.map((m) => `
      <tr>
        <td>${m.name}${m.roleTitle ? `<div class="muted" style="font-size:0.8rem;">${m.roleTitle}</div>` : ""}</td>
        <td>${m.email}</td>
        <td>${m.branch?.name || "&mdash;"}</td>
        <td>${m.department || "&mdash;"}</td>
        <td><span class="badge badge-${m.isActive ? "active" : "inactive"}">${m.isActive ? "Active" : "Inactive"}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="openManagerModal('${m.id}')">Edit</button>
          <button class="btn btn-sm btn-outline" onclick="toggleManagerActive('${m.id}', ${m.isActive})">${m.isActive ? "Deactivate" : "Activate"}</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No managers yet.</td></tr>`;

    body.innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
  }
}

function openManagerModal(managerId) {
  document.getElementById("managerForm").reset();
  document.getElementById("mgId").value = managerId || "";

  const manager = managerId ? (window._cachedManagers || []).find((m) => m.id === managerId) : null;
  document.getElementById("managerModalTitle").textContent = manager ? "Edit manager" : "New manager";
  document.getElementById("mgSubmitBtn").textContent = manager ? "Save changes" : "Create manager";

  // Branch and password are create-only — a manager's branch is fixed at
  // creation, and the backend has no "reset this password" field on
  // updateManager (use the normal forgot-password flow for that instead).
  document.getElementById("mgBranchField").style.display = manager ? "none" : "block";
  document.getElementById("mgPasswordRow").style.display = manager ? "none" : "flex";
  document.getElementById("mgBranch").required = !manager;
  document.getElementById("mgPassword").required = !manager;

  if (manager) {
    document.getElementById("mgName").value = manager.name;
    document.getElementById("mgEmail").value = manager.email;
    document.getElementById("mgEmail").disabled = true;
    document.getElementById("mgTitle").value = manager.roleTitle || "";
    document.getElementById("mgDepartment").value = manager.department || "";
  } else {
    document.getElementById("mgEmail").disabled = false;
  }
  document.getElementById("managerModal").style.display = "flex";
}
function closeManagerModal() { document.getElementById("managerModal").style.display = "none"; }

async function submitManagerForm(e) {
  e.preventDefault();
  const btn = document.getElementById("mgSubmitBtn");
  btn.disabled = true;
  try {
    const id = document.getElementById("mgId").value;
    const department = document.getElementById("mgDepartment").value || undefined;

    if (id) {
      await adminApi.updateManager(id, {
        name: document.getElementById("mgName").value,
        roleTitle: document.getElementById("mgTitle").value || undefined,
        department,
      });
      showNotice("managersNotice", "Manager updated.", "success");
    } else {
      await adminApi.createManager({
        branchId: document.getElementById("mgBranch").value,
        name: document.getElementById("mgName").value,
        email: document.getElementById("mgEmail").value,
        password: document.getElementById("mgPassword").value,
        roleTitle: document.getElementById("mgTitle").value || undefined,
        department,
      });
      showNotice("managersNotice", "Manager created — welcome email sent.", "success");
    }
    closeManagerModal();
    refreshManagersTable();
  } catch (err) {
    showNotice("managersNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function toggleManagerActive(id, currentlyActive) {
  try { await adminApi.updateManager(id, { isActive: !currentlyActive }); refreshManagersTable(); }
  catch (err) { showNotice("managersNotice", err.message); }
}

let FD_DATE = todayISO();

    `)}
    <div id="fdNotice"></div>
    <div id="fdStats" class="stats-grid"></div>
    <div class="split">
      <div>
        <div class="panel flush">
          <div class="panel-head"><h3>Arrivals</h3><span class="panel-hint" id="fdArrivalsCount"></span></div>

        </div>
        <div class="panel flush">

            <button class="btn btn-outline btn-block" onclick="fdRedeemTicketModal()"><i class="fas fa-qrcode"></i> Redeem event ticket</button>

  `);
  document.getElementById("fdDate").onchange = (e) => { FD_DATE = e.target.value; fdRefresh(); };

async function fdRefresh() {
  const [arr, dep] = await Promise.allSettled([adminApi.arrivals(FD_DATE), adminApi.departures(FD_DATE)]);
  const arrivals = arr.status === "fulfilled" ? (arr.value.arrivals || arr.value.bookings || []) : [];
  const departures = dep.status === "fulfilled" ? (dep.value.departures || dep.value.bookings || []) : [];

  if (arr.status === "rejected") showNotice("fdNotice", arr.reason.message);

  const unassigned = arrivals.filter((b) => !(b.room && b.room.roomNumber) && !b.roomNumber).length;
  const dueOut = departures.filter((b) => (b.status || "") === "CHECKED_IN").length;
  document.getElementById("fdStats").innerHTML = `
    <div class="stat-card"><b>${arrivals.length}</b><span>Arrivals</span></div>
    <div class="stat-card ${unassigned ? "is-warn" : "is-good"}"><b>${unassigned}</b><span>Rooms unassigned</span></div>
    <div class="stat-card"><b>${departures.length}</b><span>Departures</span></div>
    <div class="stat-card ${dueOut ? "is-warn" : "is-good"}"><b>${dueOut}</b><span>Still to check out</span></div>
  `;
  document.getElementById("fdArrivalsCount").textContent = `${arrivals.length} booking(s) for ${fmtDate(FD_DATE)}`;
  document.getElementById("fdDeparturesCount").textContent = `${departures.length} booking(s) for ${fmtDate(FD_DATE)}`;
  document.getElementById("fdArrivals").innerHTML = fdBookingTable(arrivals, "arrival");
  document.getElementById("fdDepartures").innerHTML = fdBookingTable(departures, "departure");
}

function fdGuestName(b) {
  return b.guestName || (b.guest && b.guest.name) || b.contactName || "Guest";
}
function fdRoomNumber(b) {
  return b.roomNumber || (b.room && b.room.roomNumber) || null;
}

function fdBookingTable(rows, kind) {
  if (!rows.length) return `<div class="empty-state">No ${kind}s for this date.</div>`;
  return `<table><thead><tr>
      <th>Guest</th><th>Room</th><th>Stay</th><th>Status</th><th class="num">Balance</th><th></th>
    </tr></thead><tbody>
    ${rows.map((b) => {
      const room = fdRoomNumber(b);
      const status = b.status || "";
      const actions = kind === "arrival"
        ? `${room ? "" : `<button class="btn btn-sm btn-outline" onclick="fdAssignRoom('${b.id}')">Assign</button>`}
           <button class="btn btn-sm btn-outline" onclick="fdPreRegister('${b.id}')">Pre-reg</button>
           ${status === "CHECKED_IN" ? "" : `<button class="btn btn-sm btn-primary" onclick="fdCheckIn('${b.id}')">Check in</button>`}`
        : `<button class="btn btn-sm btn-outline" onclick="openFolioModal('${b.id}')">Folio</button>
           ${status === "CHECKED_IN" ? `<button class="btn btn-sm btn-primary" onclick="fdCheckOut('${b.id}')">Check out</button>` : ""}`;
      return `<tr>
        <td><b>${esc(fdGuestName(b))}</b><div class="faint">${esc(b.reference || b.id.slice(0, 8))}</div></td>
        <td>${room ? `<span class="mono">${esc(room)}</span>` : `<span class="badge badge-warning">Unassigned</span>`}</td>
        <td class="faint">${fmtShortDate(b.checkIn)} → ${fmtShortDate(b.checkOut)}</td>
        <td>${statusBadge(status)}</td>
        <td class="num">${b.balance !== undefined ? fmtMoney(b.balance) : b.totalAmount !== undefined ? fmtMoney(b.totalAmount) : "—"}</td>
        <td><div class="row-actions">${actions}
          <button class="btn btn-sm btn-icon" title="Guest folio & details" onclick="fdBookingDrawer('${b.id}')"><i class="fas fa-ellipsis"></i></button>
        </div></td>
      </tr>`;
    }).join("")}
  </tbody></table>`;
}

  openModal(`
    <h3>Assign a room</h3>
    <p class="muted" style="font-size:0.84rem;">Leave the room number blank to let the system pick the best free unit of the booked type.</p>

    <div class="modal-actions">
      <button class="btn btn-primary" id="fdAssignBtn">Assign room</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>

  document.getElementById("fdAssignBtn").onclick = async (e) => {
    const payload = {
      roomNumber: document.getElementById("fdAssignRoomNo").value.trim() || undefined,

async function fdCheckOut(bookingId) {

  try { folio = await adminApi.getFolio(bookingId); } catch { /* folio may be empty */ }
  const balance = folio ? Number(folio.balance || 0) : 0;
  openModal(`
    <h3>Check out</h3>
    ${balance > 0
      ? `<div class="notice warning">Outstanding balance of <b>${fmtMoney(balance, folio.currency)}</b>. Settle the folio first or record the payment method below.</div>`
      : `<div class="notice success">Folio is clear.</div>`}
    <div class="form-field"><label>Settle remaining balance with</label>
      <select id="fdCoMethod">
        <option value="">Don't settle now</option>
        <option value="CASH">Cash</option><option value="CARD">Card</option>
        <option value="TRANSFER">Transfer</option><option value="PAYSTACK">Paystack</option><option value="STRIPE">Stripe</option>

    <div class="modal-actions">
      <button class="btn btn-primary" id="fdCoBtn">Check out</button>

      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>

  `);
  document.getElementById("fdCoBtn").onclick = async (e) => {

      ${g.preferences ? `<p class="faint" style="margin-top:8px;"><b>Prefers:</b> ${esc(g.preferences)}</p>` : ""}
      ${g.dietaryNotes ? `<p class="faint"><b>Dietary:</b> ${esc(g.dietaryNotes)}</p>` : ""}

      ${g.thisStayRequests ? `<p class="faint"><b>This stay:</b> ${esc(g.thisStayRequests)}</p>` : ""}

/* ============================================================
   ROOMS & UPKEEP — housekeeping board, maintenance, rates,
   channel connections.
   ============================================================ */

const HK_STATUSES = ["CLEAN", "DIRTY", "CLEANING", "INSPECTED", "OUT_OF_ORDER"];
const HK_TASK_FLOW = {
  PENDING: ["ASSIGNED", "IN_PROGRESS", "CANCELLED"],
  ASSIGNED: ["IN_PROGRESS", "CANCELLED"],
  IN_PROGRESS: ["AWAITING_INSPECTION", "CANCELLED"],
  AWAITING_INSPECTION: ["COMPLETED", "IN_PROGRESS"],
  COMPLETED: [],
  CANCELLED: [],
};
let HK_FILTER = "ALL";
let HK_BOARD = { summary: {}, rooms: [] };

async function loadHousekeepingBoardPage() {
  render(`
    ${pageHeader("Housekeeping Board", "Every room, its cleaning state, open tasks and faults — at a glance.", `
      <button class="btn btn-outline" onclick="hkNewTask()"><i class="fas fa-plus"></i> New task</button>
      <button class="btn btn-outline" onclick="mtNewWorkOrder()"><i class="fas fa-screwdriver-wrench"></i> Log fault</button>
      <button class="btn btn-primary" onclick="loadHousekeepingBoardPage()"><i class="fas fa-rotate"></i> Refresh</button>
    `)}
    <div id="hkStats" class="stats-grid"></div>
    <div class="chip-row" id="hkFilters"></div>
    <div class="panel"><div id="hkBoard"><div class="loading-state">Loading board…</div></div></div>
  `);
  try {
    HK_BOARD = await adminApi.housekeepingBoard();
  } catch (err) {
    renderInto("hkBoard", `<div class="notice error">${esc(err.message)}</div>`);
    return;
  }
  hkRenderBoard();
}

function hkRenderBoard() {
  const s = HK_BOARD.summary || {};
  const rooms = HK_BOARD.rooms || [];
  document.getElementById("hkStats").innerHTML = `
    <div class="stat-card is-good"><b>${fmtNum(s.clean || 0)}</b><span>Clean</span></div>
    <div class="stat-card is-bad"><b>${fmtNum(s.dirty || 0)}</b><span>Dirty</span></div>
    <div class="stat-card is-warn"><b>${fmtNum(s.cleaning || 0)}</b><span>Being cleaned</span></div>
    <div class="stat-card"><b>${fmtNum(s.occupied || 0)}</b><span>Occupied</span></div>
    <div class="stat-card"><b>${fmtNum(s.outOfOrder || 0)}</b><span>Out of order</span></div>
    <div class="stat-card is-warn"><b>${fmtNum(s.openTasks || 0)}</b><span>Open tasks</span></div>
    <div class="stat-card is-bad"><b>${fmtNum(s.openWorkOrders || 0)}</b><span>Open faults</span></div>
  `;
  const counts = {};
  rooms.forEach((r) => { const k = r.housekeepingStatus || "UNKNOWN"; counts[k] = (counts[k] || 0) + 1; });
  document.getElementById("hkFilters").innerHTML = [["ALL", rooms.length], ...HK_STATUSES.map((st) => [st, counts[st] || 0])]
    .map(([key, n]) => `<span class="chip ${HK_FILTER === key ? "active" : ""}" onclick="hkSetFilter('${key}')">${esc(key.replace(/_/g, " "))} <b>${n}</b></span>`).join("");

  const filtered = HK_FILTER === "ALL" ? rooms : rooms.filter((r) => r.housekeepingStatus === HK_FILTER);
  document.getElementById("hkBoard").innerHTML = filtered.length ? `<div class="board-grid">${filtered.map((r) => {
    const openTasks = (r.tasks || []).filter((t) => !["COMPLETED", "CANCELLED"].includes(t.status)).length;
    const openWo = (r.workOrders || []).filter((w) => !["COMPLETED", "CLOSED", "CANCELLED"].includes(w.status)).length;
    return `<div class="room-tile hk-${esc(r.housekeepingStatus || "UNKNOWN")}" onclick="hkOpenRoom('${r.id}')">
      <div class="rt-num">${esc(r.roomNumber)}</div>
      <div class="rt-meta">${r.floor !== undefined && r.floor !== null ? `Floor ${esc(r.floor)}` : ""} ${r.status ? "· " + esc(r.status.toLowerCase()) : ""}</div>
      <div class="rt-flags">
        ${statusBadge(r.housekeepingStatus)}
        ${openTasks ? `<span class="badge badge-warning">${openTasks} task${openTasks > 1 ? "s" : ""}</span>` : ""}
        ${openWo ? `<span class="badge badge-danger">${openWo} fault${openWo > 1 ? "s" : ""}</span>` : ""}
      </div>
    </div>`;
  }).join("")}</div>` : `<div class="empty-state">No rooms in this state.</div>`;
}

function hkSetFilter(key) { HK_FILTER = key; hkRenderBoard(); }

function hkOpenRoom(roomId) {
  const room = (HK_BOARD.rooms || []).find((r) => r.id === roomId);
  if (!room) return;
  const tasks = room.tasks || [];
  const workOrders = room.workOrders || [];
  openDrawer(`
    <div class="drawer-head">
      <div>
        <h3>Room ${esc(room.roomNumber)}</h3>
        <p class="faint">${statusBadge(room.housekeepingStatus)} ${room.housekeepingUpdatedAt ? `· updated ${fmtDateTime(room.housekeepingUpdatedAt)}` : ""}</p>
      </div>
      <button class="btn btn-icon" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="panel">
      <h3>Set cleaning state</h3>
      <div class="row-actions" style="justify-content:flex-start;">
        ${HK_STATUSES.map((st) => `<button class="btn btn-sm ${room.housekeepingStatus === st ? "btn-primary" : "btn-outline"}" onclick="hkSetStatus('${room.id}','${st}')">${esc(st.replace(/_/g, " "))}</button>`).join("")}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head" style="padding:0 0 12px;"><h3>Tasks</h3>
        <button class="btn btn-sm btn-outline" onclick="hkNewTask('${room.id}')"><i class="fas fa-plus"></i> Add</button></div>
      ${tasks.length ? tasks.map((t) => `
        <div class="summary-line" style="align-items:center;">
          <span>${esc(t.title || t.type || "Task")} ${t.assignee && t.assignee.name ? `<span class="faint">· ${esc(t.assignee.name)}</span>` : ""}</span>
          <span style="display:flex; gap:6px; align-items:center;">
            ${statusBadge(t.status)}
            ${(HK_TASK_FLOW[t.status] || []).map((next) => `<button class="btn btn-sm btn-outline" onclick="hkAdvanceTask('${t.id}','${next}')">${esc(next.replace(/_/g, " ").toLowerCase())}</button>`).join("")}
          </span>
        </div>`).join("") : `<div class="empty-state">No tasks on this room.</div>`}
    </div>
    <div class="panel">
      <div class="panel-head" style="padding:0 0 12px;"><h3>Faults</h3>
        <button class="btn btn-sm btn-outline" onclick="mtNewWorkOrder('${room.id}')"><i class="fas fa-plus"></i> Log</button></div>
      ${workOrders.length ? workOrders.map((w) => `
        <div class="summary-line"><span>${esc(w.title || w.description || "Work order")}</span>${statusBadge(w.status)}</div>`).join("")
        : `<div class="empty-state">No open faults.</div>`}
    </div>
  `, { wide: true });
}

async function hkSetStatus(roomId, status) {
  const res = await runAction(null, () => adminApi.updateHousekeepingStatus(roomId, getActiveBranchId(), status), `Room marked ${status.replace(/_/g, " ").toLowerCase()}`);
  if (res !== null) { closeModal(); loadHousekeepingBoardPage(); }
}

async function hkAdvanceTask(taskId, status) {

}

function hkNewTask(roomId) {
  const rooms = HK_BOARD.rooms || [];
  openModal(`
    <h3>New housekeeping task</h3>
    <div class="form-field"><label>Room</label>
      <select id="hkTaskRoom">${rooms.map((r) => `<option value="${r.id}" ${r.id === roomId ? "selected" : ""}>${esc(r.roomNumber)}</option>`).join("")}</select></div>

let RATE_TYPE = null;

let RATE_TO = todayISO(29);

async function loadRatesPage() {
  render(`
    ${pageHeader("Rates & Availability", "Nightly pricing per room type. Set a range in one go, or clear it back to the base rate.", `
      <button class="btn btn-primary" onclick="rateBulkModal()"><i class="fas fa-pen"></i> Set rates</button>

        <div class="spacer"></div>
        <button class="btn btn-danger btn-sm" onclick="rateClear()">Clear this range</button>
      </div>
      <div class="cal-scroll" id="rateGrid"><div class="loading-state">Loading…</div></div>

  let types = [];

  catch (err) { renderInto("rateGrid", `<div class="notice error">${esc(err.message)}</div>`); return; }

  RATE_TYPE = RATE_TYPE && types.some((t) => t.id === RATE_TYPE) ? RATE_TYPE : types[0].id;
  document.getElementById("rateType").innerHTML = types.map((t) => `<option value="${t.id}" ${t.id === RATE_TYPE ? "selected" : ""}>${esc(t.name)}</option>`).join("");

async function rateLoad() {
  RATE_TYPE = document.getElementById("rateType").value;
  RATE_FROM = document.getElementById("rateFrom").value;
  RATE_TO = document.getElementById("rateTo").value;
  const grid = document.getElementById("rateGrid");
  grid.innerHTML = `<div class="loading-state">Loading rates…</div>`;
  let rates = [];
  try { rates = (await adminApi.getRates(RATE_TYPE, RATE_FROM, RATE_TO)).rates || []; }
  catch (err) { grid.innerHTML = `<div class="notice error">${esc(err.message)}</div>`; return; }
  if (!rates.length) { grid.innerHTML = `<div class="empty-state">No overrides in this range — the base rate applies every night.</div>`; return; }
  grid.innerHTML = `<div class="cal-grid" style="grid-template-columns: repeat(7, minmax(96px,1fr));">
    ${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="cal-cell head">${d}</div>`).join("")}
    ${rates.map((r) => `<div class="cal-cell ${r.closed || r.stopSell ? "stop" : ""}">
      <div class="cal-date">${fmtShortDate(r.date)}</div>
      <div class="cal-price">${r.price !== undefined ? fmtMoney(r.price) : fmtMoney(r.rate)}</div>
      ${r.minStay ? `<div class="faint">min ${esc(r.minStay)}n</div>` : ""}
      ${r.closed || r.stopSell ? `<div class="faint">stop sell</div>` : ""}
    </div>`).join("")}
  </div>`;
}
