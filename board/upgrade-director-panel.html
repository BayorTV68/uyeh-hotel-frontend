async function spaRefresh() {
  const [sched, resources] = await Promise.allSettled([adminApi.spaSchedule(SPA_DATE), adminApi.listSpaResources()]);

  if (sched.status === "fulfilled") {
    const appts = sched.value.appointments || [];
    document.getElementById("spaCount").textContent = `${appts.length} booked for ${fmtDate(SPA_DATE)}`;
    renderInto("spaTable", appts.length ? `
      <table><thead><tr><th>Time</th><th>Treatment</th><th>Guest</th><th>Therapist</th><th>Status</th></tr></thead>
      <tbody>${appts.map((a) => {
        const guest = (a.order && a.order.guest) || {};
        return `<tr>
          <td class="mono">${a.startsAt ? new Date(a.startsAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "—"}</td>
          <td><b>${esc((a.treatment && a.treatment.name) || "Treatment")}</b>
            <div class="faint">${a.treatment && a.treatment.durationMinutes ? esc(a.treatment.durationMinutes) + " min" : ""}</div></td>
          <td>${esc(guest.name || "—")}<div class="faint">${esc(guest.phone || "")}</div></td>
          <td>${esc((a.resource && a.resource.name) || a.therapistName || "—")}</td>
          <td>${statusBadge(a.status)}</td>
        </tr>`;
      }).join("")}</tbody></table>` : `<div class="empty-state">Nothing booked for this date.</div>`);
  } else {
    renderInto("spaTable", `<div class="notice error" style="margin:16px;">${esc(sched.reason.message)}</div>`);
  }

  if (resources.status === "fulfilled") {
    const list = resources.value.resources || [];
    renderInto("spaResources", list.length ? list.map((r) => `
      <div class="summary-line" style="align-items:center;">
        <span><b>${esc(r.name)}</b> <span class="faint">${esc(r.kind || "")}</span></span>
        <button class="btn btn-sm btn-outline" onclick="spaBlock('${r.id}')">Block time</button>
      </div>`).join("") : `<div class="empty-state">No therapists or rooms set up.</div>`);
  } else {
    renderInto("spaResources", `<div class="notice error">${esc(resources.reason.message)}</div>`);
  }
}

  `, { wide: true });
  document.getElementById("poRecvBtn").onclick = async (e) => {
    const payloadLines = Array.from(document.querySelectorAll(".po-qty")).map((input) => {

async function rpRefresh() {
  const from = document.getElementById("rpFrom").value;
  const to = document.getElementById("rpTo").value;
  const [perf, food, tax] = await Promise.allSettled([
    adminApi.reportPerformance(from, to),
    adminApi.reportFoodCost(from, to),
    adminApi.reportTax(from, to),
  ]);

  if (perf.status === "fulfilled") {
    const t = perf.value.totals || {};
    renderInto("rpPerformance", `
      <div class="stats-grid">
        <div class="stat-card"><b>${fmtPct(t.occupancyRate)}</b><span>Occupancy</span></div>
        <div class="stat-card"><b>${fmtMoney(t.adr)}</b><span>ADR</span></div>
        <div class="stat-card"><b>${fmtMoney(t.revpar)}</b><span>RevPAR</span></div>
        <div class="stat-card"><b>${fmtMoney(t.totalRevenue)}</b><span>Total revenue</span></div>
        <div class="stat-card"><b>${fmtMoney(t.roomRevenue)}</b><span>Rooms</span></div>
        <div class="stat-card"><b>${fmtMoney(t.fnbRevenue)}</b><span>Food &amp; drink</span></div>
        <div class="stat-card"><b>${fmtMoney(t.spaRevenue)}</b><span>Spa</span></div>
        <div class="stat-card"><b>${fmtNum(t.roomsSold)}</b><span>Rooms sold</span></div>
        <div class="stat-card"><b>${fmtNum(t.arrivals)}</b><span>Arrivals</span></div>
        <div class="stat-card"><b>${fmtNum(t.departures)}</b><span>Departures</span></div>
        <div class="stat-card is-warn"><b>${fmtNum(t.noShows)}</b><span>No-shows</span></div>
        <div class="stat-card is-bad"><b>${fmtNum(t.cancellations)}</b><span>Cancellations</span></div>
      </div>
      ${perf.value.note ? `<div class="notice info">${esc(perf.value.note)}</div>` : ""}
    `);
    const daily = perf.value.daily || [];
    renderInto("rpDaily", daily.length ? `
      <table><thead><tr><th>Date</th><th class="num">Sold</th><th class="num">Occ</th><th class="num">ADR</th><th class="num">RevPAR</th><th class="num">Revenue</th></tr></thead>
      <tbody>${daily.map((d) => `<tr>
        <td>${fmtShortDate(d.date)}</td>
        <td class="num">${fmtNum(d.roomsSold)}</td>
        <td class="num">${fmtPct(d.occupancyRate)}</td>
        <td class="num">${fmtMoney(d.adr)}</td>
        <td class="num">${fmtMoney(d.revpar)}</td>
        <td class="num">${fmtMoney(d.totalRevenue ?? d.roomRevenue)}</td>
      </tr>`).join("")}</tbody></table>` : `<div class="empty-state">No daily rows for this window.</div>`);
  } else {
    renderInto("rpPerformance", `<div class="panel"><div class="notice error">${esc(perf.reason.message)}</div></div>`);
    renderInto("rpDaily", "");
  }

  if (food.status === "fulfilled") {
    const f = food.value;
    const t = f.totals || {};
    renderInto("rpFoodCost", `
      <div class="summary-line"><span class="muted">Revenue</span><span class="mono">${fmtMoney(t.revenue)}</span></div>
      <div class="summary-line"><span class="muted">Cost of goods</span><span class="mono">${fmtMoney(t.cost)}</span></div>
      <div class="summary-line"><span class="muted">Gross profit</span><span class="mono">${fmtMoney(t.grossProfit)}</span></div>
      <div class="summary-line total"><span>Food cost</span><span class="mono">${fmtPct(t.foodCostPercent)}</span></div>
      <div class="meter ${Number(t.foodCostPercent) > 35 ? "bad" : "good"}" style="margin-top:10px;"><i style="width:${Math.min(100, Number(t.foodCostPercent) || 0)}%"></i></div>
      ${f.itemsWithoutRecipe ? `<p class="faint" style="margin-top:10px;">${fmtNum(f.itemsWithoutRecipe)} menu item(s) have no recipe, so their cost isn't counted.</p>` : ""}
    `);
  } else {
    renderInto("rpFoodCost", `<div class="notice error">${esc(food.reason.message)}</div>`);
  }

  if (tax.status === "fulfilled") {
    const d = tax.value;
    const rows = d.lines || d.breakdown || [];
    renderInto("rpTax", rows.length ? rows.map((r) => `
      <div class="summary-line"><span class="muted">${esc(r.label || r.name || r.taxName || "Tax")}</span><span class="mono">${fmtMoney(r.amount ?? r.total)}</span></div>`).join("")
      + `<div class="summary-line total"><span>Total</span><span class="mono">${fmtMoney(d.total ?? (d.totals && d.totals.tax))}</span></div>`
      : `<div class="summary-line total"><span>Total collected</span><span class="mono">${fmtMoney(d.total ?? (d.totals && d.totals.tax))}</span></div>`);
  } else {
    renderInto("rpTax", `<div class="notice error">${esc(tax.reason.message)}</div>`);
  }
}

async function rpExportBookings() {
  const from = document.getElementById("rpFrom").value;
  const to = document.getElementById("rpTo").value;
  const res = await runAction(null, () => adminApi.exportBookings(from, to));
  if (!res) return;
  const rows = res.rows || res.bookings || [];
  if (!rows.length) { toast("Nothing to export in this window", "error"); return; }

function perfDelta(current, prior) {
  const c = Number(current), p = Number(prior);
  if (!isFinite(c) || !isFinite(p) || !p) return `<span class="faint">—</span>`;
  const pct = ((c - p) / Math.abs(p)) * 100;
  return `<span class="stat-delta ${pct >= 0 ? "up" : "down"}">${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct).toFixed(1)}%</span>`;
}

async function perfRefresh() {
  const from = document.getElementById("perfFrom").value;
  const to = document.getElementById("perfTo").value;
  let data;
  try { data = await adminApi.companyPerformance(from, to); }
  catch (err) { renderInto("perfTable", `<div class="notice error" style="margin:16px;">${esc(err.message)}</div>`); return; }
  const cur = (data.company && data.company.current) || {};
  const prior = (data.company && data.company.priorYear) || {};
  renderInto("perfTotals", `
    <div class="stats-grid">
      <div class="stat-card"><b>${fmtPct(cur.occupancy)}</b><span>Occupancy</span>${perfDelta(cur.occupancy, prior.occupancy)}</div>
      <div class="stat-card"><b>${fmtMoney(cur.adr)}</b><span>ADR</span>${perfDelta(cur.adr, prior.adr)}</div>
      <div class="stat-card"><b>${fmtMoney(cur.revpar)}</b><span>RevPAR</span>${perfDelta(cur.revpar, prior.revpar)}</div>
      <div class="stat-card"><b>${fmtMoney(cur.revenue)}</b><span>Revenue</span>${perfDelta(cur.revenue, prior.revenue)}</div>
    </div>
  `);
  const rows = data.branches || [];
  renderInto("perfTable", rows.length ? `
    <table><thead><tr><th>Branch</th><th class="num">Occupancy</th><th class="num">ADR</th><th class="num">RevPAR</th><th class="num">Revenue</th><th class="num">vs last year</th></tr></thead>
    <tbody>${rows.map((b) => {
      const c = b.current || b;
      const p = b.prior || {};
      return `<tr>
        <td><b>${esc((b.branch && b.branch.name) || b.branch || "—")}</b></td>
        <td class="num">${fmtPct(c.occupancy ?? b.occupancy)}</td>
        <td class="num">${fmtMoney(c.adr ?? b.adr)}</td>
        <td class="num">${fmtMoney(c.revpar ?? b.revpar)}</td>
        <td class="num">${fmtMoney(c.revenue ?? b.revenue)}</td>
        <td class="num">${perfDelta(c.revenue ?? b.revenue, p.revenue)}</td>
      </tr>`;
    }).join("")}</tbody></table>` : `<div class="empty-state">No branch data for this window.</div>`);
}

function showNotice(containerId, message, type = "error") {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = `<div class="notice ${type}">${message}</div>`;
  setTimeout(() => { if (el) el.innerHTML = ""; }, 4000);
}

/* ============================================================
   LOGIN / LOGOUT / BOOT
   ============================================================ */
function showLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("appShell").style.display = "none";
}
async function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  renderSidebar();
  // Director scope must be resolved before the first page loads, otherwise
  // every branch-scoped call goes out without a branchId.
  await initBranchSwitcher();
  switchPage("dashboard");
  refreshTicketsBadgeSilently();
}
async function refreshTicketsBadgeSilently() {
  if (!hasPermission("handle_tickets")) return;
  try {
    const { tickets } = await adminApi.listTickets("OPEN");
    const badge = document.getElementById("ticketsBellBadge");
    if (badge) { badge.textContent = tickets.length; badge.style.display = tickets.length ? "flex" : "none"; }
  } catch { /* silent — this is a background badge refresh, not worth surfacing an error for */ }
}

let _pendingTempToken = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const notice = document.getElementById("loginNotice");
  notice.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Logging in…";
  try {
    const result = await adminApi.login(
      document.getElementById("loginEmail").value,
      document.getElementById("loginPassword").value
    );
    if (result.requires2FA) {
      _pendingTempToken = result.tempToken;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("twoFactorLoginForm").style.display = "block";
      document.getElementById("twoFactorCode").focus();
      return;
    }
    setSession(result.token, result.staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Log in";
  }
});

document.getElementById("twoFactorLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("twoFactorLoginBtn");
  const notice = document.getElementById("twoFactorLoginNotice");
  notice.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Verifying…";
  try {
    const { token, staff } = await adminApi.loginTwoFactor(_pendingTempToken, document.getElementById("twoFactorCode").value.trim());
    setSession(token, staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Verify";
  }
});

function cancelTwoFactorLogin() {
  _pendingTempToken = null;
  document.getElementById("twoFactorLoginForm").style.display = "none";
  document.getElementById("twoFactorLoginForm").reset();
  document.getElementById("loginForm").style.display = "block";
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  clearSession();
  showLogin();
});
document.getElementById("hamburgerBtn").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("ticketsBellBtn").addEventListener("click", () => switchPage("tickets"));
/* ============================================================
   SHELL WIRING + BOOT
   ============================================================ */
document.getElementById("refreshBtn").addEventListener("click", () => switchPage(CURRENT_PAGE));
document.getElementById("nightAuditBtn").addEventListener("click", () => switchPage("nightaudit"));

const _globalSearch = document.getElementById("globalSearch");
_globalSearch.addEventListener("focus", () => { _globalSearch.blur(); openCommandPalette(); });

const _cmdkInput = document.getElementById("cmdkInput");
_cmdkInput.addEventListener("input", (e) => renderCommandResults(e.target.value));
_cmdkInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveCommandCursor(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveCommandCursor(-1); }
  else if (e.key === "Enter") { e.preventDefault(); runCommand(_cmdkIndex); }
  else if (e.key === "Escape") closeCommandPalette();
});
document.getElementById("cmdkOverlay").addEventListener("click", (e) => {
  if (e.target.id === "cmdkOverlay") closeCommandPalette();
});

// Boot
if (getToken() && getStaff()) { showApp(); } else { showLogin(); }
</script>
