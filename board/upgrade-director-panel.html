<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Director Control Room — Oxygen Hotel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   OXYGEN HOTEL — DIRECTOR CONTROL ROOM
   Single-file SPA. Fixed graphite shell (rail + command bar),
   the work surface is swapped by switchPage(). Refreshed 2026:
   denser layout, tabular figures, sticky table heads, drawers.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Graphite + ivory + brass. Warm hotel, control-room density. */
  --ink:        #101418;
  --ink-light:  #1a2028;
  --ink-lift:   #232b35;
  --ivory:      #f4f1ea;
  --ivory-deep: #ebe6db;
  --panel:      #ffffff;
  --border:     #e2dccf;
  --border-soft: rgba(16,20,24,0.07);

  --brass:      #c39440;
  --brass-dark: #90692a;
  --brass-soft: rgba(195,148,64,0.12);
  --teal:       #2c5f5b;
  --danger:     #a3392a;
  --info:       #35618f;
  --violet:     #5a4b8a;

  --text-muted: #6d6659;
  --text-faint: #948c7d;
  --text-on-dark: #ece5d6;
  --text-on-dark-muted: rgba(236,229,214,0.55);

  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow-sm: 0 1px 2px rgba(16,20,24,0.05);
  --shadow-md: 0 8px 26px -12px rgba(16,20,24,0.28);
  --shadow-lg: 0 24px 60px -24px rgba(16,20,24,0.45);
  --rail: 264px;
}

html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  background: var(--ivory);
  color: var(--ink);
  overflow-x: hidden;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv02","cv03","cv04","tnum";
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
a { color: inherit; }
b, strong { font-weight: 700; }
::selection { background: var(--brass-soft); }

/* Scrollbars — thin, matching the shell rather than the OS */
* { scrollbar-width: thin; scrollbar-color: rgba(16,20,24,0.22) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: rgba(16,20,24,0.2); border-radius: 9px; border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* ========== LOGIN SCREEN ========== */
.login-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  background:
    radial-gradient(900px 520px at 12% -10%, rgba(195,148,64,0.16), transparent 60%),
    radial-gradient(700px 500px at 100% 110%, rgba(44,95,91,0.18), transparent 60%),
    var(--ink);
}
.login-card {
  background: var(--panel);
  padding: 44px 40px;
  border-radius: 16px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-lg);
}
.login-card .brand { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: -0.02em; margin-bottom: 4px; }
.login-card .brand span { color: var(--brass-dark); }
.login-card p.sub { color: var(--text-muted); margin-bottom: 26px; font-size: 0.86rem; }
.login-kicker {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px;
  font-size: 0.64rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--brass-dark); background: var(--brass-soft); padding: 5px 10px; border-radius: 999px;
}

/* ========== SIDE RAIL ========== */
.sidebar {
  position: fixed; left: 0; top: 0;
  height: 100vh; width: var(--rail);
  background: var(--ink);
  border-right: 1px solid rgba(236,229,214,0.07);
  padding: 18px 0 0;
  overflow-y: auto; z-index: 1000;
  transition: transform 0.24s ease;
  display: flex; flex-direction: column;
}
.sidebar::-webkit-scrollbar-thumb { background: rgba(236,229,214,0.18); }
.sidebar-header { display: flex; align-items: center; gap: 10px; padding: 0 22px 18px; }
.logo-icon {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  background: linear-gradient(145deg, var(--brass), var(--brass-dark));
  color: #1a1206; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem;
  display: flex; align-items: center; justify-content: center;
}
.logo-text { font-family: var(--font-display); font-size: 1.02rem; color: var(--text-on-dark); letter-spacing: -0.01em; }
.logo-text span { color: var(--brass); }

.admin-info {
  display: flex; align-items: center; gap: 10px;
  margin: 0 14px 14px; padding: 11px 12px;
  background: rgba(236,229,214,0.045); border: 1px solid rgba(236,229,214,0.07);
  border-radius: 11px;
}
.admin-avatar {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  background: rgba(195,148,64,0.18); color: var(--brass);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}
.admin-details { min-width: 0; }
.admin-name { color: var(--text-on-dark); font-size: 0.84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-role { color: var(--brass); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.admin-branch { color: var(--text-on-dark-muted); font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nav-menu { padding: 0 10px 6px; flex: 1; }
.nav-divider { height: 1px; background: rgba(236,229,214,0.07); margin: 10px 12px; }
.nav-section-label {
  padding: 12px 12px 6px; font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; color: rgba(236,229,214,0.32);
}

.nav-item-standalone, .nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; margin-bottom: 2px; border-radius: 8px;
  color: var(--text-on-dark-muted); font-size: 0.845rem; cursor: pointer;
  transition: background 0.14s, color 0.14s;
  position: relative;
}
.nav-item { font-size: 0.82rem; padding-left: 24px; }
.nav-item-standalone:hover, .nav-item:hover { background: rgba(236,229,214,0.05); color: var(--text-on-dark); }
.nav-item-standalone.active, .nav-item.active { background: rgba(195,148,64,0.14); color: #f2ddb4; }
.nav-item-standalone.active::before, .nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 17px; border-radius: 0 3px 3px 0; background: var(--brass);
}
.nav-item-standalone i, .nav-item i { width: 17px; text-align: center; font-size: 0.82rem; opacity: 0.95; }

.nav-group { margin-bottom: 2px; }
.nav-group-header {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px;
  color: rgba(236,229,214,0.68); font-size: 0.76rem; font-weight: 600; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.07em;
}
.nav-group-header:hover { background: rgba(236,229,214,0.04); color: var(--text-on-dark); }
.nav-group-header .group-icon { width: 17px; text-align: center; font-size: 0.8rem; color: var(--brass); opacity: 0.85; }
.nav-group-header .group-label { flex: 1; }
.group-chevron { font-size: 0.62rem; transition: transform 0.2s; opacity: 0.6; }
.nav-group.open .group-chevron { transform: rotate(180deg); }
.nav-group-body { display: none; padding: 2px 0 6px; }
.nav-group.open .nav-group-body { display: block; }
.nav-group-header .group-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--danger); display: none;
}
.nav-group-header .group-dot.visible { display: block; }

.nav-badge {
  margin-left: auto; background: rgba(163,57,42,0.3); color: #f0a496;
  padding: 1px 7px; border-radius: 9px; font-size: 0.64rem; font-weight: 700; display: none;
  font-family: var(--font-mono);
}
.nav-badge.visible { display: inline-block; }

.sidebar-footer { padding: 12px 22px 18px; border-top: 1px solid rgba(236,229,214,0.07); }
.logout-link { color: var(--text-on-dark-muted); font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.logout-link:hover { color: #f0b8ae; }

/* ========== MAIN + COMMAND BAR ========== */
.main-content { margin-left: var(--rail); min-height: 100vh; }

.topbar {
  background: rgba(244,241,234,0.88);
  backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 11px 28px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 500; gap: 14px;
}
.hamburger-btn { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
.hamburger-btn span { width: 20px; height: 2px; background: var(--ink); border-radius: 2px; }

.search-bar { flex: 1; max-width: 460px; position: relative; }
.search-bar input {
  width: 100%; padding: 9px 60px 9px 36px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 9px; font-size: 0.85rem; font-family: var(--font-body);
  color: var(--ink);
}
.search-bar input::placeholder { color: var(--text-faint); }
.search-bar input:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px var(--brass-soft); }
.search-bar > i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 0.8rem; }
.search-kbd {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 0.64rem; color: var(--text-faint);
  border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; background: var(--ivory);
}

.topbar-actions { display: flex; align-items: center; gap: 9px; }
.branch-switch {
  display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
  font-size: 0.8rem; color: var(--ink); max-width: 230px;
}
.branch-switch i { color: var(--brass-dark); font-size: 0.78rem; }
.branch-switch select {
  border: none; background: none; font-family: var(--font-body); font-size: 0.8rem;
  font-weight: 600; color: var(--ink); outline: none; max-width: 175px; cursor: pointer;
}
.topbar-btn {
  width: 36px; height: 36px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--ink);
  font-size: 0.85rem; transition: border-color 0.15s, background 0.15s;
}
.topbar-btn:hover { border-color: var(--brass); background: #fff; }
.topbar-badge {
  position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff;
  min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; font-size: 0.62rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; font-family: var(--font-mono);
  border: 2px solid var(--ivory);
}

.content-area { padding: 26px 28px 72px; max-width: 1560px; }

/* ========== PAGE HEADER ========== */
.page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.page-title { font-size: 1.5rem; letter-spacing: -0.02em; }
.page-subtitle { color: var(--text-muted); margin-top: 3px; font-size: 0.85rem; max-width: 70ch; }
.page-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ========== STATS / KPI ========== */
.stats-grid, .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(172px,1fr)); gap: 12px; margin-bottom: 22px; }
.stat-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.stat-card::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brass); opacity: 0.55; }
.stat-card b, .stat-card .stat-value {
  display: block; font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 2px;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
}
.stat-card span, .stat-card .stat-label { color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
.stat-card.is-good::after { background: var(--teal); }
.stat-card.is-warn::after { background: var(--brass); }
.stat-card.is-bad::after { background: var(--danger); }
.stat-delta { font-size: 0.72rem; font-weight: 700; font-family: var(--font-mono); margin-top: 5px; display: inline-block; }
.stat-delta.up { color: var(--teal); }
.stat-delta.down { color: var(--danger); }

/* ========== PANELS / TABLES ========== */
.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
}
.panel.flush { padding: 0; overflow: hidden; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 1px solid var(--border);
}
.panel-head h3 { margin: 0; }
.panel h3 { font-size: 0.98rem; margin-bottom: 12px; }
.panel-hint { font-size: 0.78rem; color: var(--text-muted); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; font-size: 0.83rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
th {
  color: var(--text-muted); font-weight: 700; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.09em;
  background: var(--ivory); position: sticky; top: 0; z-index: 2; white-space: nowrap;
}
.panel.flush th { border-top: none; }
tbody tr:hover { background: rgba(195,148,64,0.045); }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.79rem; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.mono { font-family: var(--font-mono); font-size: 0.79rem; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); font-size: 0.78rem; }
.total { font-weight: 700; }
.summary-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; border-bottom: 1px dashed var(--border); }
.summary-line:last-child { border-bottom: none; }
.truncate { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ========== BADGES ========== */
.badge {
  display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
  background: rgba(16,20,24,0.06); color: var(--text-muted);
}
.badge-pending, .badge-open, .badge-in_progress, .badge-draft, .badge-scheduled, .badge-awaiting_inspection, .badge-assigned, .badge-partial, .badge-submitted, .badge-processing { background: var(--brass-soft); color: var(--brass-dark); }
.badge-confirmed, .badge-active, .badge-resolved, .badge-successful, .badge-success, .badge-paid, .badge-clean, .badge-completed, .badge-approved, .badge-published, .badge-issued, .badge-sent, .badge-received, .badge-settled { background: rgba(44,95,91,0.12); color: var(--teal); }
.badge-cancelled, .badge-inactive, .badge-failed, .badge-rejected, .badge-dirty, .badge-overdue, .badge-void, .badge-voided, .badge-blocked, .badge-absent, .badge-no_show, .badge-danger { background: rgba(163,57,42,0.1); color: var(--danger); }
.badge-checked_in { background: rgba(53,97,143,0.12); color: var(--info); }
.badge-checked_out, .badge-closed, .badge-muted, .badge-out_of_order, .badge-disposed { background: rgba(16,20,24,0.07); color: var(--ink); }
.badge-cleaning, .badge-warning, .badge-high, .badge-urgent { background: rgba(195,148,64,0.18); color: var(--brass-dark); }
.badge-inspected, .badge-info, .badge-credit_note { background: rgba(53,97,143,0.12); color: var(--info); }
.badge-occupied { background: rgba(90,75,138,0.12); color: var(--violet); }
.badge-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel); font-size: 0.76rem; font-weight: 600;
  color: var(--text-muted); cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--brass); color: var(--ink); }
.chip.active { background: var(--ink); border-color: var(--ink); color: var(--text-on-dark); }
.chip-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }

.offering-photo { width: 44px; height: 44px; border-radius: 7px; overflow: hidden; cursor: pointer; background: var(--ivory-deep); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; transition: border-color 0.2s; }
.offering-photo:hover { border-color: var(--brass); }
.offering-photo img { width: 100%; height: 100%; object-fit: cover; }
.offering-photo-placeholder { color: var(--text-faint); font-size: 0.9rem; }

/* ========== TABS ========== */
.tabs { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab-btn {
  background: none; border: none; padding: 9px 14px; font-family: var(--font-body); font-size: 0.84rem;
  font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--ink); border-bottom-color: var(--brass); }

/* ========== BUTTONS / FORMS ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; border-radius: 9px; font-size: 0.83rem; font-weight: 600; cursor: pointer;
  border: 1px solid transparent; transition: all 0.15s; font-family: var(--font-body); line-height: 1.2;
}
.btn-primary { background: var(--ink); color: var(--text-on-dark); }
.btn-primary:hover { background: var(--ink-lift); }
.btn-brass { background: linear-gradient(140deg, var(--brass), var(--brass-dark)); color: #1c1305; }
.btn-brass:hover { filter: brightness(1.06); }
.btn-outline { border-color: var(--border); color: var(--ink); background: var(--panel); }
.btn-outline:hover { border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { background: rgba(16,20,24,0.05); color: var(--ink); }
.btn-danger { background: rgba(163,57,42,0.09); color: var(--danger); border-color: rgba(163,57,42,0.18); }
.btn-danger:hover { background: rgba(163,57,42,0.16); }
.btn-sm { padding: 5px 11px; font-size: 0.76rem; border-radius: 7px; }
.btn-icon { width: 30px; height: 30px; padding: 0; border-radius: 7px; border-color: var(--border); background: var(--panel); color: var(--text-muted); }
.btn-icon:hover { color: var(--ink); border-color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-block { width: 100%; }

.form-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.form-field label { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; }
.form-field input, .form-field select, .form-field textarea, .filter-row input, .filter-row select {
  padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
  font-family: var(--font-body); font-size: 0.85rem; color: var(--ink);
}
.form-field textarea { min-height: 84px; resize: vertical; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus,
.filter-row input:focus, .filter-row select:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px var(--brass-soft); }
.form-field .hint { font-size: 0.73rem; color: var(--text-faint); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.83rem; }
.filter-row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filter-row label { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; }
.spacer { flex: 1; }

.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--border); border-radius: 999px; cursor: pointer; transition: 0.2s; }
.switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
.switch input:checked + span { background: var(--teal); }
.switch input:checked + span::before { transform: translateX(18px); }

/* ========== GRID HELPERS ========== */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.split { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr); gap: 16px; align-items: start; }

/* ========== HOUSEKEEPING BOARD ========== */
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.room-tile {
  border: 1px solid var(--border); border-radius: 9px; padding: 11px; background: var(--panel);
  cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; position: relative;
}
.room-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.room-tile .rt-num { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; }
.room-tile .rt-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
.room-tile .rt-flags { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.room-tile.hk-CLEAN { border-left: 4px solid var(--teal); }
.room-tile.hk-DIRTY { border-left: 4px solid var(--danger); }
.room-tile.hk-CLEANING { border-left: 4px solid var(--brass); }
.room-tile.hk-INSPECTED { border-left: 4px solid var(--info); }
.room-tile.hk-OCCUPIED { border-left: 4px solid var(--violet); }
.room-tile.hk-OUT_OF_ORDER { border-left: 4px solid var(--ink); background: repeating-linear-gradient(135deg, #fff, #fff 8px, #f6f3ec 8px, #f6f3ec 16px); }

/* ========== CALENDAR / RATE GRID ========== */
.cal-scroll { overflow-x: auto; }
.cal-grid { display: grid; gap: 4px; min-width: max-content; }
.cal-cell {
  border: 1px solid var(--border); border-radius: 7px; padding: 7px 8px; min-width: 84px;
  font-size: 0.74rem; background: var(--panel);
}
.cal-cell.head { background: var(--ivory); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-size: 0.64rem; }
.cal-cell.stop { background: rgba(163,57,42,0.07); border-color: rgba(163,57,42,0.25); }
.cal-cell .cal-date { color: var(--text-faint); font-size: 0.66rem; }
.cal-cell .cal-price { font-family: var(--font-mono); font-weight: 600; font-size: 0.82rem; }

/* ========== TIMELINE / FEED ========== */
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding: 0 0 14px; }
.timeline-item::before { content: ""; position: absolute; left: -18px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--brass); border: 2px solid var(--panel); }
.timeline-time { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-faint); }

.meter { height: 7px; border-radius: 999px; background: var(--ivory-deep); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--brass); border-radius: 999px; }
.meter.good > i { background: var(--teal); }
.meter.bad > i { background: var(--danger); }

/* ========== NOTICES / STATES ========== */
.notice { padding: 11px 14px; border-radius: 9px; font-size: 0.83rem; margin-bottom: 16px; border: 1px solid transparent; }
.notice.success { background: rgba(44,95,91,0.09); color: var(--teal); border-color: rgba(44,95,91,0.2); }
.notice.error { background: rgba(163,57,42,0.07); color: var(--danger); border-color: rgba(163,57,42,0.2); }
.notice.info { background: rgba(53,97,143,0.07); color: var(--info); border-color: rgba(53,97,143,0.2); }
.notice.warning { background: var(--brass-soft); color: var(--brass-dark); border-color: rgba(195,148,64,0.3); }

.empty-state, .loading-state { padding: 34px; text-align: center; color: var(--text-muted); font-size: 0.87rem; }
.loading-state::after { content: ""; display: block; width: 18px; height: 18px; margin: 12px auto 0; border: 2px solid var(--border); border-top-color: var(--brass); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton { background: linear-gradient(90deg, var(--ivory-deep), #fff, var(--ivory-deep)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; height: 12px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ========== MODAL / DRAWER ========== */
.modal-overlay { position: fixed; inset: 0; background: rgba(16,20,24,0.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.modal { background: var(--panel); border-radius: 14px; padding: 26px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal.wide { max-width: 780px; }
.modal.xwide { max-width: 1020px; }
.modal h3 { margin-bottom: 16px; font-size: 1.08rem; }
.modal-actions { display: flex; gap: 9px; margin-top: 18px; flex-wrap: wrap; }
.modal-actions .spacer { flex: 1; }

.drawer-overlay { position: fixed; inset: 0; background: rgba(16,20,24,0.45); z-index: 2000; display: flex; justify-content: flex-end; }
.drawer { background: var(--panel); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 24px; box-shadow: var(--shadow-lg); animation: slideIn 0.2s ease; }
.drawer.wide { width: min(860px, 100%); }
@keyframes slideIn { from { transform: translateX(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }

.coming-soon { padding: 54px 20px; text-align: center; color: var(--text-muted); }
.coming-soon i { font-size: 1.8rem; color: var(--brass); margin-bottom: 12px; display: block; }

/* ========== COMMAND PALETTE ========== */
.cmdk-overlay { position: fixed; inset: 0; background: rgba(16,20,24,0.5); backdrop-filter: blur(4px); z-index: 3000; display: none; padding-top: 12vh; justify-content: center; }
.cmdk-overlay.open { display: flex; }
.cmdk { background: var(--panel); width: min(600px, 92vw); height: max-content; max-height: 66vh; border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; }
.cmdk input { border: none; border-bottom: 1px solid var(--border); padding: 16px 18px; font-size: 0.95rem; font-family: var(--font-body); outline: none; }
.cmdk-list { overflow-y: auto; padding: 6px; }
.cmdk-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.86rem; }
.cmdk-item i { width: 18px; text-align: center; color: var(--brass-dark); font-size: 0.8rem; }
.cmdk-item small { margin-left: auto; color: var(--text-faint); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; }
.cmdk-item.active, .cmdk-item:hover { background: var(--ivory); }

/* ========== TOASTS ========== */
.toast-stack { position: fixed; right: 18px; bottom: 18px; z-index: 4000; display: flex; flex-direction: column; gap: 9px; }
.toast {
  background: var(--ink); color: var(--text-on-dark); padding: 11px 15px; border-radius: 10px;
  font-size: 0.83rem; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 9px;
  max-width: 380px; animation: slideIn 0.18s ease;
}
.toast i { color: var(--brass); }
.toast.error i { color: #f0a496; }
.toast.success i { color: #86c2ac; }

/* ── Site Settings page ─────────────────────────────────────────── */
.ss-maint-card {
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  padding: 16px 20px; margin-bottom: 18px; border-radius: 11px;
  background: rgba(163,57,42,0.05); border: 1px solid rgba(163,57,42,0.2);
}
.ss-maint-card.is-off { background: rgba(16,20,24,0.03); border-color: var(--border); }
.ss-maint-card-title { font-weight: 700; font-size: 0.9rem; color: var(--danger); margin-bottom: 3px; }
.ss-maint-card.is-off .ss-maint-card-title { color: var(--text-muted); }
.ss-maint-card-status { font-size: 0.78rem; color: var(--text-muted); }

.ss-toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 11px 14px; border-radius: 9px; margin-bottom: 7px;
  background: rgba(16,20,24,0.02); border: 1px solid var(--border-soft);
}
.ss-toggle-label { font-weight: 600; font-size: 0.85rem; }
.ss-toggle-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

.ss-banner-preview { border-radius: 9px; padding: 11px 15px; margin-top: 12px; font-size: 0.84rem; font-weight: 500; display: none; align-items: center; justify-content: space-between; gap: 10px; }
.ss-banner-preview.show { display: flex; }
.ss-banner-preview.info { background: #eaf3f8; border: 1px solid #35618f; color: #0c4a6e; }
.ss-banner-preview.success { background: #eaf7ef; border: 1px solid var(--teal); color: #1a3d3a; }
.ss-banner-preview.warning { background: #fbf3e4; border: 1px solid var(--brass); color: #6b4e1a; }
.ss-banner-preview.urgent { background: #fbeae7; border: 1px solid var(--danger); color: #7a2419; }

.ss-danger-zone { border: 1px solid rgba(163,57,42,0.25); border-radius: 11px; padding: 16px 18px; margin-top: 20px; background: rgba(163,57,42,0.02); }
.ss-danger-zone-hd { font-size: 0.7rem; font-weight: 700; color: var(--danger); letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 11px; }

#siteSettingsSaveBar {
  position: sticky; bottom: 0; z-index: 20; display: none; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; padding: 13px 18px; margin-top: 18px;
  background: var(--ink); border-radius: 11px; box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
}
#siteSettingsSaveBar.show { display: flex; }
.ss-unsaved-badge { display: flex; align-items: center; gap: 8px; font-size: 0.81rem; color: var(--text-on-dark); font-weight: 600; }
.ss-unsaved-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brass); animation: ssPulse 1.5s ease infinite; }
@keyframes ssPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

@media (max-width: 1100px) {
  .split { grid-template-columns: 1fr; }
  .form-row-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .hamburger-btn { display: flex; }
  .search-bar { display: none; }
  .content-area { padding: 18px 14px 60px; }
  .topbar { padding: 10px 14px; }
  .branch-switch { max-width: 150px; }
  .branch-switch select { max-width: 100px; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ============================================================
     LOGIN SCREEN
     ============================================================ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-kicker"><i class="fas fa-shield-halved"></i> Restricted access</div>
    <div class="brand">Oxygen <span>Hotel</span></div>
    <p class="sub">Director &amp; management control room</p>
    <div id="loginNotice"></div>
    <form id="loginForm">
      <div class="form-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;" id="loginBtn">Log in</button>
    </form>

    <form id="twoFactorLoginForm" style="display:none;">
      <p class="sub" style="margin-top:0;">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div id="twoFactorLoginNotice"></div>
      <div class="form-field">
        <label for="twoFactorCode">Code</label>
        <input type="text" id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;" id="twoFactorLoginBtn">Verify</button>
      <button type="button" class="btn btn-outline btn-block" style="margin-top:8px;" onclick="cancelTwoFactorLogin()">Back to login</button>
    </form>
  </div>
</div>

<!-- ============================================================
     APP SHELL (hidden until logged in)
     ============================================================ -->
<div id="appShell" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">O</div>
      <div class="logo-text">Oxygen <span>Hotel</span></div>
    </div>

    <div class="admin-info">
      <div class="admin-avatar" id="adminAvatar">–</div>
      <div class="admin-details">
        <div class="admin-name" id="adminName">–</div>
        <div class="admin-role" id="adminRole">–</div>
        <div class="admin-branch" id="adminBranch"></div>
      </div>
    </div>

    <nav class="nav-menu" id="navMenu"><!-- rendered by renderSidebar() --></nav>

    <div class="sidebar-footer">
      <div class="logout-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Log out</div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button class="hamburger-btn" id="hamburgerBtn"><span></span><span></span><span></span></button>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search guests, bookings, pages…" id="globalSearch" autocomplete="off">
        <span class="search-kbd">⌘K</span>
      </div>
      <div class="topbar-actions">
        <div class="branch-switch" id="branchSwitchWrap" style="display:none;">
          <i class="fas fa-location-dot"></i>
          <select id="branchSwitch" title="Active branch scope"></select>
        </div>
        <div class="topbar-btn" id="nightAuditBtn" title="Night audit"><i class="fas fa-moon"></i></div>
        <div class="topbar-btn" id="refreshBtn" title="Reload this page"><i class="fas fa-rotate"></i></div>
        <div class="topbar-btn" id="ticketsBellBtn" title="Open guest tickets">
          <i class="fas fa-bell"></i>
          <span class="topbar-badge" id="ticketsBellBadge" style="display:none;">0</span>
        </div>
      </div>
    </div>

    <div class="content-area" id="pageContent">
      <div class="loading-state">Loading…</div>
    </div>
  </main>
</div>

<!-- Command palette -->
<div class="cmdk-overlay" id="cmdkOverlay">
  <div class="cmdk">
    <input type="text" id="cmdkInput" placeholder="Jump to a page or search guests…" autocomplete="off">
    <div class="cmdk-list" id="cmdkList"></div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-stack" id="toastStack"></div>

<!-- Modal / drawer mount points -->
<div id="modalMount"></div>

<script>
const API_BASE = "https://uyeh-hotel-backend.onrender.com/api";

function getToken() { return localStorage.getItem("director_token"); }
function getStaff() {
  try { return JSON.parse(localStorage.getItem("director_info") || "null"); }
  catch { return null; }
}
function setSession(token, staff) {
  localStorage.setItem("director_token", token);
  localStorage.setItem("director_info", JSON.stringify(staff));
}
function clearSession() {
  localStorage.removeItem("director_token");
  localStorage.removeItem("director_info");
}
function isDirector() {
  const staff = getStaff();
  return !!staff && staff.type === "director";
}
function hasPermission(key) {
  const staff = getStaff();
  if (!staff) return false;
  if (staff.type === "director") return true;
  return (staff.permissions || []).includes(key);
}
function branchPath(path) {
  // Manager/Staff: branch comes from the JWT server-side, nothing to add.
  // Director: no branchId on their account — the caller must supply one
  // explicitly (see the branch-scoped methods below, which append
  // ?branchId= themselves rather than relying on this helper for writes).
  return `/manager${path}`;
}

async function adminRequest(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${getToken()}`,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    clearSession();
    showLogin();
    throw new Error("Session expired");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

async function adminUpload(path, file) {
  const form = new FormData();
  form.append("image", file);
  const res = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: { Authorization: `Bearer ${getToken()}` },
    body: form,
  });
  if (res.status === 401) {
    clearSession();
    showLogin();
    throw new Error("Session expired");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
  return data;
}

// Same shape as adminUpload, but the field name matches what
// uploadVideo.single("video") on the backend actually expects — reusing
// adminUpload here would silently send a video under a field named
// "image", which the video route was never told to look for.
async function adminUploadVideo(path, file) {
  const form = new FormData();
  form.append("video", file);
  const res = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: { Authorization: `Bearer ${getToken()}` },
    body: form,
  });
  if (res.status === 401) {
    clearSession();
    showLogin();
    throw new Error("Session expired");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
  return data;
}

const adminApi = {
  getMe: () => adminRequest("/admin/me"),
  updateMe: (payload) => adminRequest("/admin/me", { method: "PATCH", body: JSON.stringify(payload) }),
  changePassword: (payload) => adminRequest("/admin/me/password", { method: "PATCH", body: JSON.stringify(payload) }),
  setupTwoFactor: () => adminRequest("/auth/2fa/setup", { method: "POST" }),
  enableTwoFactor: (code) => adminRequest("/auth/2fa/enable", { method: "POST", body: JSON.stringify({ code }) }),
  disableTwoFactor: (password) => adminRequest("/auth/2fa/disable", { method: "POST", body: JSON.stringify({ password }) }),
  // Director only — Manager and Staff have their own dedicated panels now
  // (manager-panel.html, staff-panel.html). This panel intentionally never
  // attempts those login endpoints.
  login: async (email, password) => {
    const res = await fetch(`${API_BASE}/auth/director/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    // 2FA-enabled accounts get a tempToken instead of real tokens here —
    // the caller must finish the challenge via loginTwoFactor() below
    // before a session exists. Returning this instead of assuming every
    // 200 is a finished login is the fix — the old code silently stored
    // `undefined` as the session in this case.
    if (data.requires2FA) return { requires2FA: true, tempToken: data.tempToken };
    // data.director.type is now set by the backend itself (serializeAccount) —
    // no client-side guessing needed.
    return {
      token: data.token,
      refreshToken: data.refreshToken,
      staff: data.director,
    };
  },
  loginTwoFactor: async (tempToken, code) => {
    const res = await fetch(`${API_BASE}/auth/login/2fa`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tempToken, code }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Invalid code");
    return { token: data.token, refreshToken: data.refreshToken, staff: data.director };
  },

  // Branch-level settings (a branch's own operational settings)
  // Branch operational settings — address/city/state/phone/email/services.
  // Always branch-scoped; a Director must pass one explicitly since
  // there's no "all branches" concept for this.
  getSettings: (branchId) => adminRequest(`/manager/branch-settings?branchId=${branchId}`),
  updateSettings: (branchId, payload) => adminRequest(`/manager/branch-settings?branchId=${branchId}`, { method: "PATCH", body: JSON.stringify(payload) }),

  // Branches — Director only
  listBranches: () => adminRequest("/director/branches"),
  listBugSignals: (resolved) => adminRequest(`/director/bug-signals${resolved ? "?resolved=true" : ""}`),
  getBugSignalTimeline: (id) => adminRequest(`/director/bug-signals/${id}/timeline`),
  resolveBugSignal: (id) => adminRequest(`/director/bug-signals/${id}/resolve`, { method: "PATCH" }),
  createBranch: (payload) => adminRequest("/director/branches", { method: "POST", body: JSON.stringify(payload) }),
  updateBranch: (id, payload) => adminRequest(`/director/branches/${id}`, { method: "PATCH", body: JSON.stringify(payload) }),

  // Payout accounts — Director only, per branch
  listPaystackBanks: () => adminRequest("/director/paystack/banks"),
  verifyPayoutAccount: (payload) => adminRequest("/director/paystack/verify-account", { method: "POST", body: JSON.stringify(payload) }),
  setBranchPayoutAccount: (branchId, payload) => adminRequest(`/director/branches/${branchId}/payout-account`, { method: "POST", body: JSON.stringify(payload) }),
  // Stripe Connect — same "how does this branch get paid" concept as the
  // Paystack payout account above, but a separate provider entirely:
  // onboarding happens on Stripe's own hosted page, not a form here.
  // This UI didn't exist at all before — the backend routes were built
  // and never wired to anything.
  connectStripeAccount: (branchId, payload) => adminRequest(`/director/branches/${branchId}/stripe-account`, { method: "POST", body: JSON.stringify(payload) }),
  getStripeAccountStatus: (branchId) => adminRequest(`/director/branches/${branchId}/stripe-account/status`),

  // Company-wide rollup — Director dashboard
  getCompanyOverview: () => adminRequest("/director/company/overview"),

  // Rooms — full structural CRUD is Director-only, so these hit
  // /director/rooms directly (NOT branchPath's /manager prefix). A
  // branchId is required for every write; GET without one returns rooms
  // across every branch, which the Rooms page below uses a branch
  // selector to avoid.
  listRooms: (branchId) => adminRequest(`/director/rooms${branchId ? `?branchId=${branchId}` : ""}`),
  createRoom: (branchId, payload) => adminRequest("/director/rooms", { method: "POST", body: JSON.stringify({ ...payload, branchId }) }),
  updateRoom: (id, branchId, payload) => adminRequest(`/director/rooms/${id}`, { method: "PATCH", body: JSON.stringify({ ...payload, branchId }) }),

// Opens a fetched (authenticated) invoice in a new tab. Use this instead of

async function viewInvoice(transactionId) {
  try {

/* ============================================================
   BRANCH SCOPE + EXTENDED API
   ------------------------------------------------------------
   A director's JWT carries no branchId, so every /manager route
   needs ?branchId= appended explicitly. We keep one "active
   branch" in localStorage and redefine branchPath() so that all
   the pre-existing branch-scoped calls above pick it up too.
   Managers/staff get their branch from the token — we never send
   branchId for them (the server would reject a mismatch).
   ============================================================ */

const ACTIVE_BRANCH_KEY = "director_active_branch";
let BRANCHES = [];

function getActiveBranchId() {
  const staff = getStaff();
  if (!staff) return null;
  if (staff.type !== "director") return staff.branchId || null;
  return localStorage.getItem(ACTIVE_BRANCH_KEY) || null;
}
function setActiveBranchId(id) {
  if (id) localStorage.setItem(ACTIVE_BRANCH_KEY, id);
  else localStorage.removeItem(ACTIVE_BRANCH_KEY);
}
function getActiveBranch() {
  const id = getActiveBranchId();
  return BRANCHES.find((b) => b.id === id) || null;
}
function requireBranch() {
  const id = getActiveBranchId();
  if (!id) throw new Error("Pick a branch in the top bar first — this view is branch-scoped.");
  return id;
}

// Redefines the earlier helper (later declaration wins) so legacy
// pages become branch-aware without touching each call site.
function branchPath(path) {
  const staff = getStaff();
  const bid = staff && staff.type === "director" ? getActiveBranchId() : null;
  if (!bid) return `/manager${path}`;
  const sep = path.includes("?") ? "&" : "?";
  return `/manager${path}${sep}branchId=${bid}`;
}

function qs(params = {}) {
  const clean = {};
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") clean[k] = v;
  });
  const s = new URLSearchParams(clean).toString();
  return s ? `?${s}` : "";
}
// Branch-scoped query string for director calls.
function bqs(params = {}) {
  const staff = getStaff();
  const bid = staff && staff.type === "director" ? getActiveBranchId() : null;
  return qs({ ...params, ...(bid ? { branchId: bid } : {}) });
}
function bbody(payload = {}) {
  const staff = getStaff();
  const bid = staff && staff.type === "director" ? getActiveBranchId() : null;
  return JSON.stringify(bid ? { ...payload, branchId: bid } : payload);
}
const POST = (path, payload) => adminRequest(path, { method: "POST", body: bbody(payload) });
const PATCH = (path, payload) => adminRequest(path, { method: "PATCH", body: bbody(payload) });

/* ============================================================
   SHARED UI HELPERS
   ============================================================ */
function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtMoney(n, currency = "NGN") {
  const num = Number(n);
  if (!isFinite(num)) return "—";
  try {
    return new Intl.NumberFormat("en-NG", { style: "currency", currency, maximumFractionDigits: 0 }).format(num);
  } catch { return `${currency} ${num.toLocaleString()}`; }
}
function fmtNum(n, digits = 0) {
  const num = Number(n);
  if (!isFinite(num)) return "—";
  return num.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function fmtPct(n, digits = 1) {
  const num = Number(n);
  if (!isFinite(num)) return "—";
  return `${(num <= 1 && num > 0 ? num * 100 : num).toFixed(digits)}%`;
}
function fmtDate(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}
function fmtShortDate(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { day: "2-digit", month: "short" });
}
function fmtDateTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? "—" : d.toLocaleString(undefined, { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function todayISO(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}
function statusBadge(status) {
  if (!status) return `<span class="badge badge-muted">—</span>`;
  const key = String(status).toLowerCase().replace(/[\s-]/g, "_");
  return `<span class="badge badge-${esc(key)}">${esc(String(status).replace(/_/g, " "))}</span>`;
}
function boolBadge(v, yes = "Active", no = "Inactive") {
  return v ? `<span class="badge badge-active">${yes}</span>` : `<span class="badge badge-inactive">${no}</span>`;
}
function emptyRow(cols, text = "Nothing here yet.") {
  return `<tr><td colspan="${cols}"><div class="empty-state">${esc(text)}</div></td></tr>`;
}
function errorPanel(err) {
  return `<div class="panel"><div class="notice error">${esc(err && err.message ? err.message : String(err))}</div></div>`;
}

/* Toasts — non-blocking confirmation for writes. */
function toast(message, type = "success") {
  const stack = document.getElementById("toastStack");
  if (!stack) return;
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icon = type === "error" ? "fa-triangle-exclamation" : type === "info" ? "fa-circle-info" : "fa-circle-check";
  el.innerHTML = `<i class="fas ${icon}"></i><span>${esc(message)}</span>`;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* Modals & drawers all mount into #modalMount so nothing leaks. */
function openModal(html, { wide = false, xwide = false } = {}) {
  const mount = document.getElementById("modalMount");
  mount.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal ${xwide ? "xwide" : wide ? "wide" : ""}">${html}</div></div>`;
}
function openDrawer(html, { wide = false } = {}) {
  const mount = document.getElementById("modalMount");
  mount.innerHTML = `<div class="drawer-overlay" onclick="if(event.target===this)closeModal()">
    <div class="drawer ${wide ? "wide" : ""}">${html}</div></div>`;
}
function closeModal() { document.getElementById("modalMount").innerHTML = ""; }
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCommandPalette(); }
});

function confirmAction(message, onConfirm, { danger = true, confirmLabel = "Confirm" } = {}) {
  openModal(`
    <h3>${esc(message)}</h3>
    <p class="muted" style="font-size:0.84rem;">This action is recorded in the audit log.</p>
    <div class="modal-actions">
      <button class="btn ${danger ? "btn-danger" : "btn-primary"}" id="confirmActionBtn">${esc(confirmLabel)}</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  `);
  document.getElementById("confirmActionBtn").onclick = async () => {
    closeModal();
    await onConfirm();
  };
}

/* Wraps a write so every button gives feedback and errors surface. */
async function runAction(btn, fn, successMessage) {
  const el = typeof btn === "string" ? document.getElementById(btn) : btn;
  const label = el ? el.innerHTML : null;
  if (el) { el.disabled = true; el.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Working…`; }
  try {
    const result = await fn();
    if (successMessage) toast(successMessage);
    return result;
  } catch (err) {
    toast(err.message || "Something went wrong", "error");
    return null;
  } finally {
    if (el) { el.disabled = false; el.innerHTML = label; }
  }
}

function downloadCsv(filename, rows) {
  const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

   failures never leave a permanent "Loading…". */

function renderInto(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }

async function loadPage(builder) {

  catch (err) { render(errorPanel(err)); }
}

async function initBranchSwitcher() {

  if (!isDirector()) { wrap.style.display = "none"; return; }
  wrap.style.display = "flex";
  try {
    const data = await adminApi.listBranches();
    BRANCHES = data.branches || data || [];
  } catch { BRANCHES = []; }
  if (!BRANCHES.length) { select.innerHTML = `<option value="">No branches</option>`; return; }
  const current = getActiveBranchId();
  if (!current || !BRANCHES.some((b) => b.id === current)) setActiveBranchId(BRANCHES[0].id);
  select.innerHTML = BRANCHES.map((b) => `<option value="${esc(b.id)}" ${b.id === getActiveBranchId() ? "selected" : ""}>${esc(b.name)}</option>`).join("");
  select.onchange = () => {
    setActiveBranchId(select.value);
    const branch = getActiveBranch();
    toast(`Scope switched to ${branch ? branch.name : "branch"}`, "info");
    switchPage(CURRENT_PAGE);
  };
}

  const container = document.getElementById("pageContent");
  if (!loader) { container.innerHTML = `<div class="empty-state">Unknown page.</div>`; return; }

  try {

    if (out && typeof out.catch === "function") out.catch((err) => { container.innerHTML = errorPanel(err); });

function commandItems() {
  const staff = getStaff();
  if (!staff) return [];
  const director = staff.type === "director";
  const items = [{ page: "dashboard", label: "Control Room", icon: "fa-gauge-high", group: "Overview" }];

  if (director) items.push({ page: "sitesettings", label: "Site Settings", icon: "fa-globe", group: "System" });

  return items;
}

let _cmdkIndex = 0;
let _cmdkResults = [];

function openCommandPalette() {
  if (!getToken()) return;
  const overlay = document.getElementById("cmdkOverlay");
  overlay.classList.add("open");
  const input = document.getElementById("cmdkInput");
  input.value = "";
  renderCommandResults("");
  input.focus();
}
function closeCommandPalette() { document.getElementById("cmdkOverlay").classList.remove("open"); }

function renderCommandResults(term) {
  const t = term.trim().toLowerCase();
  _cmdkResults = commandItems().filter((i) => !t || i.label.toLowerCase().includes(t) || i.group.toLowerCase().includes(t)).slice(0, 40);
  _cmdkIndex = 0;
  document.getElementById("cmdkList").innerHTML = _cmdkResults.length
    ? _cmdkResults.map((i, idx) => `<div class="cmdk-item ${idx === 0 ? "active" : ""}" data-idx="${idx}" onclick="runCommand(${idx})">
        <i class="fas ${i.icon}"></i><span>${esc(i.label)}</span><small>${esc(i.group)}</small></div>`).join("")
    : `<div class="empty-state">No match. Try “refunds”, “roster”, “night audit”.</div>`;
}
function runCommand(idx) {
  const item = _cmdkResults[idx];
  if (!item) return;
  closeCommandPalette();
  switchPage(item.page);
}
function moveCommandCursor(delta) {
  if (!_cmdkResults.length) return;
  _cmdkIndex = (_cmdkIndex + delta + _cmdkResults.length) % _cmdkResults.length;
  document.querySelectorAll(".cmdk-item").forEach((el, i) => el.classList.toggle("active", i === _cmdkIndex));
}

async function loadBranchDashboard() {
  const staff = getStaff();
  const container = document.getElementById("pageContent");
  const cards = [];
  let bookingsPanel = "", ticketsPanel = "";

  try {
    if (hasPermission("manage_bookings")) {
      const { bookings } = await adminApi.listBookings();
      const upcoming = bookings.filter((b) => ["PENDING", "CONFIRMED"].includes(b.status));
      cards.push({ label: "Upcoming bookings", value: upcoming.length });
      if (bookings.length) {
        bookingsPanel = `
          <div class="panel"><h3>Recent bookings</h3>
            <table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th></tr></thead>

                <td><span class="badge badge-${b.status.toLowerCase()}">${b.status}</span></td></tr>
              `).join("")}</tbody>
            </table>

      }
    }
    if (hasPermission("manage_rooms")) {
      const { rooms } = await adminApi.listRooms();
      cards.push({ label: "Total rooms", value: rooms.length });
    }
    if (hasPermission("handle_tickets")) {
      const { tickets } = await adminApi.listTickets("OPEN");
      cards.push({ label: "Open tickets", value: tickets.length });
      if (tickets.length) {
        ticketsPanel = `
          <div class="panel"><h3>Open guest tickets</h3>
            <table><thead><tr><th>Subject</th><th>Guest</th><th>Priority</th><th>Status</th></tr></thead>
              <tbody>${tickets.slice(0, 6).map((t) => `
                <tr><td>${t.subject}</td><td>${t.guest.name}</td><td>${t.priority}</td>
                <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td></tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_staff")) {
      const { staff: staffList } = await adminApi.listStaff();
      cards.push({ label: "Branch staff", value: staffList.filter((s) => s.isActive).length });
    }

    container.innerHTML = `
      ${pageHeader("Overview", staff.branchName ? `What's happening at ${staff.branchName} right now.` : "A quick look at what's happening right now.")}
      <div class="stats-grid">
        ${cards.length ? cards.map((c) => `<div class="stat-card"><b>${c.value}</b><span>${c.label}</span></div>`).join("")
          : `<div class="empty-state">Your account doesn't have access to any dashboard sections yet — ask your Manager to grant permissions.</div>`}
      </div>
      ${bookingsPanel}${ticketsPanel}
    `;
  } catch (err) {
    container.innerHTML = `${pageHeader("Overview")}<div class="empty-state">Couldn't load your overview (${err.message}).</div>`;
  }
}

/* ============================================================

          <div id="poVerifyResult" style="display:none; padding:10px 12px; border-radius:8px; background:rgba(47,93,90,0.12); margin-bottom:12px;">

          </div>
          <div class="modal-actions">

            <button type="button" class="btn btn-outline" id="poVerifyBtn" onclick="verifyPayoutAccountClick()">Verify account</button>
            <button type="submit" class="btn btn-primary" id="poSaveBtn" disabled>Save payout account</button>

async function refreshBranchesTable() {
  try {
    const { branches } = await adminApi.listBranches();
    const activeCount = branches.filter((b) => b.isActive).length;
    const totalRooms = branches.reduce((sum, b) => sum + (b.roomCount || 0), 0);
    const totalStaff = branches.reduce((sum, b) => sum + (b.staffCount || 0), 0);

    document.getElementById("branchStatCards").innerHTML = `
      <div class="stat-card"><b>${branches.length}</b><span>Total branches</span></div>
      <div class="stat-card"><b>${activeCount}</b><span>Active</span></div>
      <div class="stat-card"><b>${totalRooms}</b><span>Rooms company-wide</span></div>
      <div class="stat-card"><b>${totalStaff}</b><span>Staff company-wide</span></div>
    `;

    const body = document.getElementById("branchesBody");
    body.innerHTML = branches.length ? branches.map((b) => `
      <tr>
        <td><b>${b.name}</b></td>
        <td>${b.city}${b.state ? `, ${b.state}` : ""}</td>
        <td>${b.manager ? b.manager.name : `<span style="color:var(--text-muted);">Unassigned — appoint in Staff</span>`}</td>
        <td>${(b.services || []).map((s) => SERVICE_LABELS[s] || s).join(", ") || "—"}</td>
        <td><span class="badge badge-${b.isActive ? "active" : "inactive"}">${b.isActive ? "Active" : "Inactive"}</span>${b.paystackSubaccountCode ? ` <span class="badge badge-active" title="Payout account connected"><i class="fas fa-money-check"></i></span>` : ""}</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick='openBranchModal(${JSON.stringify(b).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-outline" onclick='openPayoutModal(${JSON.stringify(b).replace(/'/g, "&#39;")})'>Payout</button>
          <button class="btn btn-sm btn-outline" onclick="toggleBranchActive('${b.id}', ${b.isActive})">${b.isActive ? "Deactivate" : "Activate"}</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No branches yet — open your first one above.</td></tr>`;
  } catch (err) {
    document.getElementById("branchesBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
  }
}

function openBranchModal(branch) {
  document.getElementById("branchModalTitle").textContent = branch ? "Edit branch" : "Open new branch";
  document.getElementById("branchForm").reset();
  document.getElementById("bId").value = branch ? branch.id : "";
  const slugField = document.getElementById("bSlug");
  if (branch) {
    document.getElementById("bName").value = branch.name;
    slugField.value = branch.slug || "";
    slugField.disabled = true; // slug is baked into existing booking links — don't let an edit silently break them
    document.getElementById("bCity").value = branch.city;
    document.getElementById("bState").value = branch.state || "";
    document.getElementById("bAddress").value = branch.address || "";
    document.getElementById("bPhone").value = branch.phone || "";
    document.getElementById("bEmail").value = branch.email || "";
    document.querySelectorAll("#bServices input").forEach((cb) => { cb.checked = (branch.services || []).includes(cb.value); });
  } else {
    slugField.disabled = false;
    slugField.value = "";
  }
  document.getElementById("branchModal").style.display = "flex";
}

let _poVerified = null;

async function openPayoutModal(branch) {
  document.getElementById("payoutForm").reset();
  document.getElementById("poBranchId").value = branch.id;
  document.getElementById("payoutBranchLabel").textContent = branch.name;
  document.getElementById("poVerifyResult").style.display = "none";
  document.getElementById("poSaveBtn").disabled = true;
  _poVerified = null;
  _stripeConnectBranchId = branch.id;

  const select = document.getElementById("poBankCode");
  select.innerHTML = `<option value="">Loading banks&hellip;</option>`;
  document.getElementById("payoutModal").style.display = "flex";
  refreshStripeStatus(branch.id);

  try {
    const { banks } = await adminApi.listPaystackBanks();
    select.innerHTML = `<option value="">Select a bank</option>` + banks.map((b) => `<option value="${b.code}">${b.name}</option>`).join("");
    if (branch.settlementBankCode) select.value = branch.settlementBankCode;
    if (branch.settlementAccountNumber) document.getElementById("poAccountNumber").value = branch.settlementAccountNumber;
  } catch (err) {
    select.innerHTML = `<option value="">Couldn't load banks</option>`;
    showNotice("payoutNotice", err.message);
  }
}
function closePayoutModal() { document.getElementById("payoutModal").style.display = "none"; }

let _stripeConnectBranchId = null;
async function refreshStripeStatus(branchId) {
  const block = document.getElementById("stripeStatusBlock");
  block.textContent = "Checking status…";
  try {
    const status = await adminApi.getStripeAccountStatus(branchId);
    if (!status.connected) {
      block.innerHTML = `<span class="badge badge-inactive">Not connected</span>`;
    } else if (status.chargesEnabled) {
      block.innerHTML = `<span class="badge badge-active">Connected — ready to accept payments</span>`;
    } else {
      block.innerHTML = `<span class="badge badge-warning">Connected — onboarding incomplete</span> <span class="muted" style="font-size:0.8rem;">Stripe needs more info before this account can accept live payments.</span>`;
    }
  } catch (err) {
    block.innerHTML = `<span class="muted">Couldn't check status — ${err.message}</span>`;
  }
}
async function connectStripeClick() {
  const email = document.getElementById("stripeConnectEmail").value;
  if (!email) return showNotice("payoutNotice", "Enter an email for the Stripe account first.");
  const btn = document.getElementById("stripeConnectBtn");
  btn.disabled = true;
  try {
    const { onboardingUrl } = await adminApi.connectStripeAccount(_stripeConnectBranchId, { email });
    window.open(onboardingUrl, "_blank");
    showNotice("payoutNotice", "Continue in the new tab — come back here and reopen this branch's Payout modal afterward to see the updated status.", "success");
  } catch (err) {
    showNotice("payoutNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function verifyPayoutAccountClick() {
  const bankCode = document.getElementById("poBankCode").value;
  const accountNumber = document.getElementById("poAccountNumber").value;
  if (!bankCode || !accountNumber) { showNotice("payoutNotice", "Choose a bank and enter the account number first."); return; }
  const btn = document.getElementById("poVerifyBtn");
  btn.disabled = true;
  try {
    const result = await adminApi.verifyPayoutAccount({ bankCode, accountNumber });
    _poVerified = result;
    document.getElementById("poVerifiedName").textContent = result.accountName;
    document.getElementById("poVerifyResult").style.display = "block";
    document.getElementById("poSaveBtn").disabled = false;
  } catch (err) {
    showNotice("payoutNotice", err.message);
    document.getElementById("poSaveBtn").disabled = true;
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener("submit", async (e) => {
  if (!e.target || e.target.id !== "payoutForm") return;
  e.preventDefault();
  if (!_poVerified) { showNotice("payoutNotice", "Verify the account before saving."); return; }
  const btn = document.getElementById("poSaveBtn");
  btn.disabled = true;
  try {
    const branchId = document.getElementById("poBranchId").value;
    const bankCode = document.getElementById("poBankCode").value;
    const bankName = document.getElementById("poBankCode").selectedOptions[0].textContent;
    const accountNumber = document.getElementById("poAccountNumber").value;
    await adminApi.setBranchPayoutAccount(branchId, { bankCode, bankName, accountNumber });
    showNotice("branchesNotice", "Payout account saved — this branch's guest payments will now settle there.", "success");
    closePayoutModal();
    refreshBranchesTable();
  } catch (err) {
    showNotice("payoutNotice", err.message);
    btn.disabled = false;
  }
});

function autofillBranchSlug() {
  const slugField = document.getElementById("bSlug");
  if (slugField.disabled || slugField.dataset.touched === "1") return; // editing existing branch, or user already typed their own
  slugField.value = document.getElementById("bName").value
    .trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function closeBranchModal() { document.getElementById("branchModal").style.display = "none"; }

async function toggleBranchActive(id, currentlyActive) {
  const verb = currentlyActive ? "deactivate" : "reactivate";
  if (!confirm(`Are you sure you want to ${verb} this branch? ${currentlyActive ? "It will stop taking new bookings." : ""}`)) return;
  try { await adminApi.updateBranch(id, { isActive: !currentlyActive }); refreshBranchesTable(); }
  catch (err) { showNotice("branchesNotice", err.message); }
}

async function submitBranchForm(e) {
  e.preventDefault();
  const btn = document.getElementById("bSubmitBtn");
  btn.disabled = true;
  try {
    const id = document.getElementById("bId").value;
    const services = Array.from(document.querySelectorAll("#bServices input:checked")).map((el) => el.value);
    const payload = {
      name: document.getElementById("bName").value,
      city: document.getElementById("bCity").value,
      state: document.getElementById("bState").value || undefined,
      address: document.getElementById("bAddress").value || undefined,
      phone: document.getElementById("bPhone").value || undefined,
      email: document.getElementById("bEmail").value || undefined,
      services,
    };
    if (!id) payload.slug = document.getElementById("bSlug").value || undefined; // slug is create-only — PATCH /branches/:id doesn't accept it
    if (id) { await adminApi.updateBranch(id, payload); showNotice("branchesNotice", "Branch updated.", "success"); }
    else { await adminApi.createBranch(payload); showNotice("branchesNotice", "Branch opened. Appoint a Manager from Staff.", "success"); }
    closeBranchModal();
    refreshBranchesTable();
  } catch (err) {
    showNotice("branchesNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

/* ============================================================
   ROOMS — Room + RoomType merged into one listing. Every room is a
   complete, self-contained record now (name, price, photos, amenities),
   not a physical unit pointing at a shared template. Creating, editing,
   deleting a room, and its photos, is Director-only — this whole panel
   is Director-only, so that's every action on this page except the
   Status dropdown, which Manager/Staff can also reach from their own
   panels via the separate status-only route.

   This page ALSO fixes a real bug: branchPath() never sends a branchId,
   so every write from this panel used to 400 with "branchId is required"
   the moment you tried it. A branch selector was the missing piece.
   ============================================================ */
let _roomsSelectedBranchId = "";
let _cachedRooms = [];

async function loadRoomsPage() {
  const container = document.getElementById("pageContent");

  let branchOptionsHtml = `<option value="">Select a branch…</option>`;

  try {

    branchOptionsHtml = branches.map((b) => `<option value="${b.id}" ${b.id === _roomsSelectedBranchId ? "selected" : ""}>${b.name}</option>`).join("");
  } catch { /* non-fatal — the selector will just be empty */ }

  container.innerHTML = `
    ${pageHeader("Rooms", "Every room is priced and photographed individually per branch.",
      `<button class="btn btn-primary" onclick="openRoomModal()" ${_roomsSelectedBranchId ? "" : "disabled"}>Add room</button>`)}
    <div id="roomsNotice"></div>
    <div class="panel">
      <div class="form-field" style="max-width:320px;">
        <label>Branch</label>
        <select id="roomsBranchSelect" onchange="_roomsSelectedBranchId=this.value; refreshRooms();">${branchOptionsHtml}</select>
      </div>
    </div>
    <div class="panel"><h3>Rooms</h3>
      <table><thead><tr><th></th><th>Room #</th><th>Name</th><th>Price</th><th>Floor</th><th>Status</th><th></th></tr></thead>
        <tbody id="roomsBody"><tr><td colspan="7" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="modal-overlay" id="roomModal" style="display:none;">
      <div class="modal">
        <h3 id="roomModalTitle">Add room</h3>
        <form id="roomForm">
          <input type="hidden" id="rId">
          <div class="form-field"><label>Name</label><input type="text" id="rName" placeholder="e.g. Deluxe King — 214" required></div>
          <div class="form-row">
            <div class="form-field"><label>Base price (&#8358;)</label><input type="number" id="rPrice" min="0" step="1" required></div>
            <div class="form-field"><label>Max occupancy</label><input type="number" id="rOccupancy" min="1" step="1" value="2" required></div>
          </div>
          <div class="form-row">
            <div class="form-field"><label>Room number</label><input type="text" id="rNumber" required></div>
            <div class="form-field"><label>Floor</label><input type="text" id="rFloor"></div>
          </div>
          <div class="form-field"><label>Description</label><textarea id="rDescription" rows="2"></textarea></div>
          <div class="form-field"><label>Amenities (comma-separated)</label><input type="text" id="rAmenities" placeholder="Wi-Fi, AC, Ocean view"></div>
          <div class="form-field">
            <label>Tags <span style="color:var(--text-muted); font-weight:400;">(manage the list from the Tags page)</span></label>
            <div id="rTagsOptions" class="checkbox-grid"><span style="color:var(--text-muted); font-size:0.82rem;">Loading…</span></div>
          </div>
          <div class="form-field">
            <label>Status</label>
            <select id="rStatus">
              <option value="ACTIVE">Active (sellable)</option>
              <option value="MAINTENANCE">Maintenance</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>
          <div class="form-field" id="rGalleryField" style="display:none;">
            <label>Gallery</label>
            <div id="rGalleryPreview" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;"></div>
            <input type="file" id="rImageInput" accept="image/*">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="closeRoomModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="rSubmitBtn">Save room</button>
          </div>
        </form>
      </div>
    </div>
  `;

  document.getElementById("roomForm").addEventListener("submit", submitRoomForm);
  if (_roomsSelectedBranchId) await refreshRooms();
  else document.getElementById("roomsBody").innerHTML = `<tr><td colspan="7" class="empty-state">Pick a branch above to see its rooms.</td></tr>`;
}

async function refreshRooms() {
  if (!_roomsSelectedBranchId) return;
  try {
    const { rooms } = await adminApi.listRooms(_roomsSelectedBranchId);
    _cachedRooms = rooms;

    document.getElementById("roomsBody").innerHTML = rooms.length ? rooms.map((r) => `
      <tr>
        <td>${r.images && r.images[0] ? `<img src="${r.images[0]}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">` : `<span class="offering-photo-placeholder"><i class="fa-solid fa-camera"></i></span>`}</td>
        <td>${r.roomNumber}</td>
        <td>${r.name}</td>
        <td>&#8358;${Number(r.basePrice).toLocaleString()}</td>
        <td>${r.floor || "—"}</td>
        <td><span class="badge badge-${r.status.toLowerCase()}">${r.status}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick='openRoomModal(${JSON.stringify(r).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-outline" onclick="deleteRoomConfirm('${r.id}')">Delete</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="7" class="empty-state">No rooms at this branch yet — add one above.</td></tr>`;
  } catch (err) {
    showNotice("roomsNotice", err.message);
  }
}

let _rEditingId = null;
function openRoomModal(room) {
  document.getElementById("roomModalTitle").textContent = room ? "Edit room" : "Add room";
  document.getElementById("roomForm").reset();
  _rEditingId = room ? room.id : null;
  document.getElementById("rId").value = room ? room.id : "";
  document.getElementById("rGalleryField").style.display = room ? "block" : "none";
  document.getElementById("rGalleryPreview").innerHTML = (room && room.images || []).map((url) => `
    <div style="position:relative;">
      <img src="${url}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;">
      <button type="button" onclick="removeRoomImage('${url}')" style="position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;">&times;</button>
    </div>
  `).join("");
  if (room) {
    document.getElementById("rName").value = room.name;
    document.getElementById("rPrice").value = room.basePrice;
    document.getElementById("rOccupancy").value = room.maxOccupancy;
    document.getElementById("rNumber").value = room.roomNumber;
    document.getElementById("rFloor").value = room.floor || "";
    document.getElementById("rDescription").value = room.description || "";
    document.getElementById("rAmenities").value = (room.amenities || []).join(", ");

  }
  refreshRoomTagOptions(room ? (room.tags || []) : []);
  document.getElementById("roomModal").style.display = "flex";
}
function closeRoomModal() { document.getElementById("roomModal").style.display = "none"; }

async function refreshRoomTagOptions(selectedTags) {
  const container = document.getElementById("rTagsOptions");
  if (!_roomsSelectedBranchId) { container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Pick a branch first.</span>`; return; }
  const currentlySelected = selectedTags || Array.from(container.querySelectorAll("input:checked")).map((el) => el.value);
  try {
    const { tags } = await adminApi.listTags(_roomsSelectedBranchId, "room");
    container.innerHTML = tags.length ? tags.map((t) => `
      <label class="checkbox-item"><input type="checkbox" value="${t.name}" ${currentlySelected.includes(t.name) ? "checked" : ""}> ${t.name}</label>
    `).join("") : `<span style="color:var(--text-muted); font-size:0.82rem;">No tags yet — add some from the <a href="#" onclick="switchPage('tags'); return false;" style="color:var(--brass-dark); font-weight:600;">Tags page</a>.</span>`;
  } catch {
    container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Couldn't load tags.</span>`;
  }
}

async function removeRoomImage(url) {
  if (!_rEditingId) return;
  try {
    await adminApi.deleteRoomImage(_rEditingId, url);

async function refreshStock() {

function openStockModal(item) {

async function submitStockForm(e) {
  e.preventDefault();

  try {
    const id = document.getElementById("stId").value;
    if (id) {
      // Editing: name/unit/threshold only — no quantity field sent.

    showNotice("stockNotice", err.message);
  } finally {
    btn.disabled = false;
  }

  document.getElementById("eventModalTitle").textContent = ev ? "Edit event" : "Add event";
