<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Panel — Uyeh Hotel</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   Uyeh HOTEL — MANAGER PANEL
   Branch-scoped counterpart to the Director admin dashboard.
   Same design tokens/theme, no company-wide sections.
   Single-file SPA: sidebar + topbar shell stay fixed, page
   content area swapped via JS (switchPage) using innerHTML.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #14181f; --ink-light: #1c2230; --ivory: #f6f1e7; --panel: #ffffff;
  --border: #e6e0d2; --border-soft: rgba(20,24,31,0.08);
  --brass: #b98d45; --brass-dark: #96712f; --teal: #2f5d5a; --danger: #a3392a; --info: #3b6ea5;
  --text-muted: #6b6355; --text-on-dark: #ede6d6; --text-on-dark-muted: rgba(237,230,214,0.6);
  --font-display: 'Fraunces', serif; --font-body: 'Inter', -apple-system, sans-serif; --radius: 8px;
}

body { font-family: var(--font-body); background: var(--ivory); color: var(--ink); overflow-x: hidden; font-size: 14px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
a { color: inherit; }

/* LOGIN */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ink); }
.login-card { background: var(--panel); padding: 48px 40px; border-radius: var(--radius); width: 100%; max-width: 380px; }
.login-card .brand { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 6px; }
.login-card .brand span { color: var(--brass); }
.login-card p.sub { color: var(--text-muted); margin-bottom: 28px; font-size: 0.88rem; }

/* SIDEBAR */
.sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 270px; background: var(--ink);
  border-right: 1px solid rgba(237,230,214,0.08); padding: 26px 0; z-index: 1000; overflow-y: auto; transition: transform 0.3s ease; }
.sidebar-header { padding: 0 26px 22px; border-bottom: 1px solid rgba(237,230,214,0.08); display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--brass-dark), var(--brass));
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 1.1rem; }
.logo-text { font-family: var(--font-display); font-size: 1.2rem; color: var(--text-on-dark); }
.logo-text span { color: var(--brass); }

.admin-info { padding: 18px 26px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(237,230,214,0.08); }
.admin-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), #3d7873);
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 0.95rem; flex-shrink: 0; }
.admin-details .admin-name { color: var(--text-on-dark); font-size: 0.88rem; font-weight: 600; }
.admin-details .admin-role { color: var(--brass); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }
.admin-details .admin-branch { color: var(--text-on-dark-muted); font-size: 0.74rem; margin-top: 1px; }

.nav-menu { padding: 14px 0; }
.nav-item-standalone { padding: 11px 26px; display: flex; align-items: center; gap: 12px; color: var(--text-on-dark-muted);
  cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; font-size: 0.88rem; font-weight: 500; }
.nav-item-standalone:hover { background: rgba(185,141,69,0.06); color: var(--text-on-dark); }
.nav-item-standalone.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item-standalone i { width: 18px; text-align: center; }
.nav-divider { height: 1px; background: rgba(237,230,214,0.08); margin: 10px 26px 10px; }

.nav-group { margin-bottom: 2px; }
.nav-group-header { padding: 10px 26px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; transition: all 0.15s; }
.nav-group-header:hover { background: rgba(255,255,255,0.02); }
.nav-group-header .group-icon { width: 18px; text-align: center; font-size: 0.85rem; color: rgba(185,141,69,0.6); }
.nav-group-header .group-label { flex: 1; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted); }
.nav-group-header .group-chevron { font-size: 0.65rem; color: rgba(237,230,214,0.25); transition: transform 0.2s; }
.nav-group.open > .nav-group-header .group-chevron { transform: rotate(180deg); color: var(--brass); }
.nav-group.open > .nav-group-header .group-icon, .nav-group.open > .nav-group-header .group-label { color: var(--brass); }
.nav-group-header .group-badge { font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: rgba(163,57,42,0.25); color: #e08a7a; display: none; }
.nav-group-header .group-badge.visible { display: inline-block; }
.nav-group-body { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
.nav-group.open > .nav-group-body { max-height: 600px; }

.nav-item { padding: 10px 26px 10px 50px; display: flex; align-items: center; gap: 11px; color: var(--text-on-dark-muted);
  cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; font-size: 0.84rem; font-weight: 500; position: relative; }
.nav-item:hover { background: rgba(185,141,69,0.05); color: var(--text-on-dark); }
.nav-item.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item i { width: 16px; text-align: center; font-size: 0.82rem; }
.nav-item .nav-badge { margin-left: auto; background: rgba(163,57,42,0.25); color: #e08a7a; padding: 1px 7px; border-radius: 9px; font-size: 0.64rem; font-weight: 700; display: none; }
.nav-item .nav-badge.visible { display: inline-block; }

.sidebar-footer { padding: 16px 26px 0; margin-top: 12px; }
.logout-link { color: var(--text-on-dark-muted); font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.logout-link:hover { color: var(--text-on-dark); }

/* MAIN */
.main-content { margin-left: 270px; min-height: 100vh; }
.topbar { background: rgba(246,241,231,0.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 16px 36px;
  display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; gap: 16px; }
.hamburger-btn { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
.hamburger-btn span { width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }
.search-bar { flex: 1; max-width: 420px; position: relative; }
.search-bar input { width: 100%; padding: 10px 16px 10px 40px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.88rem; font-family: var(--font-body); }
.search-bar input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
.search-bar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }
.topbar-actions { display: flex; align-items: center; gap: 14px; }
.topbar-btn { width: 40px; height: 40px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--ink); }

.page-content { padding: 30px 36px 60px; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-title { font-size: 1.5rem; }
.page-subtitle { color: var(--text-muted); font-size: 0.88rem; margin-top: 4px; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.stat-card b { font-family: var(--font-display); font-size: 1.6rem; display: block; }
.stat-card span { color: var(--text-muted); font-size: 0.8rem; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }
.panel h3 { font-size: 1.05rem; margin-bottom: 14px; }

table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th { text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
tr:last-child td { border-bottom: none; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; text-transform: capitalize; }
.badge-active, .badge-paid, .badge-confirmed, .badge-checked_in, .badge-resolved, .badge-available, .badge-create { background: rgba(47,93,90,0.12); color: var(--teal); }
.badge-inactive, .badge-cancelled, .badge-refunded, .badge-delete { background: rgba(163,57,42,0.1); color: var(--danger); }
.badge-pending, .badge-open, .badge-maintenance, .badge-update { background: rgba(179,140,43,0.14); color: var(--brass-dark); }
.badge-in_progress, .badge-cleaning, .badge-occupied { background: rgba(59,110,165,0.12); color: var(--info); }

.btn { font-family: var(--font-body); font-size: 0.84rem; font-weight: 600; padding: 10px 18px; border-radius: var(--radius); border: none; cursor: pointer; transition: opacity 0.15s; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--brass); color: var(--ink); }
.btn-primary:hover:not(:disabled) { opacity: 0.88; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink); }
.btn-outline:hover:not(:disabled) { background: var(--ivory); }
.btn-danger { background: rgba(163,57,42,0.1); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: rgba(163,57,42,0.18); }
.btn-sm { padding: 6px 12px; font-size: 0.78rem; margin-right: 6px; }

.loading-state, .empty-state { text-align: center; color: var(--text-muted); padding: 30px; font-size: 0.86rem; }
.coming-soon { text-align: center; padding: 50px 20px; color: var(--text-muted); }
.coming-soon i { font-size: 2rem; color: var(--brass); margin-bottom: 12px; display: block; }

.notice { padding: 12px 16px; border-radius: var(--radius); font-size: 0.84rem; margin-bottom: 14px; }
.notice.error { background: rgba(163,57,42,0.08); color: var(--danger); border: 1px solid rgba(163,57,42,0.2); }
.notice.success { background: rgba(47,93,90,0.08); color: var(--teal); border: 1px solid rgba(47,93,90,0.2); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--ink); }
.form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font-body); font-size: 0.86rem; background: #fff; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; }

.checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; font-weight: 400 !important; cursor: pointer; }
.checkbox-item input { width: auto !important; }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,24,31,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.modal { background: var(--panel); border-radius: var(--radius); padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn { background: none; border: none; padding: 10px 16px; font-family: var(--font-body); font-size: 0.86rem; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--brass-dark); border-bottom-color: var(--brass); }

.badge-clean { background: #e6f7ee; color: #0a7a3f; }
.badge-dirty { background: #fdeaea; color: #b3261e; }
.badge-cleaning { background: #fff4e0; color: #9a6300; }
.badge-inspected { background: #e8f0fe; color: #1a56db; }
.badge-out_of_order { background: #f0f0f0; color: #5f5f5f; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .hamburger-btn { display: flex; }
  .form-row, .checkbox-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand">Uyeh <span>Hotel</span></div>
    <p class="sub">Manager panel — sign in with your staff account.</p>
    <div id="loginNotice"></div>
    <form id="loginForm">
      <div class="form-field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="form-field"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:6px;">Log in</button>
    </form>

    <form id="twoFactorForm" style="display:none;">
      <p class="sub" style="margin-top:0;">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div class="form-field"><label>Code</label><input type="text" id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required autofocus></div>
      <button type="submit" class="btn btn-primary" id="twoFactorBtn" style="width:100%; margin-top:6px;">Verify</button>
      <button type="button" id="twoFactorBackBtn" style="width:100%; margin-top:10px; background:none; border:none; color:var(--text-muted); font-size:0.85rem; cursor:pointer;">&larr; Back to login</button>
    </form>
  </div>
</div>

<div id="appShell" style="display:none;">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">O</div>
      <div class="logo-text">Uyeh <span>Hotel</span></div>
    </div>
    <div class="admin-info">
      <div class="admin-avatar" id="adminAvatar">M</div>
      <div class="admin-details">
        <div class="admin-name" id="adminName"></div>
        <div class="admin-role" id="adminRole"></div>
        <div class="admin-branch" id="adminBranch"></div>
      </div>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="sidebar-footer">
      <div class="logout-link" id="securityBtn" onclick="openSecurityModal()" style="margin-bottom:10px;"><i class="fas fa-shield-halved"></i> Security</div>
      <div class="logout-link" id="logoutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Log out</div>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <button class="hamburger-btn" id="hamburgerBtn"><span></span><span></span><span></span></button>
      <div class="search-bar"><i class="fas fa-magnifying-glass"></i><input type="text" placeholder="Search…" disabled></div>
      <div class="topbar-actions">
        <div class="topbar-btn" id="ticketsBellBtn"><i class="fas fa-bell"></i><span class="nav-badge" id="ticketsBellBadge" style="position:absolute; top:2px; right:2px;">0</span></div>
      </div>
    </div>
    <div class="page-content" id="pageContent"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG / SESSION
   ============================================================ */
const API_BASE = "https://uyeh-hotel-backend.onrender.com/api";
function getToken() { return localStorage.getItem("mgr_token"); }
function getStaff() { try { return JSON.parse(localStorage.getItem("mgr_staff")); } catch { return null; } }
function setSession(token, staff) { localStorage.setItem("mgr_token", token); localStorage.setItem("mgr_staff", JSON.stringify(staff)); }
function clearSession() { localStorage.removeItem("mgr_token"); localStorage.removeItem("mgr_staff"); }
function hasPermission(perm) {
  const s = getStaff();
  return !!s;
}
// This panel is for Manager only

/* ============================================================
   API
   ============================================================ */
async function adminRequest(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${getToken()}`, ...(options.headers || {}) },
  });
  if (res.status === 401) { clearSession(); showLogin(); throw new Error("Session expired"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

// All calls below are branch-scoped server-side to the logged-in staff member's
// branchId — this panel never sends a branchId, and the backend must ignore one
// if it's ever present in a payload from this client.
const managerApi = {
  setupTwoFactor: () => adminRequest("/2fa/setup", { method: "POST" }),
  enableTwoFactor: (code) => adminRequest("/2fa/enable", { method: "POST", body: JSON.stringify({ code }) }),
  disableTwoFactor: (password) => adminRequest("/2fa/disable", { method: "POST", body: JSON.stringify({ password }) }),
  login: async (email, password) => {
    const res = await fetch(`${API_BASE}/auth/manager/login`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Login failed");
    if (data.requires2FA) return data; // { requires2FA: true, tempToken } — caller shows the code-entry screen

    // The bug this was fixing: the backend returns the account under a
    // `manager` key — never `staff`. Reading the wrong key silently
    // produced `undefined`, which then got JSON.stringify'd into
    // localStorage as the literal string "undefined" and broke every
    // session read after login.
    if (!data.manager) throw new Error("Unexpected login response — no account data returned");
    return { token: data.token, refreshToken: data.refreshToken, staff: data.manager };
  },

  verifyTwoFactor: async (tempToken, code) => {
    const res = await fetch(`${API_BASE}/auth/login/2fa`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ tempToken, code }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Verification failed");
    if (!data.manager) throw new Error("Unexpected response — no account data returned");
    return { token: data.token, refreshToken: data.refreshToken, staff: data.manager };
  },
  getDepartments: () => adminRequest("/manager/departments"),

  getSettings: () => adminRequest("/manager/branch-settings"),
  updateSettings: (payload) => adminRequest("/manager/branch-settings", { method: "PATCH", body: JSON.stringify(payload) }),

  getReports: () => adminRequest("/manager/reports"),

  // Rooms — Manager can only view and update status/housekeeping now.
  // Creating, editing, deleting a room, or touching its photos, is
  // Director-only (see admin-panel.html) — none of those routes are
  // reachable from this panel anymore, on purpose.
  listRooms: () => adminRequest("/manager/rooms"),
  updateRoomStatus: (id, status) => adminRequest(`/manager/rooms/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) }),

  // Housekeeping — separate from room status above. Tracks whether a
  // room is actually ready to hand to a guest right now, not whether
  // it's bookable at all.
  listHousekeeping: (status) => adminRequest(`/manager/housekeeping${status ? `?status=${status}` : ""}`),
  updateHousekeepingStatus: (roomId, housekeepingStatus) => adminRequest(`/manager/housekeeping/${roomId}`, { method: "PATCH", body: JSON.stringify({ housekeepingStatus }) }),

  // Upcoming Events — draft/submit side. Director approves/rejects from
  // their own panel.
  listUpcomingEvents: (status) => adminRequest(`/manager/upcoming-events${status ? `?status=${status}` : ""}`),
  createUpcomingEvent: (payload) => adminRequest("/manager/upcoming-events", { method: "POST", body: JSON.stringify(payload) }),
  updateUpcomingEvent: (id, payload) => adminRequest(`/manager/upcoming-events/${id}`, { method: "PATCH", body: JSON.stringify(payload) }),
  submitUpcomingEvent: (id) => adminRequest(`/manager/upcoming-events/${id}/submit`, { method: "POST" }),
  deleteUpcomingEvent: (id) => adminRequest(`/manager/upcoming-events/${id}`, { method: "DELETE" }),

  listMenuItems: (category) => adminRequest(`/manager/menu${category ? `?category=${category}` : ""}`),
  createMenuItem: (payload) => adminRequest("/manager/menu", { method: "POST", body: JSON.stringify(payload) }),
  updateMenuItem: (id, payload) => adminRequest(`/manager/menu/${id}`, { method: "PATCH", body: JSON.stringify(payload) }),

  listBookings: (status) => adminRequest(`/manager/bookings${status ? `?status=${status}` : ""}`),
  updateBookingStatus: (id, status) => adminRequest(`/manager/bookings/${id}/status`, { method: "PATCH", body: JSON.stringify({ status }) }),
  getFolio: (id) => adminRequest(`/manager/bookings/${id}/folio`),
  settleFolio: (id, method) => adminRequest(`/manager/bookings/${id}/folio/settle`, { method: "POST", body: JSON.stringify({ method }) }),

  listStaff: () => adminRequest("/manager/staff"),
  createStaff: (payload) => adminRequest("/manager/staff", { method: "POST", body: JSON.stringify(payload) }),
  updateStaff: (id, payload) => adminRequest(`/manager/staff/${id}`, { method: "PATCH", body: JSON.stringify(payload) }),

  listTickets: (status) => adminRequest(`/manager/tickets${status ? `?status=${status}` : ""}`),
  getTicket: (id) => adminRequest(`/manager/tickets/${id}`),
  assignTicket: (id) => adminRequest(`/manager/tickets/${id}/assign`, { method: "PATCH" }),
  replyToTicket: (id, message) => adminRequest(`/manager/tickets/${id}/messages`, { method: "POST", body: JSON.stringify({ message }) }),
  resolveTicket: (id) => adminRequest(`/manager/tickets/${id}/resolve`, { method: "PATCH" }),

  // Stock — quantity is edited only through movements now (see below);
  // updateStockItem no longer accepts quantity, the backend ignores it.
  listStockItems: () => adminRequest("/manager/stock"),
  createStockItem: (payload) => adminRequest("/manager/stock", { method: "POST", body: JSON.stringify(payload) }),

function switchPage(page) {
  setActiveNav(page);
  const loader = PAGE_LOADERS[page];
  const container = document.getElementById("pageContent");
  if (!loader) { container.innerHTML = `<div class="empty-state">Unknown page.</div>`; return; }
  container.innerHTML = `<div class="loading-state">Loading…</div>`;
  loader();
  if (window.innerWidth <= 900) document.getElementById("sidebar").classList.remove("open");
}
function loadComingSoon(title, description) {
  document.getElementById("pageContent").innerHTML = `
    <div class="page-header"><div><h1 class="page-title">${title}</h1></div></div>
    <div class="panel"><div class="coming-soon"><i class="fas fa-hammer"></i><p><b>${title} isn't built yet.</b></p><p style="margin-top:6px;">${description}</p></div></div>
  `;
}
function pageHeader(title, subtitle, actionHtml = "") {
  return `<div class="page-header"><div><h1 class="page-title">${title}</h1>${subtitle ? `<p class="page-subtitle">${subtitle}</p>` : ""}</div>${actionHtml}</div>`;
}

/* ============================================================
   DASHBOARD — this branch only
   ============================================================ */
async function loadDashboardPage() {
  const staff = getStaff();
  const container = document.getElementById("pageContent");
  const cards = [];
  let bookingsPanel = "", ticketsPanel = "";

  try {
    if (hasPermission("manage_bookings")) {
      const { bookings } = await managerApi.listBookings();
      const upcoming = bookings.filter((b) => ["PENDING", "CONFIRMED"].includes(b.status));
      cards.push({ label: "Upcoming bookings", value: upcoming.length });
      if (bookings.length) {
        bookingsPanel = `
          <div class="panel"><h3>Recent bookings</h3>
            <table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th></tr></thead>
              <tbody>${bookings.slice(0, 6).map((b) => `
                <tr><td>${b.guest.name}</td><td>${b.room.name} — ${b.room.roomNumber}</td>
                <td>${b.checkIn.slice(0,10)} → ${b.checkOut.slice(0,10)}</td>
                <td><span class="badge badge-${b.status.toLowerCase()}">${b.status}</span></td></tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_rooms")) {
      const { rooms } = await managerApi.listRooms();
      cards.push({ label: "Total rooms", value: rooms.length });
    }
    if (hasPermission("handle_tickets")) {
      const { tickets } = await managerApi.listTickets("OPEN");
      cards.push({ label: "Open tickets", value: tickets.length });
      if (tickets.length) {
        ticketsPanel = `
          <div class="panel"><h3>Open guest tickets</h3>
            <table><thead><tr><th>Subject</th><th>Guest</th><th>Priority</th><th>Status</th></tr></thead>
              <tbody>${tickets.slice(0, 6).map((t) => `
                <tr><td>${t.subject}</td><td>${t.guest.name}</td><td>${t.priority}</td>
                <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td></tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_staff")) {
      const { staff: staffList } = await managerApi.listStaff();
      cards.push({ label: "Branch staff", value: staffList.filter((s) => s.isActive).length });
    }
    if (hasPermission("view_reports")) {
      const { report } = await managerApi.getReports();
      cards.push({ label: "Revenue this month", value: `\u20a6${Number(report?.revenueThisMonth || 0).toLocaleString()}` });
    }

    container.innerHTML = `
      ${pageHeader("Overview", staff.branchName ? `What's happening at ${staff.branchName} right now.` : "A quick look at what's happening right now.")}
      <div class="stats-grid">
        ${cards.length ? cards.map((c) => `<div class="stat-card"><b>${c.value}</b><span>${c.label}</span></div>`).join("")
          : `<div class="empty-state">Your account doesn't have access to any dashboard sections yet — ask your Director to grant permissions.</div>`}
      </div>
      ${bookingsPanel}${ticketsPanel}
    `;
  } catch (err) {
    container.innerHTML = `${pageHeader("Overview")}<div class="empty-state">Couldn't load your overview (${err.message}).</div>`;
  }
}

/* ============================================================
   ROOMS — read-only for Manager now. A Director builds and prices every
   room (name, price, photos, room number, floor) in their own panel;
   Manager can only see the list and flip status (Active/Maintenance/
   Inactive). Housekeeping status is handled on its own page below —
   see loadHousekeepingPage.
   ============================================================ */
async function loadRoomsPage() {
  const container = document.getElementById("pageContent");
  container.innerHTML = `
    ${pageHeader("Rooms", "Rooms are built and priced by your Director. You can view them and change status here.")}
    <div id="roomsNotice"></div>
    <div class="panel">
      <table><thead><tr><th></th><th>Room #</th><th>Name</th><th>Price</th><th>Floor</th><th>Status</th></tr></thead>
        <tbody id="roomsBody"><tr><td colspan="6" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>
  `;
  await refreshRooms();
}

async function refreshRooms() {
  try {
    const { rooms } = await managerApi.listRooms();
    document.getElementById("roomsBody").innerHTML = rooms.length ? rooms.map((r) => `
      <tr>
        <td>${r.images && r.images[0] ? `<img src="${r.images[0]}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;">` : ""}</td>
        <td>${r.roomNumber}</td>
        <td>${r.name}</td>
        <td>&#8358;${Number(r.basePrice).toLocaleString()}</td>
        <td>${r.floor || "—"}</td>
        <td>
          <select onchange="changeRoomStatus('${r.id}', this.value)">
            <option value="ACTIVE" ${r.status === "ACTIVE" ? "selected" : ""}>Active</option>
            <option value="MAINTENANCE" ${r.status === "MAINTENANCE" ? "selected" : ""}>Maintenance</option>
            <option value="INACTIVE" ${r.status === "INACTIVE" ? "selected" : ""}>Inactive</option>
          </select>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No rooms yet — ask your Director to add some.</td></tr>`;
  } catch (err) { showNotice("roomsNotice", err.message); }
}

async function changeRoomStatus(id, status) {
  try {
    await managerApi.updateRoomStatus(id, status);
    showNotice("roomsNotice", "Room status updated.", "success");
  } catch (err) {
    showNotice("roomsNotice", err.message);
    refreshRooms();
  }
}

/* ============================================================
   HOUSEKEEPING — Clean/Dirty/Cleaning/Inspected/Out of Order per
   room. Separate from the Rooms page's ACTIVE/MAINTENANCE/INACTIVE
   status. Filterable by status; each row updates inline.
   ============================================================ */
const HOUSEKEEPING_STATUSES = ["CLEAN", "DIRTY", "CLEANING", "INSPECTED", "OUT_OF_ORDER"];
const HOUSEKEEPING_LABELS = { CLEAN: "Clean", DIRTY: "Dirty", CLEANING: "Cleaning", INSPECTED: "Inspected", OUT_OF_ORDER: "Out of order" };

async function loadHousekeepingPage() {
  const container = document.getElementById("pageContent");
  container.innerHTML = `
    ${pageHeader("Housekeeping", "Track which rooms are ready to hand to a guest right now.")}
    <div class="panel" style="margin-bottom:16px;">
      <div class="form-field" style="max-width:260px;">
        <label>Filter by status</label>
        <select id="hkStatusFilter" onchange="refreshHousekeeping()">
          <option value="">All rooms</option>
          ${HOUSEKEEPING_STATUSES.map((s) => `<option value="${s}">${HOUSEKEEPING_LABELS[s]}</option>`).join("")}
        </select>
      </div>
    </div>
    <div id="housekeepingNotice"></div>
    <div class="panel">
      <table><thead><tr><th>Room #</th><th>Name</th><th>Floor</th><th>Last updated</th><th>Housekeeping status</th></tr></thead>
        <tbody id="housekeepingBody"><tr><td colspan="5" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>
  `;
  await refreshHousekeeping();
}

async function refreshHousekeeping() {
  const statusFilter = document.getElementById("hkStatusFilter")?.value || "";
  try {
    const { rooms } = await managerApi.listHousekeeping(statusFilter);
    document.getElementById("housekeepingBody").innerHTML = rooms.length ? rooms.map((r) => `
      <tr>
        <td>${r.roomNumber}</td>
        <td>${r.name}</td>
        <td>${r.floor || "—"}</td>
        <td>${r.housekeepingUpdatedAt ? new Date(r.housekeepingUpdatedAt).toLocaleString() : "—"}</td>
        <td>
          <span class="badge badge-${r.housekeepingStatus.toLowerCase()}" style="margin-right:8px;">${HOUSEKEEPING_LABELS[r.housekeepingStatus]}</span>
          <select onchange="changeHousekeepingStatus('${r.id}', this.value)" style="padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:0.78rem;">
            <option value="">Change…</option>
            ${HOUSEKEEPING_STATUSES.filter((s) => s !== r.housekeepingStatus).map((s) => `<option value="${s}">${HOUSEKEEPING_LABELS[s]}</option>`).join("")}
          </select>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="5" class="empty-state">No rooms match this filter.</td></tr>`;
  } catch (err) { showNotice("housekeepingNotice", err.message); }
}

async function changeHousekeepingStatus(roomId, housekeepingStatus) {
  if (!housekeepingStatus) return;
  try {
    await managerApi.updateHousekeepingStatus(roomId, housekeepingStatus);
    showNotice("housekeepingNotice", "Housekeeping status updated.", "success");
    refreshHousekeeping();
  } catch (err) {
    showNotice("housekeepingNotice", err.message);
    refreshHousekeeping();
  }
}

async function refreshMenuTagOptions(selectedTags) {
  const cat = document.getElementById("miCategory").value;
  const service = cat === "DRINK" ? "bar" : "restaurant";
  const container = document.getElementById("miTagsOptions");
  const currentlySelected = selectedTags || Array.from(container.querySelectorAll("input:checked")).map((el) => el.value);
  try {
    const { tags } = await managerApi.listTags(service);
    container.innerHTML = tags.length ? tags.map((t) => `
      <label class="checkbox-item"><input type="checkbox" value="${t.name}" ${currentlySelected.includes(t.name) ? "checked" : ""}> ${t.name}</label>
    `).join("") : `<span style="color:var(--text-muted); font-size:0.82rem;">No tags yet — add some from the <a href="#" onclick="switchPage('tags'); return false;" style="color:var(--brass-dark); font-weight:600;">Tags page</a>.</span>`;
  } catch {
    container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Couldn't load tags.</span>`;
  }
}
function toggleMenuStockFields() {
  document.getElementById("miStockQtyRow").style.display = document.getElementById("miTrackStock").checked ? "" : "none";
}
async function refreshMenuTable() {
  try {
    const { menuItems } = await managerApi.listMenuItems();
    document.getElementById("menuBody").innerHTML = menuItems.length ? menuItems.map((m) => `
      <tr><td>${m.name}</td><td>${MENU_CATEGORY_LABELS[m.category] || m.category}</td>
      <td>${(m.tags || []).map((t) => `<span class="badge">${t}</span>`).join(" ") || "—"}</td>
      <td>&#8358;${Number(m.price).toLocaleString()}</td>
      <td><span class="badge badge-${m.isAvailable ? "active" : "inactive"}">${m.isAvailable ? "Available" : "Unavailable"}</span></td>
      <td><button class="btn btn-sm btn-outline" onclick='openMenuItemModal(${JSON.stringify(m).replace(/'/g, "&#39;")})'>Edit</button>
      <button class="btn btn-sm btn-outline" onclick="toggleMenuItemAvailable('${m.id}', ${m.isAvailable})">${m.isAvailable ? "Deactivate" : "Activate"}</button></td></tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No items yet.</td></tr>`;
  } catch (err) { document.getElementById("menuBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`; }
}
function openMenuItemModal(m) {
  document.getElementById("menuItemModalTitle").textContent = m ? "Edit item" : "Add item";
  document.getElementById("menuItemForm").reset();
  document.getElementById("miId").value = m ? m.id : "";
  document.getElementById("miStockItemId").value = (m && m.stockItemId) || "";
  if (m) {
    document.getElementById("miName").value = m.name; document.getElementById("miCategory").value = m.category;
    document.getElementById("miPrice").value = m.price; document.getElementById("miDescription").value = m.description || "";
  }
  const alreadyTracked = !!(m && m.stockItemId);
  document.getElementById("miStockLinkedNote").style.display = alreadyTracked ? "" : "none";
  document.getElementById("miStockNewFields").style.display = alreadyTracked ? "none" : "";
  document.getElementById("miTrackStock").checked = false;
  toggleMenuStockFields();
  refreshMenuTagOptions(m ? (m.tags || []) : []);
  document.getElementById("menuItemModal").style.display = "flex";
}
function closeMenuItemModal() { document.getElementById("menuItemModal").style.display = "none"; }
async function submitMenuItemForm(e) {
  e.preventDefault();
  const btn = document.getElementById("miSubmitBtn"); btn.disabled = true;
  try {
    const id = document.getElementById("miId").value;
    const payload = { name: document.getElementById("miName").value, category: document.getElementById("miCategory").value,
      price: Number(document.getElementById("miPrice").value), description: document.getElementById("miDescription").value || undefined,
      tags: Array.from(document.getElementById("miTagsOptions").querySelectorAll("input:checked")).map((el) => el.value) };
    if (!id && document.getElementById("miTrackStock").checked) {
      payload.trackStock = true;
      payload.stockQuantity = Number(document.getElementById("miStockQuantity").value) || 0;
      payload.stockUnit = document.getElementById("miStockUnit").value || "unit";
      payload.stockLowStockThreshold = Number(document.getElementById("miStockLowThreshold").value) || 5;
    }
    if (id) { await managerApi.updateMenuItem(id, payload); showNotice("menuNotice", "Item updated.", "success"); }
    else { await managerApi.createMenuItem(payload); showNotice("menuNotice", "Item added.", "success"); }
    closeMenuItemModal(); refreshMenuTable();
  } catch (err) { showNotice("menuNotice", err.message); } finally { btn.disabled = false; }
}
async function toggleMenuItemAvailable(id, currentlyAvailable) {
  try { await managerApi.updateMenuItem(id, { isAvailable: !currentlyAvailable }); refreshMenuTable(); }
  catch (err) { showNotice("menuNotice", err.message); }
}

async function refreshTagsPage() {
  const container = document.getElementById("tagsGroups");

    const { tags } = await managerApi.listTags();

      .filter(([service]) => byService[service])

              </span>
            `).join("")}
          </div>
        </div>

async function createTagConfirm() {
  const name = document.getElementById("newTagName").value.trim();
  const service = document.getElementById("newTagService").value;
  if (!name) return showNotice("tagsNotice", "Enter a tag name first.");
  try {
    await managerApi.createTag(name, service);
    document.getElementById("newTagName").value = "";
    showNotice("tagsNotice", "Tag added.", "success");
    refreshTagsPage();
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

async function deleteTagConfirm(id) {
  if (!confirm("Delete this tag? Items that already used it keep the label — this only removes it from the picker for new ones.")) return;
  try {
    await managerApi.deleteTag(id);
    refreshTagsPage();
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

async function refreshBookingsTable() {

      <td>${b.status === "CHECKED_IN" ? `<button class="btn btn-sm btn-outline" onclick="openFolioModal('${b.id}')">Check out</button>`
        : NEXT_STATUS[b.status] ? `<button class="btn btn-sm btn-outline" onclick="advanceBooking('${b.id}','${NEXT_STATUS[b.status]}')">${NEXT_STATUS[b.status].replace("_"," ").toLowerCase()}</button>` : ""}

    `).join("") : `<tr><td colspan="5" class="empty-state">No bookings yet.</td></tr>`;
  } catch (err) { document.getElementById("bookingsBody").innerHTML = `<tr><td colspan="5" class="empty-state">${err.message}</td></tr>`; }
}
async function advanceBooking(id, status) {
  try { await managerApi.updateBookingStatus(id, status); refreshBookingsTable(); }
  catch (err) { showNotice("bookingsNotice", err.message); }
}

/* ============================================================
   FOLIO — the guest's running room-charge tab. Only relevant for a
   CHECKED_IN booking. Checkout is blocked server-side while a balance
   is outstanding, so this modal is the only path to checking someone
   out once they've charged anything to their room.
   ============================================================ */
async function openFolioModal(bookingId) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay"; overlay.id = "folioModal";
  overlay.innerHTML = `
    <div class="modal" style="max-width:600px;">
      <h3>Room folio</h3>
      <div id="folioModalNotice"></div>
      <div id="folioModalContent"><div class="loading-state">Loading…</div></div>
    </div>`;
  document.body.appendChild(overlay);
  await refreshFolioModal(bookingId);
}

async function refreshFolioModal(bookingId) {
  try {
    const { booking, charges, balance } = await managerApi.getFolio(bookingId);
    document.getElementById("folioModalContent").innerHTML = `
      <p style="color:var(--text-muted); font-size:0.86rem; margin-bottom:12px;">${booking.guestName} — Room ${booking.roomNumber}</p>
      ${charges.length ? `
        <table><thead><tr><th>Type</th><th>Placed</th><th style="text-align:right;">Amount</th></tr></thead>
          <tbody>${charges.map((c) => `<tr><td>${c.type.replace(/_/g, " ")}</td><td>${new Date(c.createdAt).toLocaleString()}</td><td style="text-align:right;">&#8358;${Number(c.totalAmount).toLocaleString()}</td></tr>`).join("")}</tbody>
        </table>
        <div class="summary-line total" style="margin-top:10px;"><span>Balance due</span><span>&#8358;${Number(balance).toLocaleString()}</span></div>
        <form id="folioSettleForm" style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
          <div class="form-field">
            <label>Settle by</label>
            <select id="folioMethod">
              <option value="CASH">Cash</option>
              <option value="CARD">Card</option>
              <option value="TRANSFER">Transfer</option>
              <option value="PAYSTACK">Paystack</option>
              <option value="STRIPE">Stripe</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="document.getElementById('folioModal').remove()">Close</button>
            <button type="submit" class="btn btn-primary" id="folioSettleBtn">Settle &amp; check out</button>
          </div>
        </form>
      ` : `
        <div class="empty-state">No room charges on this stay.</div>
        <div class="modal-actions" style="margin-top:14px;">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('folioModal').remove()">Close</button>
          <button type="button" class="btn btn-primary" onclick="checkOutFromFolio('${bookingId}')">Check out</button>
        </div>
      `}
    `;
    if (charges.length) {
      document.getElementById("folioSettleForm").addEventListener("submit", (e) => { e.preventDefault(); settleFolioAndCheckOut(bookingId); });
    }
  } catch (err) {
    document.getElementById("folioModalContent").innerHTML = `<div class="notice error">${err.message}</div>`;
  }
}

async function settleFolioAndCheckOut(bookingId) {
  const btn = document.getElementById("folioSettleBtn");
  const method = document.getElementById("folioMethod").value;
  if (btn) { btn.disabled = true; btn.textContent = "Settling…"; }
  try {
    await managerApi.settleFolio(bookingId, method);
    await managerApi.updateBookingStatus(bookingId, "CHECKED_OUT");
    document.getElementById("folioModal").remove();
    showNotice("bookingsNotice", "Folio settled and guest checked out.", "success");
    refreshBookingsTable();
  } catch (err) {
    document.getElementById("folioModalNotice").innerHTML = `<div class="notice error">${err.message}</div>`;
    if (btn) { btn.disabled = false; btn.textContent = "Settle & check out"; }
  }
}

async function checkOutFromFolio(bookingId) {
  try {
    await managerApi.updateBookingStatus(bookingId, "CHECKED_OUT");
    document.getElementById("folioModal").remove();
    showNotice("bookingsNotice", "Guest checked out.", "success");
    refreshBookingsTable();
  } catch (err) {
    document.getElementById("folioModalNotice").innerHTML = `<div class="notice error">${err.message}</div>`;
  }
}

async function refreshTicketsTable() {
  try {

    document.getElementById("ticketsBody").innerHTML = tickets.length ? tickets.map((t) => `
      <tr><td>${t.subject}</td><td>${t.guest.name}</td><td>${t.priority}</td>
      <td>${(t.assignedManager || t.assignedStaffMember) ? (t.assignedManager || t.assignedStaffMember).name : "—"}</td><td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td>

    `).join("") : `<tr><td colspan="6" class="empty-state">No tickets yet.</td></tr>`;

    const openCount = tickets.filter((t) => ["OPEN", "IN_PROGRESS"].includes(t.status)).length;
    const bellBadge = document.getElementById("ticketsBellBadge");
    const navBadge = document.getElementById("ticketsNavBadge");
    [bellBadge, navBadge].forEach((el) => { if (!el) return; el.textContent = openCount; el.style.display = openCount ? "flex" : "none"; el.classList.toggle("visible", openCount > 0); });
  } catch (err) { document.getElementById("ticketsBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`; }
}

async function resolveTicketRow(id) { try { await managerApi.resolveTicket(id); refreshTicketsTable(); } catch (err) { showNotice("ticketsNotice", err.message); } }

async function loadGuestLookupPage() {
  const container = document.getElementById("pageContent");

      </div>
    </div>
    <div class="panel" id="guestLookupResults"><div class="empty-state">Start typing to search.</div></div>
  `;
}
let _glTimer = null;
function debouncedGuestLookup() {
  clearTimeout(_glTimer);
  _glTimer = setTimeout(runGuestLookup, 350);
}
async function runGuestLookup() {
  const query = document.getElementById("glQuery").value.trim();
  const results = document.getElementById("guestLookupResults");
  if (query.length < 2) { results.innerHTML = `<div class="empty-state">Start typing to search.</div>`; return; }
  results.innerHTML = `<div class="loading-state">Searching…</div>`;
  try {
    const { results: matches } = await managerApi.guestLookup(query);
    window._glMatches = matches;
    results.innerHTML = matches.length ? matches.map((m, i) => `
      <div class="panel" style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <div>
            <b>${m.guestName}</b>
            <span class="badge" style="margin-left:8px;">${m.guestTier}</span>
            <div class="muted" style="font-size:0.82rem;">${m.guestPhone || "—"} ${m.guestEmail ? `· ${m.guestEmail}` : ""}</div>
          </div>
          <div style="text-align:right;">
            <span class="badge badge-${(m.status || "").toLowerCase()}">${m.status}</span>
            <div class="muted" style="font-size:0.82rem;">Room ${m.roomNumber} · ${(m.checkIn||"").slice(0,10)} &rarr; ${(m.checkOut||"").slice(0,10)}</div>
          </div>
        </div>
        ${(m.preferences && Object.keys(m.preferences).length) ? `
          <div style="margin-top:10px;"><b style="font-size:0.82rem;">Preferences:</b> ${Object.entries(m.preferences).map(([k,v]) => `${k}: ${v}`).join(", ")}</div>
        ` : ""}
        ${m.dietaryNotes ? `<div style="margin-top:4px;"><b style="font-size:0.82rem;">Dietary:</b> ${m.dietaryNotes}</div>` : ""}
        ${m.standingSpecialRequests ? `<div style="margin-top:4px;"><b style="font-size:0.82rem;">Standing notes:</b> ${m.standingSpecialRequests}</div>` : ""}
        ${m.thisStayRequests ? `<div style="margin-top:4px;"><b style="font-size:0.82rem;">This stay:</b> ${m.thisStayRequests}</div>` : ""}
        <div style="margin-top:10px; display:flex; align-items:center; gap:8px;">
          <span class="muted" style="font-size:0.82rem;">${m.loyaltyPoints} points available</span>
          <button class="btn btn-sm btn-outline" onclick="openLoyaltyAdjustModal(${i})">Adjust points</button>
        </div>
      </div>
    `).join("") : `<div class="empty-state">No matching active or upcoming stays.</div>`;
  } catch (err) { results.innerHTML = `<div class="empty-state">${err.message}</div>`; }
}

function openLoyaltyAdjustModal(index) {
  const m = window._glMatches[index];
  const points = prompt(`Adjust loyalty points for ${m.guestName}\n\nCurrent balance: ${m.loyaltyPoints}\n\nEnter points to add (e.g. 500) or remove (e.g. -200):`);
  if (points === null) return;
  const amount = parseInt(points, 10);
  if (!amount || Number.isNaN(amount)) { showNotice("guestLookupNotice", "Enter a non-zero whole number."); return; }
  const reason = prompt("Reason for this adjustment (required, shown in the guest's loyalty history):");
  if (!reason || !reason.trim()) { showNotice("guestLookupNotice", "A reason is required."); return; }

  managerApi.adjustLoyalty({ guestId: m.guestId, points: amount, reason: reason.trim() })
    .then(() => { showNotice("guestLookupNotice", "Loyalty balance updated.", "success"); runGuestLookup(); })
    .catch((err) => showNotice("guestLookupNotice", err.message));
}

function renderSecurityModalShell() {

      <div class="modal">
        <h3>Security</h3>
        <div id="securityNotice"></div>
        <div id="securityBody"></div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeSecurityModal()">Close</button></div>
      </div>
    </div>
    <div class="modal-overlay" id="enable2FAModal" style="display:none;">
      <div class="modal">
        <h3>Turn on two-factor authentication</h3>
        <div id="enable2FAStep1">
          <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">Scan this with your authenticator app, then enter the code it shows.</p>
          <div id="qrCodeContainer" style="text-align:center; margin-bottom:16px;"></div>
          <div class="form-field"><label>6-digit code</label><input type="text" id="enable2FACode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="closeTwoFactorModal('enable2FAModal')">Cancel</button>
            <button type="button" class="btn btn-primary" id="enable2FASubmitBtn" onclick="submitEnableTwoFactor()">Verify & enable</button>
          </div>
        </div>
        <div id="enable2FAStep2" style="display:none;">
          <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:10px;">2FA is on. Save these backup codes somewhere safe — each works once. <strong>They won't be shown again.</strong></p>
          <div id="backupCodesList" style="background:var(--ivory); padding:14px 18px; border-radius:6px; font-family:monospace; font-size:0.9rem; line-height:1.9;"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-primary" onclick="closeTwoFactorModal('enable2FAModal'); renderSecurityBody();">Done</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="disable2FAModal" style="display:none;">
      <div class="modal">
        <h3>Turn off two-factor authentication</h3>
        <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">Confirm your password to turn off 2FA.</p>
        <div class="form-field"><label>Password</label><input type="password" id="disable2FAPassword"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeTwoFactorModal('disable2FAModal')">Cancel</button>
          <button type="button" class="btn btn-danger" id="disable2FASubmitBtn" onclick="submitDisableTwoFactor()">Turn off 2FA</button>
        </div>
      </div>
    </div>
  `);
}

function openSecurityModal() {
  renderSecurityModalShell();
  renderSecurityBody();
  document.getElementById("securityModal").style.display = "flex";
}
function closeSecurityModal() { document.getElementById("securityModal").style.display = "none"; }
function closeTwoFactorModal(id) { document.getElementById(id).style.display = "none"; }

function renderSecurityBody() {
  const staff = getStaff();
  const enabled = !!staff.twoFactorEnabled;
  document.getElementById("securityBody").innerHTML = enabled ? `
    <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">
      <span class="badge badge-active">Enabled</span> Your account requires a code from your authenticator app at every login.
    </p>
    <button class="btn btn-outline" onclick="openDisable2FAModal()">Turn off 2FA</button>
  ` : `
    <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:14px;">
      <span class="badge badge-inactive">Disabled</span> Add a second step at login using an authenticator app.
    </p>
    <button class="btn btn-primary" onclick="startTwoFactorSetup()">Turn on 2FA</button>
  `;
}

async function startTwoFactorSetup() {
  try {
    const { qrCodeDataUrl } = await managerApi.setupTwoFactor();
    document.getElementById("qrCodeContainer").innerHTML = `<img src="${qrCodeDataUrl}" alt="2FA QR code" style="width:200px; height:200px;">`;
    document.getElementById("enable2FAStep1").style.display = "";
    document.getElementById("enable2FAStep2").style.display = "none";
    document.getElementById("enable2FAModal").style.display = "flex";
  } catch (err) { showNotice("securityNotice", err.message); }
}
async function submitEnableTwoFactor() {
  const btn = document.getElementById("enable2FASubmitBtn"); btn.disabled = true;
  try {
    const { backupCodes } = await managerApi.enableTwoFactor(document.getElementById("enable2FACode").value.trim());
    document.getElementById("backupCodesList").innerHTML = backupCodes.map((c) => `<div>${c}</div>`).join("");
    document.getElementById("enable2FAStep1").style.display = "none";
    document.getElementById("enable2FAStep2").style.display = "";
    const staff = getStaff(); staff.twoFactorEnabled = true; setSession(getToken(), staff);
  } catch (err) { showNotice("securityNotice", err.message); } finally { btn.disabled = false; }
}
function openDisable2FAModal() { document.getElementById("disable2FAPassword").value = ""; document.getElementById("disable2FAModal").style.display = "flex"; }
async function submitDisableTwoFactor() {
  const btn = document.getElementById("disable2FASubmitBtn"); btn.disabled = true;
  try {
    await managerApi.disableTwoFactor(document.getElementById("disable2FAPassword").value);
    closeTwoFactorModal("disable2FAModal");
    const staff = getStaff(); staff.twoFactorEnabled = false; setSession(getToken(), staff);
    renderSecurityBody();
    showNotice("securityNotice", "2FA turned off.", "success");
  } catch (err) { showNotice("securityNotice", err.message); } finally { btn.disabled = false; }
}

async function refreshBlogTable() {
  try {

        <td>${p.title}</td>

function openBlogModal(post) {
  document.getElementById("blogModalTitle").textContent = post ? "Edit post" : "Write a post";
  document.getElementById("blogForm").reset();
  document.getElementById("bpId").value = post ? post.id : "";
  if (post) {
    document.getElementById("bpTitle").value = post.title;
    document.getElementById("bpExcerpt").value = post.excerpt || "";
    document.getElementById("bpContent").value = post.content;
    document.getElementById("bpCoverImageUrl").value = post.coverImageUrl || "";
    document.getElementById("bpTags").value = (post.tags || []).join(", ");
    document.getElementById("bpAutoNewsletter").checked = post.autoNewsletter;
    const publishBtn = document.getElementById("bpPublishBtn");
    if (post.status === "PUBLISHED") { publishBtn.textContent = "Save changes"; document.getElementById("bpDraftBtn").style.display = "none"; }
    else { publishBtn.textContent = "Publish"; document.getElementById("bpDraftBtn").style.display = ""; }
  } else {
    document.getElementById("bpPublishBtn").textContent = "Publish";
    document.getElementById("bpDraftBtn").style.display = "";
  }
  document.getElementById("blogModal").style.display = "flex";
}
function closeBlogModal() { document.getElementById("blogModal").style.display = "none"; }
async function submitBlogForm(publish) {
  const id = document.getElementById("bpId").value;
  const tags = document.getElementById("bpTags").value.split(",").map((t) => t.trim()).filter(Boolean);
  const payload = {
    title: document.getElementById("bpTitle").value,
    excerpt: document.getElementById("bpExcerpt").value || undefined,
    content: document.getElementById("bpContent").value,
    coverImageUrl: document.getElementById("bpCoverImageUrl").value || undefined,
    tags,
    autoNewsletter: document.getElementById("bpAutoNewsletter").checked,
  };
  const isEditingPublished = id && document.getElementById("bpPublishBtn").textContent === "Save changes";
  if (publish || isEditingPublished) payload.status = "PUBLISHED";

  const btn = publish ? document.getElementById("bpPublishBtn") : document.getElementById("bpDraftBtn");
  btn.disabled = true;
  try {
    if (id) await managerApi.updateBlogPost(id, payload); else await managerApi.createBlogPost(payload);
    closeBlogModal(); showNotice("blogNotice", publish ? "Published." : "Draft saved.", "success"); refreshBlogTable();
  } catch (err) { showNotice("blogNotice", err.message); } finally { btn.disabled = false; }
}
async function deleteBlogPostRow(id) {
  if (!confirm("Delete this post?")) return;
  try { await managerApi.deleteBlogPost(id); refreshBlogTable(); } catch (err) { showNotice("blogNotice", err.message); }
}

function showNotice(containerId, message, type = "error") {
  const el = document.getElementById(containerId); if (!el) return;
  el.innerHTML = `<div class="notice ${type}">${message}</div>`;
  setTimeout(() => { if (el) el.innerHTML = ""; }, 4000);
}

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  renderSidebar(); switchPage("dashboard"); refreshTicketsBadgeSilently();
}
async function refreshTicketsBadgeSilently() {
  if (!hasPermission("handle_tickets")) return;
  try {
    const { tickets } = await managerApi.listTickets("OPEN");
    const badge = document.getElementById("ticketsBellBadge");
    if (badge) { badge.textContent = tickets.length; badge.style.display = tickets.length ? "flex" : "none"; }
  } catch { /* silent — background badge refresh */ }
}
let _pendingTempToken = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const notice = document.getElementById("loginNotice");
  notice.innerHTML = ""; btn.disabled = true; btn.textContent = "Logging in…";
  try {
    const result = await managerApi.login(document.getElementById("loginEmail").value, document.getElementById("loginPassword").value);
    if (result.requires2FA) {
      _pendingTempToken = result.tempToken;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("twoFactorForm").style.display = "block";
      document.getElementById("twoFactorCode").focus();
      return;
    }
    setSession(result.token, result.staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Log in"; }
});

document.getElementById("twoFactorForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("twoFactorBtn");
  const notice = document.getElementById("loginNotice");
  notice.innerHTML = ""; btn.disabled = true; btn.textContent = "Verifying…";
  try {
    const result = await managerApi.verifyTwoFactor(_pendingTempToken, document.getElementById("twoFactorCode").value.trim());
    _pendingTempToken = null;
    setSession(result.token, result.staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Verify"; }
});

document.getElementById("twoFactorBackBtn").addEventListener("click", () => {
  _pendingTempToken = null;
  document.getElementById("twoFactorForm").style.display = "none";
  document.getElementById("twoFactorForm").reset();
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("loginNotice").innerHTML = "";
});

document.getElementById("logoutBtn").addEventListener("click", () => { clearSession(); showLogin(); });
document.getElementById("hamburgerBtn").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("ticketsBellBtn").addEventListener("click", () => switchPage("tickets"));

// Boot
if (getToken() && getStaff()) { showApp(); } else { showLogin(); }
</script>
<script>
/* ============================================================
   Uyeh HOTEL · MANAGER PANEL — CAPABILITY EXPANSION LAYER
   Adds full coverage of the branch-scoped /api/manager surface:
   front desk (check-in / check-out / assign / transfer / refund /
   invoice), housekeeping board & tasks, maintenance work orders,
   rates & channel mapping, spa scheduling & resources, stock
   transfers & purchase-order receiving, order desk (lines, void,
   split, close, reopen, walk-in orders), invoices & refunds,
   roster & departments, event attendees & ticket scanning, and the
   full report/export set.

   Director-only actions are deliberately absent:
     · PATCH /manager/transactions/:id/refund   (Director only)
     · upcoming-event approval / rejection      (Director only)
     · newsletter sending                       (Director only)
     · staff activation/deactivation            (Director only)
     · brand / payout / policy branch fields    (Director only)
   Every call below is branch-scoped server-side; this panel never
   sends a branchId of its own.
   ============================================================ */

/* ---------- permission-aware visibility ---------- */
// Managers pass every requireBranchAccess() check server-side, so they see
// everything for their own branch. Staff-type sessions are filtered by their
// granted permission list so nothing is shown that would 403.
function hasPermission(perm) {
  const s = getStaff();
  if (!s) return false;
  const role = String(s.type || s.role || "").toUpperCase();
  if (role === "MANAGER" || role === "DIRECTOR") return true;
  if (!perm) return true;
  return Array.isArray(s.permissions) && s.permissions.includes(perm);
}

/* ---------- shared helpers for the new pages ---------- */
function mp8Esc(v) { return String(v == null ? "" : v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function mp8Money(n, cur) { if (n == null || n === "") return "—"; return `${cur || "NGN"} ${Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function mp8Date(iso) { return iso ? new Date(iso).toLocaleDateString() : "—"; }
function mp8DateTime(iso) { return iso ? new Date(iso).toLocaleString() : "—"; }
function mp8Today(offsetDays = 0) { const d = new Date(); d.setDate(d.getDate() + offsetDays); return d.toISOString().slice(0, 10); }
function mp8Badge(v) { return `<span class="badge badge-${String(v || "").toLowerCase()}">${mp8Esc(String(v || "—").replace(/_/g, " ").toLowerCase())}</span>`; }
function mp8Options(list, selected) { return list.map((v) => `<option value="${v}"${v === selected ? " selected" : ""}>${mp8Esc(String(v).replace(/_/g, " "))}</option>`).join(""); }

function mp8CloseModal() { const el = document.getElementById("mp8Modal"); if (el) el.remove(); }
function mp8OpenModal(title, bodyHtml, actionsHtml, width = 560) {
  mp8CloseModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay"; overlay.id = "mp8Modal";
  overlay.innerHTML = `
    <div class="modal" style="max-width:${width}px;">
      <div class="modal-header"><h3>${mp8Esc(title)}</h3><button class="modal-close" onclick="mp8CloseModal()">&times;</button></div>
      <div id="mp8ModalNotice"></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-actions">${actionsHtml || `<button class="btn btn-outline" onclick="mp8CloseModal()">Close</button>`}</div>
    </div>`;
  overlay.addEventListener("click", (e) => { if (e.target === overlay) mp8CloseModal(); });
  document.body.appendChild(overlay);
}
function mp8ModalNotice(message, type = "error") {
  const el = document.getElementById("mp8ModalNotice");
  if (el) el.innerHTML = `<div class="notice ${type}" style="margin:0 20px;">${mp8Esc(message)}</div>`;
}
function mp8Val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }
function mp8Checked(id) { const el = document.getElementById(id); return !!(el && el.checked); }
function mp8Notice(containerId, message, type = "error") { showNotice(containerId, mp8Esc(message), type); }
function mp8Empty(colspan, text) { return `<tr><td colspan="${colspan}"><div class="empty-state">${mp8Esc(text)}</div></td></tr>`; }
function mp8Error(container, err) {
  document.getElementById(container).innerHTML = `<div class="notice error">${mp8Esc(err.message || "Something went wrong")}</div>`;
}

/* ============================================================
   FRONT DESK — arrivals, in-house, departures, and the full
   check-in / check-out / assign / transfer / refund / invoice set
   ============================================================ */
let _fdBookings = [];
let _fdRooms = [];

async function loadFrontDeskPage() {
  document.getElementById("pageContent").innerHTML = `
    ${pageHeader("Front Desk", "Arrivals, in-house guests and departures for your branch")}
    <div class="panel">
      <div class="panel-header">
        <div class="tabs" id="fdTabs">
          <button class="tab active" data-fd="ARRIVALS" onclick="fdSwitchTab('ARRIVALS', this)">Arrivals</button>
          <button class="tab" data-fd="INHOUSE" onclick="fdSwitchTab('INHOUSE', this)">In-house</button>
          <button class="tab" data-fd="DEPARTURES" onclick="fdSwitchTab('DEPARTURES', this)">Departures</button>
          <button class="tab" data-fd="ALL" onclick="fdSwitchTab('ALL', this)">All bookings</button>
        </div>
        <button class="btn btn-outline btn-sm" onclick="fdRefresh()"><i class="fas fa-rotate"></i> Refresh</button>
      </div>
      <div id="fdNotice"></div>
      <div id="fdTable"><div class="loading-state">Loading…</div></div>
    </div>`;
  await fdRefresh();
}
let _fdTab = "ARRIVALS";
function fdSwitchTab(tab, btn) {
  _fdTab = tab;
  document.querySelectorAll("#fdTabs .tab").forEach((b) => b.classList.toggle("active", b === btn));
  fdRender();
}
async function fdRefresh() {
  try {
    const [b, r] = await Promise.all([managerApi.listBookings(), managerApi.listRooms()]);
    _fdBookings = b.bookings || []; _fdRooms = r.rooms || [];
    fdRender();
  } catch (err) { mp8Error("fdTable", err); }
}
function fdRender() {
  const today = mp8Today();
  const rows = _fdBookings.filter((b) => {
    const ci = (b.checkIn || "").slice(0, 10), co = (b.checkOut || "").slice(0, 10);
    if (_fdTab === "ARRIVALS") return ci <= today && ["PENDING", "CONFIRMED"].includes(b.status);
    if (_fdTab === "INHOUSE") return b.status === "CHECKED_IN";
    if (_fdTab === "DEPARTURES") return b.status === "CHECKED_IN" && co <= today;
    return true;
  });
  document.getElementById("fdTable").innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Guest</th><th>Room</th><th>Stay</th><th>Status</th><th>Amount</th><th style="text-align:right;">Actions</th></tr></thead>
      <tbody>${rows.length ? rows.map((b) => {
        const canPay = hasPermission("manage_payments");
        const actions = [];
        actions.push(`<button class="btn btn-outline btn-sm" onclick="openFolioModal('${b.id}')">Folio</button>`);
        if (["PENDING", "CONFIRMED"].includes(b.status)) {
          actions.push(`<button class="btn btn-outline btn-sm" onclick="fdOpenAssignRoom('${b.id}')">Assign room</button>`);
          actions.push(`<button class="btn btn-primary btn-sm" onclick="fdOpenCheckIn('${b.id}')">Check in</button>`);
        }
        if (b.status === "CHECKED_IN") actions.push(`<button class="btn btn-primary btn-sm" onclick="fdOpenCheckOut('${b.id}')">Check out</button>`);
        if (["PENDING", "CONFIRMED"].includes(b.status)) actions.push(`<button class="btn btn-outline btn-sm" onclick="fdOpenTransfer('${b.id}')">Transfer</button>`);
        if (canPay) {
          actions.push(`<button class="btn btn-outline btn-sm" onclick="fdOpenRefund('${b.id}')">Refund</button>`);
          actions.push(`<button class="btn btn-outline btn-sm" onclick="fdOpenInvoice('${b.id}')">Invoice</button>`);
        }
        if (["PENDING", "CONFIRMED"].includes(b.status)) actions.push(`<button class="btn btn-outline btn-sm" onclick="fdMarkNoShow('${b.id}')">No-show</button>`);
        return `<tr>
          <td><b>${mp8Esc(b.guest?.name || "—")}</b><div class="cell-sub">${mp8Esc(b.guest?.email || "")}${b.guestTier ? ` · ${mp8Esc(b.guestTier)}` : ""}</div></td>
          <td>${mp8Esc(b.room?.roomNumber || "unassigned")}<div class="cell-sub">${mp8Esc(b.room?.name || "")}</div></td>
          <td>${mp8Date(b.checkIn)} → ${mp8Date(b.checkOut)}</td>
          <td>${mp8Badge(b.status)}</td>
          <td>${mp8Money(b.totalAmount, b.currency)}</td>
          <td style="text-align:right;"><div class="row-actions">${actions.join("")}</div></td>
        </tr>`;
      }).join("") : mp8Empty(6, "Nothing in this list right now.")}</tbody>
    </table></div>`;
}
function fdBooking(id) { return _fdBookings.find((b) => b.id === id) || {}; }
function fdRoomOptions(selected) {
  return `<option value="">Auto-assign / keep current</option>` + _fdRooms
    .filter((r) => r.status === "ACTIVE")
    .map((r) => `<option value="${r.id}"${r.id === selected ? " selected" : ""}>${mp8Esc(r.roomNumber)} — ${mp8Esc(r.name)} (${mp8Esc(String(r.housekeepingStatus || "").toLowerCase())})</option>`).join("");
}

async function fdCheckInConfirm(id) {
  const payload = {
    registration: { fullName: mp8Val("ciName"), idType: mp8Val("ciIdType"), idNumber: mp8Val("ciIdNumber") },
    overrideHousekeeping: mp8Checked("ciOverrideHK"),
  };
  if (!payload.registration.fullName || !payload.registration.idNumber) return mp8ModalNotice("Guest name and ID number are required.");
  const roomId = mp8Val("ciRoom"); if (roomId) payload.roomId = roomId;
  const depositAmount = mp8Val("ciDepositAmount");
  if (depositAmount) payload.deposit = { amount: Number(depositAmount), method: mp8Val("ciDepositMethod") || "CASH", reference: mp8Val("ciDepositRef") || undefined };
  const fee = mp8Val("ciEarlyFee"); if (fee) payload.earlyCheckInFee = Number(fee);
  const keys = mp8Val("ciKeys");
  if (keys) payload.keys = keys.split(",").map((k) => ({ label: k.trim(), issuedTo: payload.registration.fullName })).filter((k) => k.label);
  try { await managerApi.checkInBooking(id, payload); mp8CloseModal(); await fdRefresh(); mp8Notice("fdNotice", "Guest checked in.", "success"); }
  catch (err) { mp8ModalNotice(err.message); }
}

    mp8Notice("fdNotice", res.invoice ? "Checked out — folio invoice raised." : "Guest checked out.", "success");

async function fdRefundConfirm(id) {
  const amount = Number(mp8Val("rfAmount")), reason = mp8Val("rfReason");
  if (!(amount > 0)) return mp8ModalNotice("Enter an amount greater than zero.");

    mp8CloseModal(); await fdRefresh();
    mp8Notice("fdNotice", `Refund recorded. Remaining refundable: ${mp8Money(res.remainingRefundable)}`, "success");

async function fdMarkNoShow(id) {

// The bookings list must never push a stay straight into CHECKED_IN/CHECKED_OUT —
// arrivals and departures have their own guarded process flows.
async function advanceBooking(id, status) {
  if (status === "CHECKED_IN" || status === "CHECKED_OUT") {
    if (!_fdBookings.length) { try { _fdBookings = (await managerApi.listBookings()).bookings || []; _fdRooms = (await managerApi.listRooms()).rooms || []; } catch { /* modal still opens */ } }
    return status === "CHECKED_IN" ? fdOpenCheckIn(id) : fdOpenCheckOut(id);
  }
  try { await managerApi.updateBookingStatus(id, status); if (typeof refreshBookingsTable === "function") refreshBookingsTable(); }

    payload.guest = { name, email };
  }
  const roomId = mp8Val("noRoom"); if (roomId) payload.roomId = roomId;
  const promo = mp8Val("noPromo"); if (promo) payload.promoCode = promo;
  if (type === "SPA") {
