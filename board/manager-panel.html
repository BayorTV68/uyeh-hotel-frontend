        <thead><tr><th>Date</th><th>Occupancy</th><th>Rooms sold</th><th>Revenue</th></tr></thead>
        <tbody>${r.days.map((d) => `<tr><td>${mp8Date(d.date)}</td><td>${d.occupancyPercent != null ? `${d.occupancyPercent}%` : "—"}</td><td>${d.roomsSold ?? "—"}</td><td>${mp8Money(d.revenue)}</td></tr>`).join("")}</tbody>
      </table></div>` : ""}`;
  } catch (err) { mp8Error("perfBody", err); }
}
async function loadFoodCostPage() {
  document.getElementById("pageContent").innerHTML = `
    ${pageHeader("Food Cost", "What the kitchen consumed against what it sold")}
    <div class="panel">
      <div class="panel-header">
        <div class="form-row" style="margin:0;">
          <div class="form-field"><label>From</label><input id="fcFrom" type="date" value="${mp8Today(-30)}" /></div>
          <div class="form-field"><label>To</label><input id="fcTo" type="date" value="${mp8Today()}" /></div>
          <div class="form-field" style="align-self:end;"><button class="btn btn-primary" onclick="fcRefresh()">Run</button></div>
        </div>
      </div>
      <div id="fcBody"><div class="loading-state">Loading…</div></div>
    </div>`;
  await fcRefresh();
}
async function fcRefresh() {
  const body = document.getElementById("fcBody");
  body.innerHTML = `<div class="loading-state">Loading…</div>`;
  try {
    const res = await managerApi.foodCostReport(mp8Val("fcFrom"), mp8Val("fcTo"));
    const r = res.report || res;
    const rows = r.items || r.lines || [];
    body.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Cost of goods</div><div class="stat-value">${mp8Money(r.costOfGoods ?? r.totalCost)}</div></div>
        <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value">${mp8Money(r.revenue ?? r.totalRevenue)}</div></div>
        <div class="stat-card"><div class="stat-label">Food cost</div><div class="stat-value">${r.foodCostPercent != null ? `${Number(r.foodCostPercent).toFixed(1)}%` : "—"}</div></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Item</th><th>Consumed</th><th>Cost</th><th>Revenue</th></tr></thead>
        <tbody>${rows.length ? rows.map((i) => `<tr><td>${mp8Esc(i.name || i.itemName || "—")}</td><td>${i.quantity ?? i.consumed ?? "—"}</td><td>${mp8Money(i.cost)}</td><td>${mp8Money(i.revenue)}</td></tr>`).join("") : mp8Empty(4, "Nothing consumed in this range.")}</tbody>
      </table></div>`;
  } catch (err) { mp8Error("fcBody", err); }
}
async function loadNightAuditPage() {
  document.getElementById("pageContent").innerHTML = `
    ${pageHeader("Night Audit", "The end-of-day position for your branch")}
    <div class="panel">
      <div class="panel-header"><input id="naDate" type="date" value="${mp8Today()}" onchange="naRefresh()" style="max-width:200px;" /></div>
      <div id="naBody"><div class="loading-state">Loading…</div></div>
    </div>`;
  await naRefresh();
}
async function naRefresh() {
  const body = document.getElementById("naBody");
  body.innerHTML = `<div class="loading-state">Loading…</div>`;
  try {
    const res = await managerApi.nightAuditReport(mp8Val("naDate"));
    const r = res.report || res;
    body.innerHTML = `
      <div class="stats-grid">${Object.entries(r).filter(([, v]) => typeof v === "number").map(([k, v]) => `
        <div class="stat-card"><div class="stat-label">${mp8Esc(k.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase()))}</div>
          <div class="stat-value">${/revenue|amount|cash|total|balance/i.test(k) ? mp8Money(v) : v}</div></div>`).join("")}</div>
      ${Array.isArray(r.discrepancies) && r.discrepancies.length ? `<div class="notice error">${r.discrepancies.map((d) => mp8Esc(typeof d === "string" ? d : JSON.stringify(d))).join("<br>")}</div>` : `<div class="notice success">No discrepancies flagged for this date.</div>`}`;
  } catch (err) { mp8Error("naBody", err); }
}
async function loadExportsPage() {
  document.getElementById("pageContent").innerHTML = `
    ${pageHeader("Exports", "Download branch data for bookings, performance and tax")}
    <div class="panel">
      <div class="form-row">
        <div class="form-field"><label>From</label><input id="exFrom" type="date" value="${mp8Today(-30)}" /></div>
        <div class="form-field"><label>To</label><input id="exTo" type="date" value="${mp8Today()}" /></div>
        <div class="form-field"><label>Format</label><select id="exFormat"><option value="csv">CSV</option><option value="xlsx">Excel</option></select></div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button class="btn btn-outline" onclick="exDownload('bookings')">Bookings</button>
        <button class="btn btn-outline" onclick="exDownload('performance')">Performance</button>
        <button class="btn btn-outline" onclick="exDownload('tax')">Tax</button>
      </div>
      <p class="form-hint">Very large ranges are capped by the system; narrow the dates if a download looks short.</p>
    </div>`;
}
function exDownload(kind) {
  const url = managerApi.exportUrl(kind, { from: mp8Val("exFrom"), to: mp8Val("exTo"), format: mp8Val("exFormat") });
  window.open(url, "_blank", "noopener");
}

/* ============================================================
   GROUP BOOKING DETAIL — status progression
   ============================================================ */
async function gbOpenDetail(id) {
  mp8OpenModal("Group booking", `<div class="loading-state">Loading…</div>`, "", 640);
  try {
    const res = await managerApi.getGroupBooking(id);
    const g = res.groupBooking || res.group || res;
    mp8OpenModal(`Group — ${g.groupName || ""}`, `
      <div class="summary-line"><span>Status</span><span>${mp8Badge(g.status)}</span></div>
      <div class="summary-line"><span>Stay</span><span>${mp8Date(g.checkIn)} → ${mp8Date(g.checkOut)}</span></div>
      <div class="summary-line"><span>Rooms</span><span>${g.rooms ?? (g.bookings || []).length}</span></div>
      <div class="summary-line"><span>Rooming list due</span><span>${mp8Date(g.roomingListDeadline)}</span></div>
      <div class="form-field" style="margin-top:14px;"><label>Move status to</label>
        <select id="gbStatus">${mp8Options(["PENDING", "CONFIRMED", "CHECKED_IN", "CHECKED_OUT", "CANCELLED"], g.status)}</select></div>`,
      `<button class="btn btn-outline" onclick="mp8CloseModal()">Close</button>
       <button class="btn btn-primary" onclick="gbSetStatus('${id}')">Save status</button>`, 640);
  } catch (err) { mp8ModalNotice(err.message); }
}
async function gbSetStatus(id) {
  try { await managerApi.updateGroupBookingStatus(id, mp8Val("gbStatus")); mp8CloseModal(); if (typeof loadGroupBookingsPage === "function") loadGroupBookingsPage(); }
  catch (err) { mp8ModalNotice(err.message); }
}

/* ============================================================
   NAV + ROUTER WIRING
   ============================================================ */
function mp8NavInsert(groupId, items, afterPage) {
  const group = NAV_GROUPS.find((g) => g.id === groupId);
  if (!group) { NAV_GROUPS.push({ id: groupId, label: groupId, icon: "fa-circle", items }); return; }
  const at = afterPage ? group.items.findIndex((i) => i.page === afterPage) + 1 : group.items.length;
  group.items.splice(at, 0, ...items);
}
mp8NavInsert("operations", [
  { page: "frontdesk", label: "Front Desk", icon: "fa-bell-concierge", permission: "manage_bookings" },
], undefined);
mp8NavInsert("operations", [
  { page: "hkboard", label: "Housekeeping Board", icon: "fa-clipboard-check", permission: "manage_rooms" },
  { page: "maintenance", label: "Maintenance", icon: "fa-screwdriver-wrench", permission: "manage_rooms" },
], "housekeeping");
mp8NavInsert("operations", [
  { page: "rates", label: "Rates & Channels", icon: "fa-calendar-days", permission: "manage_rooms" },
], "rooms");
mp8NavInsert("operations", [
  { page: "spaschedule", label: "Spa Schedule", icon: "fa-clock", permission: "manage_bookings" },
], "spa");
mp8NavInsert("operations", [
  { page: "orderdesk", label: "Order Desk", icon: "fa-cash-register", permission: "manage_orders" },
], "orders");
mp8NavInsert("operations", [
  { page: "stocklogistics", label: "Stock Movements", icon: "fa-truck-ramp-box", permission: "manage_stock" },
], "stock");
mp8NavInsert("operations", [
  { page: "ticketdesk", label: "Ticket Desk", icon: "fa-qrcode", permission: "manage_events" },
], "events");
mp8NavInsert("finance", [
  { page: "invoices", label: "Invoices", icon: "fa-file-invoice-dollar", permission: "manage_payments" },
  { page: "refunds", label: "Refunds", icon: "fa-rotate-left", permission: "manage_payments" },

mp8NavInsert("people", [

  { page: "departments", label: "Departments", icon: "fa-sitemap", permission: "manage_staff" },
]);
mp8NavInsert("reports", [
  { page: "performance", label: "Performance", icon: "fa-gauge-high", permission: "view_reports" },
  { page: "foodcost", label: "Food Cost", icon: "fa-carrot", permission: "view_reports" },
  { page: "nightaudit", label: "Night Audit", icon: "fa-moon", permission: "view_reports" },
  { page: "exports", label: "Exports", icon: "fa-file-export", permission: "view_reports" },
]);

Object.assign(PAGE_LOADERS, {
  frontdesk: loadFrontDeskPage,
  hkboard: loadHousekeepingBoardPage,
  maintenance: loadMaintenancePage,
  rates: loadRatesPage,
  spaschedule: loadSpaSchedulePage,
  orderdesk: loadOrderDeskPage,
  stocklogistics: loadStockLogisticsPage,
  ticketdesk: loadTicketScanPage,
  invoices: loadInvoicesPage,
  refunds: loadRefundsPage,
  roster: loadRosterPage,
  departments: loadDepartmentsPage,
  performance: loadPerformancePage,
  foodcost: loadFoodCostPage,
  nightaudit: loadNightAuditPage,
  exports: loadExportsPage,
});

// Sidebar, now permission-aware: a Manager sees the whole branch surface,
// a Staff-type session only what their granted permissions allow.
function renderSidebar() {
  const staff = getStaff();
  if (!staff) return;
  document.getElementById("adminAvatar").textContent = (staff.name || "?").charAt(0).toUpperCase();
  document.getElementById("adminName").textContent = staff.name || "";
  document.getElementById("adminRole").textContent = staff.roleTitle || staff.title || staff.role || staff.type || "";
  document.getElementById("adminBranch").textContent = staff.branchName || "";

  const groupsHtml = NAV_GROUPS.map((group) => {
    const visibleItems = group.items.filter((item) => hasPermission(item.permission));
    if (!visibleItems.length) return "";
    return `
      <div class="nav-group open" data-group="${group.id}">
        <div class="nav-group-header" onclick="toggleNavGroup(this)">
          <i class="fas ${group.icon} group-icon"></i>
          <span class="group-label">${group.label}</span>
          <i class="fas fa-chevron-down group-chevron"></i>
        </div>
        <div class="nav-group-body">
          ${visibleItems.map((item) => `
            <div class="nav-item" data-page="${item.page}" onclick="switchPage('${item.page}')">
              <i class="fas ${item.icon}"></i><span>${item.label}</span>
              ${item.badgeId ? `<span class="nav-badge" id="${item.badgeId}">0</span>` : ""}
            </div>
          `).join("")}
        </div>
      </div>`;
  }).join("");

  const settingsVisible = hasPermission("manage_settings");
  document.getElementById("navMenu").innerHTML = `
    <div class="nav-item-standalone active" data-page="dashboard" onclick="switchPage('dashboard')">
      <i class="fas fa-house"></i><span>Dashboard</span>
    </div>
    <div class="nav-divider"></div>
    ${groupsHtml}
    ${settingsVisible ? `
      <div class="nav-divider"></div>
      <div class="nav-item-standalone" data-page="branchprofile" onclick="switchPage('branchprofile')">
        <i class="fas fa-building"></i><span>Branch Profile</span>
      </div>
      <div class="nav-item-standalone" data-page="settings" onclick="switchPage('settings')">
        <i class="fas ${SETTINGS_ITEM.icon}"></i><span>${SETTINGS_ITEM.label}</span>
      </div>
    ` : ""}`;
}

// This layer loads after the original boot line, so re-render the shell for a
// session that was already restored from storage.
if (getToken() && getStaff()) { renderSidebar(); switchPage("dashboard"); }

</script>
