<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Oxygen Hotel</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ============================================================
   OXYGEN HOTEL — ADMIN DASHBOARD
   Single-file SPA: sidebar + topbar shell stay fixed, the page
   content area is swapped via JS (switchPage) using innerHTML,
   same pattern as the UYEH TECH admin dashboard — different theme.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Hotel theme — warm ivory/ink/brass, not UYEH TECH's dark/green */
  --ink:        #14181f;
  --ink-light:  #1c2230;
  --ivory:      #f6f1e7;
  --panel:      #ffffff;
  --border:     #e6e0d2;
  --border-soft: rgba(20,24,31,0.08);

  --brass:      #b98d45;
  --brass-dark: #96712f;
  --teal:       #2f5d5a;
  --danger:     #a3392a;
  --info:       #3b6ea5;

  --text-muted: #6b6355;
  --text-on-dark: #ede6d6;
  --text-on-dark-muted: rgba(237,230,214,0.6);

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --radius: 8px;
}

body {
  font-family: var(--font-body);
  background: var(--ivory);
  color: var(--ink);
  overflow-x: hidden;
  font-size: 14px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
a { color: inherit; }

/* ========== LOGIN SCREEN ========== */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
}
.login-card {
  background: var(--panel);
  padding: 48px 40px;
  border-radius: var(--radius);
  width: 100%;
  max-width: 380px;
}
.login-card .brand { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 6px; }
.login-card .brand span { color: var(--brass); }
.login-card p.sub { color: var(--text-muted); margin-bottom: 28px; font-size: 0.88rem; }

/* ========== SIDEBAR ========== */
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  height: 100vh;
  width: 270px;
  background: var(--ink);
  border-right: 1px solid rgba(237,230,214,0.08);
  padding: 26px 0;
  z-index: 1000;
  overflow-y: auto;
  transition: transform 0.3s ease;
}
.sidebar-header { padding: 0 26px 22px; border-bottom: 1px solid rgba(237,230,214,0.08); display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 42px; height: 42px; border-radius: 10px;
  background: linear-gradient(135deg, var(--brass-dark), var(--brass));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; color: var(--ink); font-size: 1.1rem;
}
.logo-text { font-family: var(--font-display); font-size: 1.2rem; color: var(--text-on-dark); }
.logo-text span { color: var(--brass); }

.admin-info { padding: 18px 26px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(237,230,214,0.08); }
.admin-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), #3d7873);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 600; font-size: 0.95rem; flex-shrink: 0;
}
.admin-details .admin-name { color: var(--text-on-dark); font-size: 0.88rem; font-weight: 600; }
.admin-details .admin-role { color: var(--brass); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1px; }
.admin-details .admin-branch { color: var(--text-on-dark-muted); font-size: 0.74rem; margin-top: 1px; }

.nav-menu { padding: 14px 0; }

.nav-item-standalone {
  padding: 11px 26px;
  display: flex; align-items: center; gap: 12px;
  color: var(--text-on-dark-muted);
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  font-size: 0.88rem; font-weight: 500;
}
.nav-item-standalone:hover { background: rgba(185,141,69,0.06); color: var(--text-on-dark); }
.nav-item-standalone.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item-standalone i { width: 18px; text-align: center; }

.nav-divider { height: 1px; background: rgba(237,230,214,0.08); margin: 10px 26px 10px; }

.nav-group { margin-bottom: 2px; }
.nav-group-header {
  padding: 10px 26px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none; transition: all 0.15s;
}
.nav-group-header:hover { background: rgba(255,255,255,0.02); }
.nav-group-header .group-icon { width: 18px; text-align: center; font-size: 0.85rem; color: rgba(185,141,69,0.6); }
.nav-group-header .group-label { flex: 1; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-on-dark-muted); }
.nav-group-header .group-chevron { font-size: 0.65rem; color: rgba(237,230,214,0.25); transition: transform 0.2s; }
.nav-group.open > .nav-group-header .group-chevron { transform: rotate(180deg); color: var(--brass); }
.nav-group.open > .nav-group-header .group-icon,
.nav-group.open > .nav-group-header .group-label { color: var(--brass); }

.nav-group-header .group-badge {
  font-size: 0.62rem; font-weight: 700; padding: 1px 6px; border-radius: 8px;
  background: rgba(163,57,42,0.25); color: #e08a7a; display: none;
}
.nav-group-header .group-badge.visible { display: inline-block; }

.nav-group-body { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
.nav-group.open > .nav-group-body { max-height: 600px; }

.nav-item {
  padding: 10px 26px 10px 50px; display: flex; align-items: center; gap: 11px;
  color: var(--text-on-dark-muted); cursor: pointer; border-left: 3px solid transparent;
  transition: all 0.15s; font-size: 0.84rem; font-weight: 500; position: relative;
}
.nav-item:hover { background: rgba(185,141,69,0.05); color: var(--text-on-dark); }
.nav-item.active { background: rgba(185,141,69,0.1); color: var(--brass); border-left-color: var(--brass); }
.nav-item i { width: 16px; text-align: center; font-size: 0.82rem; }
.nav-item .nav-badge {
  margin-left: auto; background: rgba(163,57,42,0.25); color: #e08a7a;
  padding: 1px 7px; border-radius: 9px; font-size: 0.64rem; font-weight: 700; display: none;
}
.nav-item .nav-badge.visible { display: inline-block; }

.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn { background: none; border: none; padding: 10px 16px; font-family: var(--font-body); font-size: 0.86rem; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--brass-dark); border-bottom-color: var(--brass); }

.sidebar-footer { padding: 16px 26px 0; margin-top: 12px; }
.logout-link { color: var(--text-on-dark-muted); font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.logout-link:hover { color: var(--text-on-dark); }

/* ========== MAIN CONTENT ========== */
.main-content { margin-left: 270px; min-height: 100vh; }

.topbar {
  background: rgba(246,241,231,0.94);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 16px 36px;
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 100; gap: 16px;
}
.hamburger-btn { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
.hamburger-btn span { width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }

.search-bar { flex: 1; max-width: 420px; position: relative; }
.search-bar input {
  width: 100%; padding: 10px 16px 10px 40px; background: #fff;
  border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.88rem; font-family: var(--font-body);
}
.search-bar input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
.search-bar i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }

.topbar-actions { display: flex; align-items: center; gap: 14px; }
.topbar-btn {
  width: 40px; height: 40px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--ink);
}
.topbar-btn:hover { border-color: var(--brass); }
.topbar-badge {
  position: absolute; top: -5px; right: -5px; background: var(--danger); color: #fff;
  width: 18px; height: 18px; border-radius: 50%; font-size: 0.64rem; display: flex; align-items: center; justify-content: center;
}

.content-area { padding: 36px 40px; max-width: 1200px; }

/* ========== PAGE HEADER ========== */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; flex-wrap: wrap; gap: 14px; }
.page-title { font-size: 1.55rem; }
.page-subtitle { color: var(--text-muted); margin-top: 4px; font-size: 0.9rem; }

/* ========== STATS ========== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 16px; margin-bottom: 30px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.stat-card b { display: block; font-family: var(--font-display); font-size: 1.65rem; margin-bottom: 4px; }
.stat-card span { color: var(--text-muted); font-size: 0.8rem; }

/* ========== PANELS / TABLES ========== */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 22px; }
.panel h3 { font-size: 1rem; margin-bottom: 14px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 11px 10px; font-size: 0.84rem; border-bottom: 1px solid var(--border); }
th { color: var(--text-muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
tr:last-child td { border-bottom: none; }

/* ========== BADGES ========== */
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
.offering-photo { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; cursor: pointer; background: #f0eee9; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s; }
.offering-photo:hover { border-color: var(--accent, #1F3A34); }
.offering-photo img { width: 100%; height: 100%; object-fit: cover; }
.offering-photo-placeholder { color: #999; font-size: 0.9rem; }
.badge-pending { background: rgba(185,141,69,0.15); color: var(--brass-dark); }
.badge-confirmed, .badge-active, .badge-resolved, .badge-successful { background: rgba(47,93,90,0.12); color: var(--teal); }
.badge-cancelled, .badge-inactive, .badge-failed, .badge-rejected { background: rgba(163,57,42,0.1); color: var(--danger); }
.badge-open, .badge-in_progress { background: rgba(185,141,69,0.15); color: var(--brass-dark); }
.badge-checked_in, .badge-checked_out { background: rgba(20,24,31,0.07); color: var(--ink); }

/* ========== BUTTONS / FORMS ========== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius); font-size: 0.86rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; font-family: var(--font-body); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: var(--ink-light); }
.btn-outline { border-color: var(--border); color: var(--ink); background: #fff; }
.btn-outline:hover { border-color: var(--ink); }
.btn-danger { background: rgba(163,57,42,0.08); color: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 0.78rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
.form-field label { font-size: 0.8rem; color: var(--text-muted); }
.form-field input, .form-field select, .form-field textarea {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--font-body); font-size: 0.87rem;
}
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }

/* ── Site Settings page ─────────────────────────────────────────── */
.ss-maint-card {
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  padding: 18px 24px; margin-bottom: 20px; border-radius: 10px;
  background: rgba(163,57,42,0.05); border: 1px solid rgba(163,57,42,0.2);
}
.ss-maint-card.is-off { background: rgba(20,24,31,0.03); border-color: var(--border); }
.ss-maint-card-title { font-weight: 700; font-size: 0.92rem; color: var(--danger); margin-bottom: 4px; }
.ss-maint-card.is-off .ss-maint-card-title { color: var(--text-muted); }
.ss-maint-card-status { font-size: 0.8rem; color: var(--text-muted); }

.ss-toggle-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 16px; border-radius: 8px; margin-bottom: 8px;
  background: rgba(20,24,31,0.02); border: 1px solid var(--border-soft);
}
.ss-toggle-label { font-weight: 600; font-size: 0.86rem; }
.ss-toggle-desc { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

.ss-banner-preview {
  border-radius: 8px; padding: 12px 16px; margin-top: 14px; font-size: 0.85rem; font-weight: 500;
  display: none; align-items: center; justify-content: space-between; gap: 10px;
}
.ss-banner-preview.show { display: flex; }
.ss-banner-preview.info { background: #eaf3f8; border: 1px solid #0096ff; color: #0c4a6e; }
.ss-banner-preview.success { background: #eaf7ef; border: 1px solid #2f5d5a; color: #1a3d3a; }
.ss-banner-preview.warning { background: #fbf3e4; border: 1px solid #b98d45; color: #6b4e1a; }
.ss-banner-preview.urgent { background: #fbeae7; border: 1px solid #a3392a; color: #7a2419; }

.ss-danger-zone { border: 1px solid rgba(163,57,42,0.25); border-radius: 10px; padding: 18px 20px; margin-top: 22px; background: rgba(163,57,42,0.02); }
.ss-danger-zone-hd { font-size: 0.72rem; font-weight: 700; color: var(--danger); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }

#siteSettingsSaveBar {
  position: sticky; bottom: 0; z-index: 20; display: none; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; padding: 14px 20px; margin-top: 20px;
  background: var(--ink); border-radius: 10px; box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
}
#siteSettingsSaveBar.show { display: flex; }
.ss-unsaved-badge { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-on-dark); font-weight: 600; }
.ss-unsaved-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brass); animation: ssPulse 1.5s ease infinite; }
@keyframes ssPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.notice { padding: 12px 16px; border-radius: var(--radius); font-size: 0.85rem; margin-bottom: 18px; }
.notice.success { background: rgba(47,93,90,0.1); color: var(--teal); }
.notice.error { background: rgba(163,57,42,0.08); color: var(--danger); }

.empty-state, .loading-state { padding: 32px; text-align: center; color: var(--text-muted); font-size: 0.89rem; }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,24,31,0.55); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.modal { background: #fff; border-radius: var(--radius); padding: 28px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
.modal h3 { margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }

.coming-soon { padding: 60px 20px; text-align: center; color: var(--text-muted); }
.coming-soon i { font-size: 2rem; color: var(--brass); margin-bottom: 14px; display: block; }

@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .hamburger-btn { display: flex; }
  .search-bar { display: none; }
}
</style>
</head>
<body>

<!-- ============================================================
     LOGIN SCREEN
     ============================================================ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand">Oxygen <span>Hotel</span></div>
    <p class="sub">Admin dashboard</p>
    <div id="loginNotice"></div>
    <form id="loginForm">
      <div class="form-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;" id="loginBtn">Log in</button>
    </form>

    <form id="twoFactorLoginForm" style="display:none;">
      <p class="sub" style="margin-top:0;">Enter the 6-digit code from your authenticator app, or one of your backup codes.</p>
      <div id="twoFactorLoginNotice"></div>
      <div class="form-field">
        <label for="twoFactorCode">Code</label>
        <input type="text" id="twoFactorCode" inputmode="numeric" autocomplete="one-time-code" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;" id="twoFactorLoginBtn">Verify</button>
      <button type="button" class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="cancelTwoFactorLogin()">Back to login</button>
    </form>
  </div>
</div>

<!-- ============================================================
     APP SHELL (hidden until logged in)
     ============================================================ -->
<div id="appShell" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">O</div>
      <div class="logo-text">Oxygen <span>Hotel</span></div>
    </div>

    <div class="admin-info">
      <div class="admin-avatar" id="adminAvatar">–</div>
      <div class="admin-details">
        <div class="admin-name" id="adminName">–</div>
        <div class="admin-role" id="adminRole">–</div>
        <div class="admin-branch" id="adminBranch"></div>
      </div>
    </div>

    <nav class="nav-menu" id="navMenu"><!-- rendered by renderSidebar() --></nav>

    <div class="sidebar-footer">
      <div class="logout-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Log out</div>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button class="hamburger-btn" id="hamburgerBtn"><span></span><span></span><span></span></button>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search…" id="globalSearch">
      </div>
      <div class="topbar-actions">
        <div class="topbar-btn" id="ticketsBellBtn" title="Open guest tickets">
          <i class="fas fa-bell"></i>
          <span class="topbar-badge" id="ticketsBellBadge" style="display:none;">0</span>
        </div>
      </div>
    </div>

    <div class="content-area" id="pageContent">
      <div class="loading-state">Loading…</div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   SESSION + API
   ------------------------------------------------------------
   Same contract documented previously: DIRECTOR (no branchId,
   sees everything) / MANAGER (has branchId, runs one branch) /
   STAFF (has branchId + freeform title). Endpoints marked NEW
   below don't exist on the backend yet — Branches, Company
   Overview, Stock, Events. Everything else (rooms, bookings,
   staff, tickets, settings) matches what's already built.
   ============================================================ */

const API_BASE = "https://uyeh-hotel-backend.onrender.com/api";

function getToken() { return localStorage.getItem("staff_token"); }
function getStaff() {
  try { return JSON.parse(localStorage.getItem("staff_info") || "null"); }
  catch { return null; }
}
function setSession(token, staff) {
  localStorage.setItem("staff_token", token);
  localStorage.setItem("staff_info", JSON.stringify(staff));
}
function clearSession() {
  localStorage.removeItem("staff_token");
  localStorage.removeItem("staff_info");
}
function isDirector() {
  const staff = getStaff();
  return !!staff && staff.type === "director";
}
function hasPermission(key) {
  const staff = getStaff();
  if (!staff) return false;
  if (staff.type === "director") return true;
  return (staff.permissions || []).includes(key);
}
function branchPath(path) {
  // Manager/Staff: branch comes from the JWT server-side, nothing to add.
  // Director: no branchId on their account — the caller must supply one
  // explicitly (see the branch-scoped methods below, which append
  // ?branchId= themselves rather than relying on this helper for writes).
  return `/manager${path}`;
}

async function adminRequest(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${getToken()}`,
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    clearSession();
    showLogin();
    throw new Error("Session expired");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

const adminApi = {
  setupTwoFactor: () => adminRequest("/auth/2fa/setup", { method: "POST" }),
  enableTwoFactor: (code) => adminRequest("/auth/2fa/enable", { method: "POST", body: JSON.stringify({ code }) }),
  disableTwoFactor: (password) => adminRequest("/auth/2fa/disable", { method: "POST", body: JSON.stringify({ password }) }),
  // Director only — Manager and Staff have their own dedicated panels now
  // (manager-panel.html, staff-panel.html). This panel intentionally never
  // attempts those login endpoints.
  login: async (email, password) => {
    const res = await fetch(`${API_BASE}/auth/director/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    // 2FA-enabled accounts get a tempToken instead of real tokens here —
    // the caller must finish the challenge via loginTwoFactor() below
    // before a session exists. Returning this instead of assuming every
    // 200 is a finished login is the fix — the old code silently stored
    // `undefined` as the session in this case.
    if (data.requires2FA) return { requires2FA: true, tempToken: data.tempToken };
    // data.director.type is now set by the backend itself (serializeAccount) —
    // no client-side guessing needed.
    return {
      token: data.token,
      refreshToken: data.refreshToken,
      staff: data.director,
    };
  },
  loginTwoFactor: async (tempToken, code) => {
    const res = await fetch(`${API_BASE}/auth/login/2fa`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tempToken, code }),
    });

    return { token: data.token, refreshToken: data.refreshToken, staff: data.director };

// Opens a fetched (authenticated) invoice in a new tab. Use this instead of
// a plain <a href> — see the Transactions page changes below.
async function viewInvoice(transactionId) {
  try {
    const html = await adminApi.fetchInvoiceHtml(transactionId);
    const win = window.open("", "_blank");
    win.document.write(html);
    win.document.close();
  } catch (err) {
    showNotice("transactionsNotice", "Couldn't open invoice: " + err.message);
  }
}

function renderSidebar() {
  const staff = getStaff();
  if (!staff) return;
  const director = staff.type === "director";

  document.getElementById("adminAvatar").textContent = staff.name.charAt(0).toUpperCase();
  document.getElementById("adminName").textContent = staff.name;
  document.getElementById("adminRole").textContent = director ? "Director" : (staff.roleTitle || staff.type);
  document.getElementById("adminBranch").textContent = director ? "All branches" : (staff.branchName || "");

  const groupsHtml = NAV_GROUPS.map((group) => {
    if (group.directorOnly && !director) return "";
    const visibleItems = group.items.filter((item) => {
      if (item.directorOnlyItem) return director;
      return director || !item.permission || (staff.permissions || []).includes(item.permission);
    });
    if (!visibleItems.length) return "";
    return `
      <div class="nav-group open" data-group="${group.id}">
        <div class="nav-group-header" onclick="toggleNavGroup(this)">
          <i class="fas ${group.icon} group-icon"></i>
          <span class="group-label">${group.label}</span>
          <i class="fas fa-chevron-down group-chevron"></i>
        </div>
        <div class="nav-group-body">
          ${visibleItems.map((item) => `
            <div class="nav-item" data-page="${item.page}" onclick="switchPage('${item.page}')">
              <i class="fas ${item.icon}"></i>
              <span>${item.label}</span>
              ${item.badgeId ? `<span class="nav-badge" id="${item.badgeId}">0</span>` : ""}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");

  const settingsVisible = director || (staff.permissions || []).includes(SETTINGS_ITEM.permission);

  document.getElementById("navMenu").innerHTML = `
    <div class="nav-item-standalone active" data-page="dashboard" onclick="switchPage('dashboard')">
      <i class="fas fa-house"></i><span>Dashboard</span>
    </div>
    <div class="nav-divider"></div>
    ${groupsHtml}
    ${(settingsVisible || director) ? `<div class="nav-divider"></div>` : ""}
    ${settingsVisible ? `
      <div class="nav-item-standalone" data-page="settings" onclick="switchPage('settings')">
        <i class="fas ${SETTINGS_ITEM.icon}"></i><span>${SETTINGS_ITEM.label}</span>
      </div>
    ` : ""}
    ${director ? `
      <div class="nav-item-standalone" data-page="sitesettings" onclick="switchPage('sitesettings')">
        <i class="fas ${SITE_SETTINGS_ITEM.icon}"></i><span>${SITE_SETTINGS_ITEM.label}</span>
      </div>
    ` : ""}
    <div class="nav-item-standalone" data-page="myaccount" onclick="switchPage('myaccount')">
      <i class="fas fa-shield-halved"></i><span>My Account</span>
    </div>
  `;
}

function toggleNavGroup(headerEl) {
  headerEl.parentElement.classList.toggle("open");
}

function setActiveNav(page) {
  document.querySelectorAll(".nav-item, .nav-item-standalone").forEach((el) => {
    el.classList.toggle("active", el.getAttribute("data-page") === page);
  });
}

function switchPage(page) {
  setActiveNav(page);
  const loader = PAGE_LOADERS[page];
  const container = document.getElementById("pageContent");
  if (!loader) {
    container.innerHTML = `<div class="empty-state">Unknown page.</div>`;
    return;
  }
  container.innerHTML = `<div class="loading-state">Loading…</div>`;
  loader();
  if (window.innerWidth <= 900) document.getElementById("sidebar").classList.remove("open");
}

async function loadBranchDashboard() {
  const staff = getStaff();
  const container = document.getElementById("pageContent");
  const cards = [];
  let bookingsPanel = "", ticketsPanel = "";

  try {
    if (hasPermission("manage_bookings")) {
      const { bookings } = await adminApi.listBookings();
      const upcoming = bookings.filter((b) => ["PENDING", "CONFIRMED"].includes(b.status));
      cards.push({ label: "Upcoming bookings", value: upcoming.length });
      if (bookings.length) {
        bookingsPanel = `
          <div class="panel"><h3>Recent bookings</h3>
            <table><thead><tr><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th></tr></thead>
              <tbody>${bookings.slice(0, 6).map((b) => `
                <tr><td>${b.guest.name}</td><td>${b.room.name} — ${b.room.roomNumber}</td>
                <td>${b.checkIn.slice(0,10)} → ${b.checkOut.slice(0,10)}</td>
                <td><span class="badge badge-${b.status.toLowerCase()}">${b.status}</span></td></tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_rooms")) {
      const { rooms } = await adminApi.listRooms();
      cards.push({ label: "Total rooms", value: rooms.length });
    }
    if (hasPermission("handle_tickets")) {
      const { tickets } = await adminApi.listTickets("OPEN");
      cards.push({ label: "Open tickets", value: tickets.length });
      if (tickets.length) {
        ticketsPanel = `
          <div class="panel"><h3>Open guest tickets</h3>
            <table><thead><tr><th>Subject</th><th>Guest</th><th>Priority</th><th>Status</th></tr></thead>
              <tbody>${tickets.slice(0, 6).map((t) => `
                <tr><td>${t.subject}</td><td>${t.guest.name}</td><td>${t.priority}</td>
                <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td></tr>
              `).join("")}</tbody>
            </table>
          </div>`;
      }
    }
    if (hasPermission("manage_staff")) {
      const { staff: staffList } = await adminApi.listStaff();
      cards.push({ label: "Branch staff", value: staffList.filter((s) => s.isActive).length });
    }

    container.innerHTML = `
      ${pageHeader("Overview", staff.branchName ? `What's happening at ${staff.branchName} right now.` : "A quick look at what's happening right now.")}
      <div class="stats-grid">
        ${cards.length ? cards.map((c) => `<div class="stat-card"><b>${c.value}</b><span>${c.label}</span></div>`).join("")

  }
}

async function refreshBranchesTable() {
  try {
    const { branches } = await adminApi.listBranches();
    const activeCount = branches.filter((b) => b.isActive).length;
    const totalRooms = branches.reduce((sum, b) => sum + (b.roomCount || 0), 0);
    const totalStaff = branches.reduce((sum, b) => sum + (b.staffCount || 0), 0);

    document.getElementById("branchStatCards").innerHTML = `
      <div class="stat-card"><b>${branches.length}</b><span>Total branches</span></div>
      <div class="stat-card"><b>${activeCount}</b><span>Active</span></div>
      <div class="stat-card"><b>${totalRooms}</b><span>Rooms company-wide</span></div>
      <div class="stat-card"><b>${totalStaff}</b><span>Staff company-wide</span></div>
    `;

    const body = document.getElementById("branchesBody");
    body.innerHTML = branches.length ? branches.map((b) => `
      <tr>
        <td><b>${b.name}</b></td>
        <td>${b.city}${b.state ? `, ${b.state}` : ""}</td>
        <td>${b.manager ? b.manager.name : `<span style="color:var(--text-muted);">Unassigned — appoint in Staff</span>`}</td>
        <td>${(b.services || []).map((s) => SERVICE_LABELS[s] || s).join(", ") || "—"}</td>
        <td><span class="badge badge-${b.isActive ? "active" : "inactive"}">${b.isActive ? "Active" : "Inactive"}</span>${b.paystackSubaccountCode ? ` <span class="badge badge-active" title="Payout account connected"><i class="fas fa-money-check"></i></span>` : ""}</td>
        <td>
          <button class="btn btn-sm btn-outline" onclick='openBranchModal(${JSON.stringify(b).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-outline" onclick='openPayoutModal(${JSON.stringify(b).replace(/'/g, "&#39;")})'>Payout</button>
          <button class="btn btn-sm btn-outline" onclick="toggleBranchActive('${b.id}', ${b.isActive})">${b.isActive ? "Deactivate" : "Activate"}</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No branches yet — open your first one above.</td></tr>`;
  } catch (err) {
    document.getElementById("branchesBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
  }
}

function openBranchModal(branch) {
  document.getElementById("branchModalTitle").textContent = branch ? "Edit branch" : "Open new branch";
  document.getElementById("branchForm").reset();
  document.getElementById("bId").value = branch ? branch.id : "";
  const slugField = document.getElementById("bSlug");
  if (branch) {
    document.getElementById("bName").value = branch.name;
    slugField.value = branch.slug || "";
    slugField.disabled = true; // slug is baked into existing booking links — don't let an edit silently break them
    document.getElementById("bCity").value = branch.city;
    document.getElementById("bState").value = branch.state || "";
    document.getElementById("bAddress").value = branch.address || "";
    document.getElementById("bPhone").value = branch.phone || "";
    document.getElementById("bEmail").value = branch.email || "";
    document.querySelectorAll("#bServices input").forEach((cb) => { cb.checked = (branch.services || []).includes(cb.value); });
  } else {
    slugField.disabled = false;
    slugField.value = "";
  }
  document.getElementById("branchModal").style.display = "flex";
}

let _poVerified = null;

async function openPayoutModal(branch) {
  document.getElementById("payoutForm").reset();
  document.getElementById("poBranchId").value = branch.id;
  document.getElementById("payoutBranchLabel").textContent = branch.name;
  document.getElementById("poVerifyResult").style.display = "none";
  document.getElementById("poSaveBtn").disabled = true;
  _poVerified = null;
  _stripeConnectBranchId = branch.id;

  const select = document.getElementById("poBankCode");
  select.innerHTML = `<option value="">Loading banks&hellip;</option>`;
  document.getElementById("payoutModal").style.display = "flex";
  refreshStripeStatus(branch.id);

  try {
    const { banks } = await adminApi.listPaystackBanks();
    select.innerHTML = `<option value="">Select a bank</option>` + banks.map((b) => `<option value="${b.code}">${b.name}</option>`).join("");
    if (branch.settlementBankCode) select.value = branch.settlementBankCode;
    if (branch.settlementAccountNumber) document.getElementById("poAccountNumber").value = branch.settlementAccountNumber;
  } catch (err) {
    select.innerHTML = `<option value="">Couldn't load banks</option>`;
    showNotice("payoutNotice", err.message);
  }
}
function closePayoutModal() { document.getElementById("payoutModal").style.display = "none"; }

let _stripeConnectBranchId = null;
async function refreshStripeStatus(branchId) {
  const block = document.getElementById("stripeStatusBlock");
  block.textContent = "Checking status…";
  try {
    const status = await adminApi.getStripeAccountStatus(branchId);
    if (!status.connected) {
      block.innerHTML = `<span class="badge badge-inactive">Not connected</span>`;
    } else if (status.chargesEnabled) {
      block.innerHTML = `<span class="badge badge-active">Connected — ready to accept payments</span>`;
    } else {
      block.innerHTML = `<span class="badge badge-warning">Connected — onboarding incomplete</span> <span class="muted" style="font-size:0.8rem;">Stripe needs more info before this account can accept live payments.</span>`;
    }
  } catch (err) {
    block.innerHTML = `<span class="muted">Couldn't check status — ${err.message}</span>`;
  }
}
async function connectStripeClick() {
  const email = document.getElementById("stripeConnectEmail").value;
  if (!email) return showNotice("payoutNotice", "Enter an email for the Stripe account first.");
  const btn = document.getElementById("stripeConnectBtn");
  btn.disabled = true;
  try {
    const { onboardingUrl } = await adminApi.connectStripeAccount(_stripeConnectBranchId, { email });
    // Onboarding happens on Stripe's own hosted page — this tab stays put,
    // a new one carries the Director through it, same pattern as opening
    // any external OAuth-style flow.
    window.open(onboardingUrl, "_blank");
    showNotice("payoutNotice", "Continue in the new tab — come back here and reopen this branch's Payout modal afterward to see the updated status.", "success");
  } catch (err) {
    showNotice("payoutNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function verifyPayoutAccountClick() {
  const bankCode = document.getElementById("poBankCode").value;
  const accountNumber = document.getElementById("poAccountNumber").value;
  if (!bankCode || !accountNumber) { showNotice("payoutNotice", "Choose a bank and enter the account number first."); return; }
  const btn = document.getElementById("poVerifyBtn");
  btn.disabled = true;
  try {
    const result = await adminApi.verifyPayoutAccount({ bankCode, accountNumber });
    _poVerified = result;
    document.getElementById("poVerifiedName").textContent = result.accountName;
    document.getElementById("poVerifyResult").style.display = "block";
    document.getElementById("poSaveBtn").disabled = false;
  } catch (err) {
    showNotice("payoutNotice", err.message);
    document.getElementById("poSaveBtn").disabled = true;
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener("submit", async (e) => {
  if (!e.target || e.target.id !== "payoutForm") return;
  e.preventDefault();
  if (!_poVerified) { showNotice("payoutNotice", "Verify the account before saving."); return; }
  const btn = document.getElementById("poSaveBtn");
  btn.disabled = true;
  try {
    const branchId = document.getElementById("poBranchId").value;
    const bankCode = document.getElementById("poBankCode").value;
    const bankName = document.getElementById("poBankCode").selectedOptions[0].textContent;
    const accountNumber = document.getElementById("poAccountNumber").value;
    await adminApi.setBranchPayoutAccount(branchId, { bankCode, bankName, accountNumber });
    showNotice("branchesNotice", "Payout account saved — this branch's guest payments will now settle there.", "success");
    closePayoutModal();
    refreshBranchesTable();
  } catch (err) {
    showNotice("payoutNotice", err.message);
    btn.disabled = false;
  }
});

function autofillBranchSlug() {
  const slugField = document.getElementById("bSlug");
  if (slugField.disabled || slugField.dataset.touched === "1") return; // editing existing branch, or user already typed their own
  slugField.value = document.getElementById("bName").value
    .trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function closeBranchModal() { document.getElementById("branchModal").style.display = "none"; }

async function toggleBranchActive(id, currentlyActive) {
  const verb = currentlyActive ? "deactivate" : "reactivate";
  if (!confirm(`Are you sure you want to ${verb} this branch? ${currentlyActive ? "It will stop taking new bookings." : ""}`)) return;
  try { await adminApi.updateBranch(id, { isActive: !currentlyActive }); refreshBranchesTable(); }
  catch (err) { showNotice("branchesNotice", err.message); }
}

async function submitBranchForm(e) {
  e.preventDefault();
  const btn = document.getElementById("bSubmitBtn");
  btn.disabled = true;
  try {
    const id = document.getElementById("bId").value;
    const services = Array.from(document.querySelectorAll("#bServices input:checked")).map((el) => el.value);
    const payload = {
      name: document.getElementById("bName").value,
      city: document.getElementById("bCity").value,
      state: document.getElementById("bState").value || undefined,
      address: document.getElementById("bAddress").value || undefined,
      phone: document.getElementById("bPhone").value || undefined,
      email: document.getElementById("bEmail").value || undefined,
      services,
    };
    if (!id) payload.slug = document.getElementById("bSlug").value || undefined; // slug is create-only — PATCH /branches/:id doesn't accept it
    if (id) { await adminApi.updateBranch(id, payload); showNotice("branchesNotice", "Branch updated.", "success"); }
    else { await adminApi.createBranch(payload); showNotice("branchesNotice", "Branch opened. Appoint a Manager from Staff.", "success"); }
    closeBranchModal();
    refreshBranchesTable();
  } catch (err) {
    showNotice("branchesNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function refreshRooms() {
  if (!_roomsSelectedBranchId) return;
  try {
    const { rooms } = await adminApi.listRooms(_roomsSelectedBranchId);
    _cachedRooms = rooms;

    document.getElementById("roomsBody").innerHTML = rooms.length ? rooms.map((r) => `
      <tr>
        <td>${r.images && r.images[0] ? `<img src="${r.images[0]}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">` : `<span class="offering-photo-placeholder"><i class="fa-solid fa-camera"></i></span>`}</td>

        <td>${r.name}</td>
        <td>&#8358;${Number(r.basePrice).toLocaleString()}</td>
        <td>${r.floor || "—"}</td>
        <td><span class="badge badge-${r.status.toLowerCase()}">${r.status}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick='openRoomModal(${JSON.stringify(r).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-outline" onclick="deleteRoomConfirm('${r.id}')">Delete</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="7" class="empty-state">No rooms at this branch yet — add one above.</td></tr>`;
  } catch (err) {
    showNotice("roomsNotice", err.message);
  }
}

let _rEditingId = null;
function openRoomModal(room) {
  document.getElementById("roomModalTitle").textContent = room ? "Edit room" : "Add room";
  document.getElementById("roomForm").reset();
  _rEditingId = room ? room.id : null;
  document.getElementById("rId").value = room ? room.id : "";
  document.getElementById("rGalleryField").style.display = room ? "block" : "none";
  document.getElementById("rGalleryPreview").innerHTML = (room && room.images || []).map((url) => `
    <div style="position:relative;">
      <img src="${url}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;">
      <button type="button" onclick="removeRoomImage('${url}')" style="position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;">&times;</button>
    </div>
  `).join("");
  if (room) {
    document.getElementById("rName").value = room.name;
    document.getElementById("rPrice").value = room.basePrice;
    document.getElementById("rOccupancy").value = room.maxOccupancy;
    document.getElementById("rNumber").value = room.roomNumber;
    document.getElementById("rFloor").value = room.floor || "";
    document.getElementById("rDescription").value = room.description || "";
    document.getElementById("rAmenities").value = (room.amenities || []).join(", ");
    document.getElementById("rStatus").value = room.status;
  }
  refreshRoomTagOptions(room ? (room.tags || []) : []);
  document.getElementById("roomModal").style.display = "flex";
}
function closeRoomModal() { document.getElementById("roomModal").style.display = "none"; }

async function refreshRoomTagOptions(selectedTags) {
  const container = document.getElementById("rTagsOptions");
  if (!_roomsSelectedBranchId) { container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Pick a branch first.</span>`; return; }
  const currentlySelected = selectedTags || Array.from(container.querySelectorAll("input:checked")).map((el) => el.value);
  try {
    const { tags } = await adminApi.listTags(_roomsSelectedBranchId, "room");
    container.innerHTML = tags.length ? tags.map((t) => `
      <label class="checkbox-item"><input type="checkbox" value="${t.name}" ${currentlySelected.includes(t.name) ? "checked" : ""}> ${t.name}</label>
    `).join("") : `<span style="color:var(--text-muted); font-size:0.82rem;">No tags yet — add some from the <a href="#" onclick="switchPage('tags'); return false;" style="color:var(--brass-dark); font-weight:600;">Tags page</a>.</span>`;
  } catch {
    container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Couldn't load tags.</span>`;
  }
}

async function removeRoomImage(url) {
  if (!_rEditingId) return;
  try {
    await adminApi.deleteRoomImage(_rEditingId, url);
    const updated = { ..._cachedRooms.find((r) => r.id === _rEditingId), images: (_cachedRooms.find((r) => r.id === _rEditingId)?.images || []).filter((u) => u !== url) };
    refreshRooms();
    openRoomModal(updated);
  } catch (err) {
    showNotice("roomsNotice", err.message);
  }
}

async function submitRoomForm(e) {
  e.preventDefault();
  const btn = document.getElementById("rSubmitBtn");
  btn.disabled = true;
  try {
    const id = document.getElementById("rId").value;
    const payload = {
      name: document.getElementById("rName").value,
      basePrice: Number(document.getElementById("rPrice").value),
      maxOccupancy: Number(document.getElementById("rOccupancy").value),
      roomNumber: document.getElementById("rNumber").value,
      floor: document.getElementById("rFloor").value || undefined,
      description: document.getElementById("rDescription").value || undefined,
      amenities: document.getElementById("rAmenities").value.split(",").map((s) => s.trim()).filter(Boolean),
      status: document.getElementById("rStatus").value,
      tags: Array.from(document.getElementById("rTagsOptions").querySelectorAll("input:checked")).map((el) => el.value),
    };
    let savedId = id;
    if (id) { await adminApi.updateRoom(id, _roomsSelectedBranchId, payload); showNotice("roomsNotice", "Room updated.", "success"); }
    else { const { room } = await adminApi.createRoom(_roomsSelectedBranchId, payload); savedId = room.id; showNotice("roomsNotice", "Room added.", "success"); }

    const file = document.getElementById("rImageInput").files[0];
    if (file && savedId) await adminApi.uploadRoomImage(savedId, file);

    closeRoomModal();
    refreshRooms();
  } catch (err) {
    showNotice("roomsNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function deleteRoomConfirm(id) {
  if (!confirm("Delete this room? This can't be undone.")) return;
  try {
    await adminApi.deleteRoom(id, _roomsSelectedBranchId);
    showNotice("roomsNotice", "Room deleted.", "success");
    refreshRooms();
  } catch (err) {
    showNotice("roomsNotice", err.message);
  }
}

/* ============================================================
   STOCK — per-branch inventory ledger. Quantity is never edited
   directly anymore — every change (entry, sale, adjustment, closing
   count) goes through recordStockMovement so there's a real, append-only
   history behind the number, not just a mutable field. Sales are logged
   automatically by createOrder on the backend; everything else is
   recorded here.
   ============================================================ */
let _stockSelectedBranchId = "";

async function loadStockPage() {
  const container = document.getElementById("pageContent");
  let branchOptionsHtml = `<option value="">Select a branch…</option>`;
  let branches = [];
  try {
    ({ branches } = await adminApi.listBranches());
    if (!_stockSelectedBranchId && branches.length) _stockSelectedBranchId = branches[0].id;
    branchOptionsHtml = branches.map((b) => `<option value="${b.id}" ${b.id === _stockSelectedBranchId ? "selected" : ""}>${b.name}</option>`).join("");
  } catch { /* non-fatal */ }

  container.innerHTML = `
    ${pageHeader("Stock", "Inventory per branch — entries, sales, adjustments, and closing counts, all logged.",
      `<button class="btn btn-primary" onclick="openStockModal()" ${_stockSelectedBranchId ? "" : "disabled"}>Add item</button>`)}
    <div id="stockNotice"></div>
    <div class="panel">
      <div class="form-field" style="max-width:320px;">
        <label>Branch</label>
        <select id="stockBranchSelect" onchange="_stockSelectedBranchId=this.value; refreshStock();">${branchOptionsHtml}</select>
      </div>
    </div>
    <div class="panel">
      <table><thead><tr><th>Name</th><th>Quantity</th><th>Unit</th><th>Low-stock threshold</th><th></th></tr></thead>
        <tbody id="stockBody"><tr><td colspan="5" class="loading-state">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="modal-overlay" id="stockModal" style="display:none;">
      <div class="modal">
        <h3 id="stockModalTitle">Add item</h3>
        <form id="stockForm">
          <input type="hidden" id="stId">
          <div class="form-field"><label>Name</label><input type="text" id="stName" required></div>
          <div class="form-field"><label>Unit</label><input type="text" id="stUnit" placeholder="kg, bottle, roll…" value="unit"></div>
          <div class="form-row" id="stQuantityRow">
            <div class="form-field"><label>Starting quantity</label><input type="number" id="stQuantity" min="0" step="1" value="0" required></div>
            <div class="form-field"><label>Low-stock threshold</label><input type="number" id="stLowStockThreshold" min="0" step="1" value="5" required></div>
          </div>
          <p id="stQuantityEditNote" style="display:none; color:var(--text-muted); font-size:0.82rem; margin:-6px 0 12px;">
            Quantity isn't edited here anymore — use "Record movement" from the list below (entry, adjustment, or closing count).
          </p>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" onclick="closeStockModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="stSubmitBtn">Save item</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="ledgerModal" style="display:none;">
      <div class="modal" style="max-width:640px;">
        <h3 id="ledgerModalTitle">Ledger</h3>
        <div id="ledgerNotice"></div>
        <form id="movementForm" style="border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:16px;">
          <input type="hidden" id="mvStockItemId">
          <div class="form-row">
            <div class="form-field">
              <label>Movement type</label>
              <select id="mvType" onchange="toggleMovementFields()">
                <option value="ENTRY">Entry (stock received)</option>
                <option value="ADJUSTMENT">Adjustment (breakage, correction)</option>
                <option value="CLOSING_COUNT">Closing count (physical count)</option>
              </select>
            </div>
            <div class="form-field" id="mvDeltaField"><label>Quantity</label><input type="number" id="mvQuantityDelta" step="1"></div>
            <div class="form-field" id="mvCountedField" style="display:none;"><label>Counted quantity</label><input type="number" id="mvCountedQuantity" min="0" step="1"></div>
          </div>
          <div class="form-field"><label>Note <span style="color:var(--text-muted); font-weight:400;">(optional)</span></label><input type="text" id="mvNote" placeholder="e.g. delivery from supplier, 2 bottles broken"></div>
          <button type="submit" class="btn btn-primary btn-sm" id="mvSubmitBtn">Record</button>
        </form>
        <div style="max-height:320px; overflow-y:auto;">
          <table><thead><tr><th>When</th><th>Type</th><th>Change</th><th>Balance</th><th>Note</th><th>By</th></tr></thead>
            <tbody id="ledgerBody"><tr><td colspan="6" class="loading-state">Loading…</td></tr></tbody>
          </table>
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeLedgerModal()">Close</button></div>
      </div>
    </div>
  `;
  document.getElementById("stockForm").addEventListener("submit", submitStockForm);
  document.getElementById("movementForm").addEventListener("submit", submitMovementForm);
  toggleMovementFields();
  if (_stockSelectedBranchId) await refreshStock();
  else document.getElementById("stockBody").innerHTML = `<tr><td colspan="5" class="empty-state">Pick a branch above to see its stock.</td></tr>`;
}

async function refreshStock() {
  if (!_stockSelectedBranchId) return;
  try {
    const { stockItems } = await adminApi.listStockItems(_stockSelectedBranchId);
    document.getElementById("stockBody").innerHTML = stockItems.length ? stockItems.map((s) => `
      <tr>
        <td>${s.name}</td>
        <td>${s.quantity <= s.lowStockThreshold ? `<span class="badge badge-warning">${s.quantity}</span>` : s.quantity}</td>
        <td>${s.unit || "—"}</td>
        <td>${s.lowStockThreshold}</td>
        <td>
          <button class="btn btn-sm btn-primary" onclick='openLedgerModal(${JSON.stringify(s).replace(/'/g, "&#39;")})'>Ledger</button>
          <button class="btn btn-sm btn-outline" onclick='openStockModal(${JSON.stringify(s).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-outline" onclick="deleteStockItemConfirm('${s.id}')">Delete</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="5" class="empty-state">No stock items yet — add one above.</td></tr>`;
  } catch (err) {
    showNotice("stockNotice", err.message);
  }
}

function openStockModal(item) {
  document.getElementById("stockModalTitle").textContent = item ? "Edit item" : "Add item";
  document.getElementById("stockForm").reset();
  document.getElementById("stId").value = item ? item.id : "";
  document.getElementById("stQuantityRow").style.display = item ? "none" : "";
  document.getElementById("stQuantityEditNote").style.display = item ? "" : "none";
  if (item) {
    document.getElementById("stName").value = item.name;
    document.getElementById("stUnit").value = item.unit || "";
  }
  document.getElementById("stockModal").style.display = "flex";
}
function closeStockModal() { document.getElementById("stockModal").style.display = "none"; }

async function submitStockForm(e) {
  e.preventDefault();
  const btn = document.getElementById("stSubmitBtn");
  btn.disabled = true;
  try {
    const id = document.getElementById("stId").value;
    if (id) {
      // Editing: name/unit/threshold only — no quantity field sent.
      const payload = { name: document.getElementById("stName").value, unit: document.getElementById("stUnit").value || "unit" };
      await adminApi.updateStockItem(id, _stockSelectedBranchId, payload);
      showNotice("stockNotice", "Item updated.", "success");
    } else {
      const payload = {
        name: document.getElementById("stName").value,
        unit: document.getElementById("stUnit").value || "unit",
        quantity: Number(document.getElementById("stQuantity").value),
        lowStockThreshold: Number(document.getElementById("stLowStockThreshold").value),
      };
      await adminApi.createStockItem(_stockSelectedBranchId, payload);
      showNotice("stockNotice", "Item added.", "success");
    }
    closeStockModal();
    refreshStock();
  } catch (err) {
    showNotice("stockNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function deleteStockItemConfirm(id) {
  if (!confirm("Delete this stock item? Its ledger history goes with it.")) return;
  try {
    await adminApi.deleteStockItem(id);
    refreshStock();
  } catch (err) {
    showNotice("stockNotice", err.message);
  }
}

function toggleMovementFields() {
  const isClosing = document.getElementById("mvType").value === "CLOSING_COUNT";
  document.getElementById("mvDeltaField").style.display = isClosing ? "none" : "";
  document.getElementById("mvCountedField").style.display = isClosing ? "" : "none";
}

let _ledgerCurrentItem = null;
async function openLedgerModal(item) {
  _ledgerCurrentItem = item;
  document.getElementById("ledgerModalTitle").textContent = `Ledger — ${item.name}`;
  document.getElementById("mvStockItemId").value = item.id;
  document.getElementById("movementForm").reset();
  toggleMovementFields();
  document.getElementById("ledgerModal").style.display = "flex";
  await refreshLedger();
}
function closeLedgerModal() { document.getElementById("ledgerModal").style.display = "none"; }

async function refreshLedger() {
  try {
    const { movements } = await adminApi.listStockMovements(_ledgerCurrentItem.id, _stockSelectedBranchId);
    document.getElementById("ledgerBody").innerHTML = movements.length ? movements.map((m) => `
      <tr>
        <td style="font-size:0.78rem;">${new Date(m.createdAt).toLocaleString()}</td>
        <td>${m.type}</td>
        <td style="color:${m.quantityDelta < 0 ? "var(--danger)" : "var(--brass-dark)"};">${m.quantityDelta > 0 ? "+" : ""}${m.quantityDelta}</td>
        <td>${m.balanceAfter}</td>
        <td style="font-size:0.82rem; color:var(--text-muted);">${m.note || "—"}</td>
        <td style="font-size:0.78rem;">${m.recordedByType}</td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No movements yet.</td></tr>`;
  } catch (err) {
    showNotice("ledgerNotice", err.message);
  }
}

async function submitMovementForm(e) {
  e.preventDefault();
  const btn = document.getElementById("mvSubmitBtn");
  btn.disabled = true;
  try {
    const type = document.getElementById("mvType").value;
    const payload = { type, note: document.getElementById("mvNote").value || undefined };
    if (type === "CLOSING_COUNT") payload.countedQuantity = Number(document.getElementById("mvCountedQuantity").value);
    else payload.quantityDelta = Number(document.getElementById("mvQuantityDelta").value);

    await adminApi.recordStockMovement(document.getElementById("mvStockItemId").value, _stockSelectedBranchId, payload);
    document.getElementById("movementForm").reset();
    toggleMovementFields();
    await refreshLedger();
    refreshStock();
  } catch (err) {
    showNotice("ledgerNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

    document.getElementById("evName").value = ev.name;
    document.getElementById("evDescription").value = ev.description || "";
    document.getElementById("evStartsAt").value = toDatetimeLocalValue(ev.startsAt);
    document.getElementById("evEndsAt").value = ev.endsAt ? toDatetimeLocalValue(ev.endsAt) : "";
    document.getElementById("evCapacity").value = ev.capacity ?? "";
    document.getElementById("evPrice").value = ev.price ?? "";
  }
  refreshEventTagOptions(ev ? (ev.tags || []) : []);
  document.getElementById("eventModal").style.display = "flex";
}
function closeEventModal() { document.getElementById("eventModal").style.display = "none"; }

function toDatetimeLocalValue(isoString) {
  const d = new Date(isoString);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function submitEventForm(e) {

    closeEventModal();
    refreshEvents();

}

  document.getElementById("ofRoomServiceField").style.display = isFoodOrDrink ? "" : "none";
  document.getElementById("ofDietaryField").style.display = isFoodOrDrink ? "" : "none";

/** Populates the tag checkboxes from this branch's managed list for
 * whichever service the current category maps to. Re-fetches on branch
 * or category change since the list is scoped to both. */
async function refreshOfferingTagOptions(selectedTags) {
  const cat = document.getElementById("ofCategory").value;
  const service = OFFERING_TAG_SERVICE[cat];
  const container = document.getElementById("ofTagsOptions");
  if (!_offeringsSelectedBranchId || !service) { container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Pick a branch first.</span>`; return; }
  const currentlySelected = selectedTags || Array.from(container.querySelectorAll("input:checked")).map((el) => el.value);
  try {
    const { tags } = await adminApi.listTags(_offeringsSelectedBranchId, service);
    container.innerHTML = tags.length ? tags.map((t) => `
      <label class="checkbox-item"><input type="checkbox" value="${t.name}" ${currentlySelected.includes(t.name) ? "checked" : ""}> ${t.name}</label>
    `).join("") : `<span style="color:var(--text-muted); font-size:0.82rem;">No tags yet for this service — add some from the <a href="#" onclick="switchPage('tags'); return false;" style="color:var(--brass-dark); font-weight:600;">Tags page</a>.</span>`;
  } catch {
    container.innerHTML = `<span style="color:var(--text-muted); font-size:0.82rem;">Couldn't load tags.</span>`;
  }
}

function toggleOfferingStockFields() {
  document.getElementById("ofStockQtyRow").style.display = document.getElementById("ofTrackStock").checked ? "" : "none";
}

async function refreshOfferingsTable() {
  if (!_offeringsSelectedBranchId) return;
  try {
    const results = await Promise.all(
      Object.entries(OFFERING_TYPES).map(async ([cat, cfg]) => {
        const data = await cfg.list(_offeringsSelectedBranchId);
        const items = data[cfg.key] || data.menuItems || data.laundryItems || data.spaTreatments || [];
        return items.map((item) => ({ ...item, _category: cat }));
      })
    );
    const offerings = results.flat();
    document.getElementById("offeringsBody").innerHTML = offerings.length ? offerings.map((o) => `
      <tr>
        <td>
          <div class="offering-photo" onclick="document.getElementById('photoInput-${o.id}').click()" title="Click to change photo">
            ${o.image ? `<img src="${o.image}" alt="${o.name}">` : `<span class="offering-photo-placeholder"><i class="fa-solid fa-camera"></i></span>`}
          </div>
          <input type="file" id="photoInput-${o.id}" accept="image/*" style="display:none;" onchange="uploadOfferingPhoto('${o._category}', '${o.id}', this)">
        </td>
        <td>${o.name}</td>
        <td>${OFFERING_TYPES[o._category].label}</td>
        <td>${(o.tags || []).map((t) => `<span class="badge">${t}</span>`).join(" ") || "—"}</td>
        <td>&#8358;${Number(o.price).toLocaleString()}</td>
        <td><span class="badge badge-${o.isAvailable ? "active" : "inactive"}">${o.isAvailable ? "Active" : "Inactive"}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick='openOfferingModal(${JSON.stringify(o).replace(/'/g, "&#39;")})'>Edit</button>
          <button class="btn btn-sm btn-outline" onclick="toggleOfferingActive('${o._category}', '${o.id}', ${o.isAvailable})">${o.isAvailable ? "Deactivate" : "Activate"}</button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="7" class="empty-state">No items yet — add food, drinks, laundry, or spa items above.</td></tr>`;
  } catch (err) {
    document.getElementById("offeringsBody").innerHTML = `<tr><td colspan="7" class="empty-state">${err.message}</td></tr>`;
  }
}

async function uploadOfferingPhoto(category, id, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const uploaders = {
    food: adminApi.uploadMenuItemImage, drink: adminApi.uploadMenuItemImage,
    laundry: adminApi.uploadLaundryItemImage, spa: adminApi.uploadSpaTreatmentImage,
  };
  try {
    await uploaders[category](id, file);
    refreshOfferingsTable();
  } catch (err) {
    showNotice("offeringsNotice", "Couldn't upload photo: " + err.message);
  }
}

function openOfferingModal(o) {
  document.getElementById("offeringModalTitle").textContent = o ? "Edit item" : "Add item";
  document.getElementById("offeringForm").reset();
  document.getElementById("ofId").value = o ? o.id : "";
  document.getElementById("ofStockItemId").value = (o && o.stockItemId) || "";
  document.getElementById("ofCategory").disabled = !!o; // category can't change after creation — different table
  if (o) {
    document.getElementById("ofCategory").value = o._category;
    document.getElementById("ofName").value = o.name;
    document.getElementById("ofPrice").value = o.price;
    document.getElementById("ofDescription").value = o.description || "";
    if (o._category === "laundry") document.getElementById("ofTurnaround").value = o.turnaroundHours || 24;
    if (o._category === "spa") document.getElementById("ofDuration").value = o.durationMinutes || 60;
    if (o._category === "food" || o._category === "drink") {
      document.getElementById("ofRoomService").checked = !!o.availableForRoomService;
      document.getElementById("ofDietaryTags").value = (o.dietaryTags || []).join(", ");
    }
  }
  // Stock: creating new stock tracking only happens at item creation
  // (see createMenuItem on the backend) — an item that already has a
  // linked StockItem shows a note pointing at the Stock page instead.
  const alreadyTracked = !!(o && o.stockItemId);
  document.getElementById("ofStockLinkedNote").style.display = alreadyTracked ? "" : "none";
  document.getElementById("ofStockNewFields").style.display = alreadyTracked ? "none" : "";
  document.getElementById("ofTrackStock").checked = false;
  toggleOfferingStockFields();
  toggleOfferingFields();
  refreshOfferingTagOptions(o ? (o.tags || []) : []);
  document.getElementById("offeringModal").style.display = "flex";
}
function closeOfferingModal() { document.getElementById("offeringModal").style.display = "none"; }

async function submitOfferingForm(e) {
  e.preventDefault();
  const btn = document.getElementById("ofSubmitBtn");
  btn.disabled = true;
  try {
    const id = document.getElementById("ofId").value;
    const category = document.getElementById("ofCategory").value;
    const cfg = OFFERING_TYPES[category];
    const tags = Array.from(document.getElementById("ofTagsOptions").querySelectorAll("input:checked")).map((el) => el.value);

    const base = {
      name: document.getElementById("ofName").value,
      price: Number(document.getElementById("ofPrice").value),
      tags,
    };
    if (category === "food" || category === "drink") {
      base.category = category.toUpperCase();
      base.description = document.getElementById("ofDescription").value || undefined;
      base.availableForRoomService = document.getElementById("ofRoomService").checked;
      const dietaryTags = document.getElementById("ofDietaryTags").value.split(",").map((t) => t.trim()).filter(Boolean);
      if (dietaryTags.length) base.dietaryTags = dietaryTags;
      // Inline stock creation — only offered (and only meaningful) when
      // adding a brand-new item; see openOfferingModal's linked-note branch.
      if (!id && document.getElementById("ofTrackStock").checked) {
        base.trackStock = true;
        base.stockQuantity = Number(document.getElementById("ofStockQuantity").value) || 0;
        base.stockUnit = document.getElementById("ofStockUnit").value || "unit";
        base.stockLowStockThreshold = Number(document.getElementById("ofStockLowThreshold").value) || 5;
      }
    } else if (category === "laundry") {
      base.turnaroundHours = Number(document.getElementById("ofTurnaround").value) || 24;
    } else if (category === "spa") {
      base.description = document.getElementById("ofDescription").value || undefined;
      base.durationMinutes = Number(document.getElementById("ofDuration").value) || 60;
    }

    if (id) { await cfg.update(id, _offeringsSelectedBranchId, base); showNotice("offeringsNotice", "Item updated.", "success"); }
    else { await cfg.create(_offeringsSelectedBranchId, base); showNotice("offeringsNotice", "Item added.", "success"); }
    closeOfferingModal();
    refreshOfferingsTable();
  } catch (err) {
    showNotice("offeringsNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}
async function toggleOfferingActive(category, id, currentlyActive) {
  try { await OFFERING_TYPES[category].update(id, _offeringsSelectedBranchId, { isAvailable: !currentlyActive }); refreshOfferingsTable(); }
  catch (err) { showNotice("offeringsNotice", err.message); }
}

async function refreshTransactionsTable() {
  try {
    const filters = {};
    const branchEl = document.getElementById("txnBranchFilter");
    const sourceEl = document.getElementById("txnSourceFilter");
    const statusEl = document.getElementById("txnStatusFilter");
    if (branchEl && branchEl.value) filters.branchId = branchEl.value;
    if (sourceEl && sourceEl.value) filters.source = sourceEl.value;
    if (statusEl && statusEl.value) filters.status = statusEl.value;

    const { transactions, totals } = await adminApi.listTransactions(filters);

    document.getElementById("txnStatCards").innerHTML = `
      <div class="stat-card"><b>&#8358;${Number(totals?.paid || 0).toLocaleString()}</b><span>Total paid</span></div>
      <div class="stat-card"><b>&#8358;${Number(totals?.pending || 0).toLocaleString()}</b><span>Pending</span></div>
      <div class="stat-card"><b>&#8358;${Number(totals?.refunded || 0).toLocaleString()}</b><span>Refunded</span></div>
      <div class="stat-card"><b>${transactions.length}</b><span>Transactions</span></div>
    `;

    document.getElementById("transactionsBody").innerHTML = transactions.length ? transactions.map((t) => `
      <tr>
        <td>${(t.createdAt || "").slice(0,10)}</td>
        <td>${t.guestName}</td>
        ${isDirector() ? `<td>${t.branchName || "—"}</td>` : ""}
        <td>${TXN_SOURCE_LABELS[t.source] || t.source}</td>
        <td>${TXN_METHOD_LABELS[t.method] || t.method}</td>
        <td>&#8358;${Number(t.amount).toLocaleString()}</td>
        <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="viewInvoice('${t.id}')">Invoice</button>
          ${t.status === "PAID" ? `<button class="btn btn-sm btn-danger" onclick="refundTransactionRow('${t.id}')">Refund</button>` : ""}
        </td>
      </tr>
    `).join("") : `<tr><td colspan="8" class="empty-state">No transactions yet.</td></tr>`;
  } catch (err) {
    document.getElementById("transactionsBody").innerHTML = `<tr><td colspan="8" class="empty-state">${err.message}</td></tr>`;
  }
}

async function refreshBlogTable() {
  try {
    const { posts } = await adminApi.listBlogPosts(_blogBranchFilter || undefined);
    document.getElementById("blogBody").innerHTML = posts.length ? posts.map((p) => `
      <tr>
        <td>${p.title}</td>
        <td>${p.branch ? p.branch.name : "Company-wide"}</td>

        <td>${p.publishedAt ? new Date(p.publishedAt).toLocaleDateString() : "—"}</td>
        <td>${p.campaign ? (p.campaign.status === "SENT" ? `Sent to ${p.campaign.sentCount}` : p.campaign.status) : (p.autoNewsletter ? "Pending" : "Off")}</td>
        <td style="text-align:right;">
          <button class="btn-icon" onclick='openBlogModal(${JSON.stringify(p).replace(/'/g, "&#39;")})' title="Edit"><i class="fas fa-pen"></i></button>
          <button class="btn-icon" onclick="deleteBlogPost('${p.id}')" title="Delete"><i class="fas fa-trash"></i></button>
        </td>
      </tr>
    `).join("") : `<tr><td colspan="6" class="empty-state">No posts yet.</td></tr>`;
  } catch (err) {
    document.getElementById("blogBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
  }
}

function openBlogModal(post) {
  document.getElementById("blogModalTitle").textContent = post ? "Edit post" : "Write a post";
  document.getElementById("blogForm").reset();
  document.getElementById("bpId").value = post ? post.id : "";
  document.getElementById("bpSlugPreview").textContent = post ? post.slug : "";
  if (post) {
    document.getElementById("bpTitle").value = post.title;
    document.getElementById("bpExcerpt").value = post.excerpt || "";
    document.getElementById("bpContent").value = post.content;
    document.getElementById("bpCoverImageUrl").value = post.coverImageUrl || "";
    document.getElementById("bpTags").value = (post.tags || []).join(", ");
    document.getElementById("bpAutoNewsletter").checked = post.autoNewsletter;
    const branchSelect = document.getElementById("bpBranch");
    if (branchSelect) branchSelect.value = post.branch ? post.branch.id : "";
    const publishBtn = document.getElementById("bpPublishBtn");
    if (post.status === "PUBLISHED") { publishBtn.textContent = "Save changes"; document.getElementById("bpDraftBtn").style.display = "none"; }
    else { publishBtn.textContent = "Publish"; document.getElementById("bpDraftBtn").style.display = ""; }
  } else {
    document.getElementById("bpPublishBtn").textContent = "Publish";
    document.getElementById("bpDraftBtn").style.display = "";
  }
  document.getElementById("blogModal").style.display = "flex";
}

function closeBlogModal() { document.getElementById("blogModal").style.display = "none"; }

async function submitBlogForm(publish) {
  const id = document.getElementById("bpId").value;
  const branchSelect = document.getElementById("bpBranch");
  const branchId = branchSelect ? (branchSelect.value || undefined) : undefined;
  const tags = document.getElementById("bpTags").value.split(",").map((t) => t.trim()).filter(Boolean);
  const payload = {
    title: document.getElementById("bpTitle").value,
    excerpt: document.getElementById("bpExcerpt").value || undefined,
    content: document.getElementById("bpContent").value,
    coverImageUrl: document.getElementById("bpCoverImageUrl").value || undefined,
    tags,
    autoNewsletter: document.getElementById("bpAutoNewsletter").checked,
  };
  // Editing an already-published post and hitting the (now "Save changes")
  // button shouldn't silently revert it to draft.
  const isEditingPublished = id && document.getElementById("bpPublishBtn").textContent === "Save changes";
  if (publish || isEditingPublished) payload.status = "PUBLISHED";

  const btn = publish ? document.getElementById("bpPublishBtn") : document.getElementById("bpDraftBtn");
  btn.disabled = true;
  try {
    if (id) await adminApi.updateBlogPost(id, payload, branchId);
    else await adminApi.createBlogPost(payload, branchId);
    closeBlogModal();
    showNotice("blogNotice", publish ? "Post published — newsletter dispatch may take a minute." : "Draft saved.", "success");
    refreshBlogTable();
  } catch (err) {
    showNotice("blogNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

async function deleteBlogPost(id) {
  if (!confirm("Delete this post? This can't be undone.")) return;
  try {
    await adminApi.deleteBlogPost(id, _blogBranchFilter || undefined);
    refreshBlogTable();
  } catch (err) {
    showNotice("blogNotice", err.message);
  }
}

  const suggested = (window._departmentCatalog || {})[dept] || [];
  document.querySelectorAll('#staffForm .checkbox-grid input').forEach((cb) => {
    if (suggested.includes(cb.value)) cb.checked = true;
  });

async function refreshStaffTable() {
  const director = isDirector();
  try {
    const { staff } = await adminApi.listStaff();
    document.getElementById("staffBody").innerHTML = staff.map((s) => `
      <tr>
        <td>${s.name}<br><span style="color:var(--text-muted); font-size:0.78rem;">${s.email}</span></td>
        <td>${s.role}</td>
        ${director ? `<td>${s.branchName || "—"}</td>` : ""}
        <td>${s.title || "—"}</td>
        <td>${(s.permissions || []).length ? s.permissions.join(", ") : "—"}</td>
        <td><span class="badge badge-${s.isActive ? "active" : "inactive"}">${s.isActive ? "Active" : "Inactive"}</span></td>
        <td>${s.role !== "DIRECTOR" ? `<button class="btn btn-sm btn-outline" onclick="toggleStaffActive('${s.id}', ${s.isActive})">${s.isActive ? "Deactivate" : "Activate"}</button>` : ""}</td>

    document.getElementById("staffBody").innerHTML = `<tr><td colspan="7" class="empty-state">${err.message}</td></tr>`;

}
async function toggleStaffActive(id, currentlyActive) {
  try { await adminApi.updateStaff(id, { isActive: !currentlyActive }); refreshStaffTable(); }
  catch (err) { showNotice("staffNotice", err.message); }
}
function openStaffModal() { document.getElementById("staffModal").style.display = "flex"; }
function closeStaffModal() { document.getElementById("staffModal").style.display = "none"; }

async function submitStaffForm(e) {
  e.preventDefault();
  const btn = document.getElementById("sSubmitBtn");
  btn.disabled = true;
  try {
    const permissions = Array.from(document.querySelectorAll('#staffForm .checkbox-grid input:checked')).map((el) => el.value);
    const role = document.getElementById("sRole").value;
    const branchSelect = document.getElementById("sBranch");

    const department = document.getElementById("sDepartment").value || undefined;
    if (role === "MANAGER") {
      // Directors only — a real Manager account, not a mislabeled Staff row.
      const payload = {
        name: document.getElementById("sName").value,
        email: document.getElementById("sEmail").value,
        password: document.getElementById("sPassword").value,
        roleTitle: document.getElementById("sTitle").value || undefined,
        department,
        branchId: branchSelect ? branchSelect.value : undefined,
      };
      await adminApi.createManager(payload);
      showNotice("staffNotice", "Manager account created.", "success");
    } else {
      const payload = {
        name: document.getElementById("sName").value,
        email: document.getElementById("sEmail").value,
        password: document.getElementById("sPassword").value,
        roleTitle: document.getElementById("sTitle").value || undefined,
        department,
        permissions,
      };
      if (branchSelect) payload.branchId = branchSelect.value;
      await adminApi.createStaff(payload);
      showNotice("staffNotice", "Staff account created.", "success");
    }

    closeStaffModal();
    refreshStaffTable();
  } catch (err) {
    showNotice("staffNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

    </div>

        <div id="assignTicketNotice"></div>
        <div class="form-field">
          <label>Assign to</label>
          <select id="assignTicketTarget"><option value="">Loading…</option></select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeAssignTicketModal()">Cancel</button>

        </div>
      </div>
    </div>
  `;
