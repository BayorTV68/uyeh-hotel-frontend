}
let _cachedTickets = [];
async function refreshTicketsTable() {
  try {
    const { tickets } = await adminApi.listTickets();
    _cachedTickets = tickets;
    document.getElementById("ticketsBody").innerHTML = tickets.length ? tickets.map((t) => {
      const assignee = t.assignedManager || t.assignedStaffMember;
      return `
      <tr>
        <td>${t.subject}</td>
        <td>${t.guest.name}</td>
        <td>${t.priority}</td>
        <td>${assignee ? assignee.name : "—"}</td>
        <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td>
        <td>
          <button class="btn btn-sm btn-outline" onclick="openAssignTicketModal('${t.id}')">${assignee ? "Reassign" : "Assign"}</button>
          ${t.status !== "RESOLVED" ? `<button class="btn btn-sm btn-outline" onclick="resolveTicketRow('${t.id}')">Resolve</button>` : ""}
        </td>
      </tr>
    `; }).join("") : `<tr><td colspan="6" class="empty-state">No tickets yet.</td></tr>`;

    const openCount = tickets.filter((t) => ["OPEN", "IN_PROGRESS"].includes(t.status)).length;
    const bellBadge = document.getElementById("ticketsBellBadge");
    const navBadge = document.getElementById("ticketsNavBadge");
    [bellBadge, navBadge].forEach((el) => {
      if (!el) return;
      el.textContent = openCount;
      el.style.display = openCount ? "flex" : "none";
      el.classList.toggle("visible", openCount > 0);
    });
  } catch (err) {
    document.getElementById("ticketsBody").innerHTML = `<tr><td colspan="6" class="empty-state">${err.message}</td></tr>`;
  }
}

/** A ticket belongs to one specific branch (visible across every branch
 * in this Director view), so who's assignable has to be fetched fresh
 * per-ticket rather than from one global staff list. Deliberately no
 * "assign to me" shortcut for Director — the backend's assignment model
 * is Manager/Staff only (assignedManagerId/assignedStaffId, no
 * assignedDirectorId), so a Director always assigns to someone at that
 * branch rather than claiming it personally. */
let _assignTicketId = null;
async function openAssignTicketModal(ticketId) {
  const ticket = _cachedTickets.find((t) => t.id === ticketId);
  if (!ticket) return;
  _assignTicketId = ticketId;
  document.getElementById("assignTicketModal").style.display = "flex";
  const select = document.getElementById("assignTicketTarget");
  select.innerHTML = `<option value="">Loading…</option>`;
  try {
    const [{ managers }, { staff }] = await Promise.all([
      adminApi.listManagers(ticket.branchId),
      adminApi.listStaff(ticket.branchId),
    ]);
    const options = [
      ...managers.map((m) => ({ id: m.id, label: `${m.name} (Manager)` })),
      ...staff.map((s) => ({ id: s.id, label: `${s.name} (Staff)` })),
    ];
    select.innerHTML = options.length
      ? options.map((o) => `<option value="${o.id}">${o.label}</option>`).join("")
      : `<option value="">No one at this branch yet</option>`;
  } catch (err) {
    select.innerHTML = `<option value="">Couldn't load — ${err.message}</option>`;
  }
}
function closeAssignTicketModal() { document.getElementById("assignTicketModal").style.display = "none"; }
async function submitAssignTicket() {
  const staffId = document.getElementById("assignTicketTarget").value;
  if (!staffId) return showNotice("assignTicketNotice", "Pick someone to assign this to.");
  const btn = document.getElementById("assignTicketSubmitBtn");
  btn.disabled = true;
  try {
    await adminApi.assignTicket(_assignTicketId, staffId);
    closeAssignTicketModal();
    refreshTicketsTable();
  } catch (err) {
    showNotice("assignTicketNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}
async function resolveTicketRow(id) {
  try { await adminApi.resolveTicket(id); refreshTicketsTable(); }
  catch (err) { showNotice("ticketsNotice", err.message); }
}

/* ============================================================
   TAGS — a small, managed, per-branch/per-service picklist. Director
   or Manager curates this; every item-creation form across Rooms,
   Restaurant/Bar, Laundry, Spa, Events, and Upcoming Events picks
   from whatever's here for its service instead of free-typing.
   ============================================================ */
const TAG_SERVICE_LABELS = {
  restaurant: "Restaurant", bar: "Bar", laundry: "Laundry",
  room: "Rooms", spa: "Spa", events: "Events", upcoming_events: "Upcoming Events",
};
let _tagsSelectedBranchId = "";

async function loadTagsPage() {
  const container = document.getElementById("pageContent");
  let branchOptionsHtml = `<option value="">Select a branch…</option>`;
  let branches = [];
  try {
    ({ branches } = await adminApi.listBranches());
    if (!_tagsSelectedBranchId && branches.length) _tagsSelectedBranchId = branches[0].id;
    branchOptionsHtml = branches.map((b) => `<option value="${b.id}" ${b.id === _tagsSelectedBranchId ? "selected" : ""}>${b.name}</option>`).join("");
  } catch { /* non-fatal */ }

  container.innerHTML = `
    ${pageHeader("Tags", "A small, managed list per service — pick from these when creating an item so guests can browse by category.")}
    <div id="tagsNotice"></div>
    <div class="panel">
      <div class="form-row" style="align-items:flex-end;">
        <div class="form-field" style="max-width:320px;">
          <label>Branch</label>
          <select id="tagsBranchSelect" onchange="_tagsSelectedBranchId=this.value; refreshTagsPage();">${branchOptionsHtml}</select>
        </div>
        <div class="form-field" style="max-width:280px;">
          <label>New tag name</label>
          <input type="text" id="newTagName" placeholder="e.g. Breakfast, Traditional wear">
        </div>
        <div class="form-field" style="max-width:220px;">
          <label>Service</label>
          <select id="newTagService">
            ${Object.entries(TAG_SERVICE_LABELS).map(([val, label]) => `<option value="${val}">${label}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-primary" onclick="createTagConfirm()" ${_tagsSelectedBranchId ? "" : "disabled"} style="height:42px;">Add tag</button>
      </div>
    </div>
    <div id="tagsGroups">${_tagsSelectedBranchId ? `<div class="loading-state">Loading…</div>` : `<div class="empty-state">Pick a branch above.</div>`}</div>
  `;
  if (_tagsSelectedBranchId) await refreshTagsPage();
}

async function refreshTagsPage() {
  if (!_tagsSelectedBranchId) return;
  const container = document.getElementById("tagsGroups");
  container.innerHTML = `<div class="loading-state">Loading…</div>`;
  try {
    const { tags } = await adminApi.listTags(_tagsSelectedBranchId);
    if (!tags.length) { container.innerHTML = `<div class="empty-state">No tags yet for this branch — add one above.</div>`; return; }

    const byService = {};
    tags.forEach((t) => { (byService[t.service] = byService[t.service] || []).push(t); });

    container.innerHTML = Object.entries(TAG_SERVICE_LABELS)
      .filter(([service]) => byService[service])
      .map(([service, label]) => `
        <div class="panel">
          <h3>${label}</h3>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${byService[service].map((t) => `
              <span class="badge" style="display:inline-flex; align-items:center; gap:6px;">
                ${t.name}
                <button onclick="deleteTagConfirm('${t.id}')" style="background:none;border:none;cursor:pointer;color:inherit;opacity:0.6;padding:0;" title="Delete tag">&times;</button>
              </span>
            `).join("")}
          </div>
        </div>
      `).join("");
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

async function createTagConfirm() {
  const name = document.getElementById("newTagName").value.trim();
  const service = document.getElementById("newTagService").value;
  if (!name) return showNotice("tagsNotice", "Enter a tag name first.");
  try {
    await adminApi.createTag(_tagsSelectedBranchId, name, service);
    document.getElementById("newTagName").value = "";
    showNotice("tagsNotice", "Tag added.", "success");
    refreshTagsPage();
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

async function deleteTagConfirm(id) {
  if (!confirm("Delete this tag? Items that already used it keep the label — this only removes it from the picker for new ones.")) return;
  try {
    await adminApi.deleteTag(id, _tagsSelectedBranchId);
    refreshTagsPage();
  } catch (err) {
    showNotice("tagsNotice", err.message);
  }
}

      ${SITE_SETTINGS_TABS.map(([key, label], i) => `<button class="tab-btn ${i === 0 ? "active" : ""}" data-tab="${key}" onclick="switchSiteSettingsTab('${key}')">${label}</button>`).join("")}
    </div>

  try {
    const { settings } = await adminApi.getSiteSettings();

  } catch (err) {

function switchSiteSettingsTab(tab) {
  if (_siteSettingsDirty && !confirm("You have unsaved changes on this tab. Switch anyway and lose them?")) return;
  _siteSettingsTab = tab;
  document.querySelectorAll("#siteSettingsTabs .tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  _siteSettingsDirty = false;
  document.getElementById("siteSettingsSaveBar").classList.remove("show");
  renderSiteSettingsTab(tab);
}

function discardSiteSettingsChanges() {
  _siteSettingsDirty = false;
  document.getElementById("siteSettingsSaveBar").classList.remove("show");
  renderSiteSettingsTab(_siteSettingsTab);
}

function _watchSiteSettingsDirty() {
  const panel = document.getElementById("siteSettingsPanel");
  panel.querySelectorAll("input, select, textarea").forEach((el) => {
    el.addEventListener("input", _markSiteSettingsDirty);
    el.addEventListener("change", _markSiteSettingsDirty);
  });
}
function _markSiteSettingsDirty() {
  if (_siteSettingsDirty) return;
  _siteSettingsDirty = true;
  document.getElementById("siteSettingsSaveBar").classList.add("show");
}

function updateBannerPreview() {
  const enabled = document.getElementById("ssBannerEnabled")?.checked;
  const text = document.getElementById("ssBannerText")?.value || "";
  const type = document.getElementById("ssBannerType")?.value || "info";
  const preview = document.getElementById("ssBannerPreview");
  if (!preview) return;
  preview.className = `ss-banner-preview ${type} ${enabled && text ? "show" : ""}`;
  document.getElementById("ssBannerPreviewText").textContent = text;
}

async function saveSiteSettingsCurrentTab() {
  const panel = document.getElementById("siteSettingsPanel");
  const payload = {};

  panel.querySelectorAll("input[name], select[name], textarea[name]").forEach((el) => {
    if (el.type === "checkbox") {
      payload[el.name] = el.checked;
    } else if (el.type === "number") {
      payload[el.name] = el.value === "" ? undefined : Number(el.value);
    } else if (el.value !== "" || el.tagName === "TEXTAREA") {
      payload[el.name] = el.value;
    }
  });

  // maintenanceBypassToken is write-only and blank means "don't change it" —
  // never send an empty string, that would wipe out an existing token.
  if (payload.maintenanceBypassToken === "") delete payload.maintenanceBypassToken;

  // Social links live outside the normal name-attribute sweep since they're
  // nested under one JSON field on the model.
  if (_siteSettingsTab === "identity") {
    payload.socialLinks = {
      ...(window._siteSettings?.socialLinks || {}),
      instagram: document.getElementById("ssSocialInstagram")?.value || undefined,
      facebook: document.getElementById("ssSocialFacebook")?.value || undefined,
    };
  }

  try {
    const { settings } = await adminApi.updateSiteSettings(payload);
    window._siteSettings = settings;
    _siteSettingsDirty = false;
    document.getElementById("siteSettingsSaveBar").classList.remove("show");
    updateMaintenanceQuickCard(settings);
    showNotice("siteSettingsNotice", "Saved.", "success");
  } catch (err) {
    showNotice("siteSettingsNotice", err.message);
  }
}

function updateMaintenanceQuickCard(s) {
  const card = document.getElementById("ssMaintCard");
  const title = document.getElementById("ssMaintCardTitle");
  const status = document.getElementById("ssMaintCardStatus");
  const btn = document.getElementById("ssMaintToggleBtn");
  if (!card) return;
  card.classList.toggle("is-off", !s.maintenanceMode);
  title.textContent = s.maintenanceMode ? "Maintenance Mode — LIVE" : "Maintenance Mode";
  status.textContent = s.maintenanceMode ? "The public site is currently showing the maintenance page to guests." : "The public site is live and reachable by guests.";
  btn.textContent = s.maintenanceMode ? "Turn off" : "Turn on";
  btn.className = s.maintenanceMode ? "btn btn-primary" : "btn btn-danger";
}

async function toggleMaintenanceQuick() {
  const s = window._siteSettings || {};
  const btn = document.getElementById("ssMaintToggleBtn");
  btn.disabled = true;
  try {
    const { settings } = await adminApi.updateSiteSettings({ maintenanceMode: !s.maintenanceMode });
    window._siteSettings = settings;
    updateMaintenanceQuickCard(settings);
    if (_siteSettingsTab === "maintenance") renderSiteSettingsTab("maintenance");
    showNotice("siteSettingsNotice", settings.maintenanceMode ? "Maintenance mode turned ON." : "Maintenance mode turned OFF.", "success");
  } catch (err) {
    showNotice("siteSettingsNotice", err.message);
  } finally {
    btn.disabled = false;
  }
}

function exportSiteSettings() {
  const s = window._siteSettings || {};
  const blob = new Blob([JSON.stringify(s, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `hotel-settings-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importSiteSettings(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  if (!confirm("This will overwrite your current site settings with the contents of this file. Continue?")) {
    inputEl.value = "";
    return;
  }
  try {
    const text = await file.text();
    const imported = JSON.parse(text);
    // Strip read-only/system fields that shouldn't be re-sent.
    delete imported.id; delete imported.updatedAt; delete imported.updatedById; delete imported.hasMaintenanceBypassToken;
    const { settings } = await adminApi.updateSiteSettings(imported);
    window._siteSettings = settings;
    updateMaintenanceQuickCard(settings);
    renderSiteSettingsTab(_siteSettingsTab);
    showNotice("siteSettingsNotice", "Settings imported and saved.", "success");
  } catch (err) {
    showNotice("siteSettingsNotice", "Import failed: " + err.message);
  } finally {
    inputEl.value = "";
  }
}

async function moderateReviewRow(id, status) {
  try { await adminApi.moderateReview(id, status); refreshReviewsList(); }

async function replyToReviewRow(id) {
  const reply = prompt("Reply to this review:");

  try { await adminApi.replyToReview(id, reply); refreshReviewsList(); }

   ============================================================ */
function showLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("appShell").style.display = "none";
}
function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  renderSidebar();
  switchPage("dashboard");
  refreshTicketsBadgeSilently();
}
async function refreshTicketsBadgeSilently() {
  if (!hasPermission("handle_tickets")) return;
  try {
    const { tickets } = await adminApi.listTickets("OPEN");
    const badge = document.getElementById("ticketsBellBadge");
    if (badge) { badge.textContent = tickets.length; badge.style.display = tickets.length ? "flex" : "none"; }
  } catch { /* silent — this is a background badge refresh, not worth surfacing an error for */ }
}

let _pendingTempToken = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const notice = document.getElementById("loginNotice");
  notice.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Logging in…";
  try {
    const result = await adminApi.login(
      document.getElementById("loginEmail").value,
      document.getElementById("loginPassword").value
    );
    if (result.requires2FA) {
      _pendingTempToken = result.tempToken;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("twoFactorLoginForm").style.display = "block";
      document.getElementById("twoFactorCode").focus();
      return;
    }
    setSession(result.token, result.staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Log in";
  }
});

document.getElementById("twoFactorLoginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("twoFactorLoginBtn");
  const notice = document.getElementById("twoFactorLoginNotice");
  notice.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Verifying…";
  try {
    const { token, staff } = await adminApi.loginTwoFactor(_pendingTempToken, document.getElementById("twoFactorCode").value.trim());
    setSession(token, staff);
    showApp();
  } catch (err) {
    notice.innerHTML = `<div class="notice error">${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Verify";
  }
});

function cancelTwoFactorLogin() {
  _pendingTempToken = null;
  document.getElementById("twoFactorLoginForm").style.display = "none";
  document.getElementById("twoFactorLoginForm").reset();
  document.getElementById("loginForm").style.display = "block";
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  clearSession();
  showLogin();
});
document.getElementById("hamburgerBtn").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});
document.getElementById("ticketsBellBtn").addEventListener("click", () => switchPage("tickets"));

// Boot
if (getToken() && getStaff()) { showApp(); } else { showLogin(); }
</script>
</body>
</html>
